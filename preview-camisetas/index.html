<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Camisetas · Forja do Herói (prévia)</title>
<style>
body{margin:0;background:#07090f;color:#eef2ff;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:28px 5vw 8px}h1{margin:0;font-size:clamp(24px,4vw,38px)}p{color:#9aa6c4;margin:6px 0 0}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:18px;padding:20px 5vw 48px}
figure{margin:0;background:#0e1322;border:1px solid #1f2a44;border-radius:14px;overflow:hidden}
figure img{width:100%;display:block;aspect-ratio:3/2;object-fit:cover;cursor:zoom-in}
figcaption{padding:10px 14px;font-weight:600}
#z{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:9}#z img{max-width:96vw;max-height:94vh}
</style></head><body>
<header><h1>Camisetas Forja do Herói — prévia</h1><p>Frente com o logo pequeno no peito esquerdo · costas com a estampa grande. Toque numa imagem para ampliar.</p></header>
<main id="g"></main><div id="z"><img alt=""></div>
<script>{const B='https://lpdicrpetxqnoxceozfa.supabase.co/storage/v1/object/public/fh/art/tee2/';
const L=[['logo','Brasão Forja do Herói'],['guerreiro','Guerreiro'],['guerreira','Guerreira'],['monge','Monge'],['paladino','Paladino'],['mestres','Os Três Mestres'],['rei','Eu derrotei o Rei Demônio'],['levelup','Você subiu de nível']];
const g=document.getElementById('g'),z=document.getElementById('z');
g.innerHTML=L.map(([f,n])=>`<figure><img src="${B}${f}.jpg" alt="${n}" loading="lazy"><figcaption>${n}</figcaption></figure>`).join('');
g.onclick=e=>{if(e.target.tagName==='IMG'){z.firstChild.src=e.target.src;z.style.display='flex'}};z.onclick=()=>z.style.display='none';}</script>
</body></html>
