<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05070d">
<title>Central do Mestre · Forja do Herói</title>
<link rel="icon" href="/app/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,700;1,800&family=Jost:wght@500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050913;--panel:rgba(10,22,50,.92);--line:#8fe6ff;--txt:#e8f2ff;--dim:#9fb6d6;--gold:#ffd25a;--purple:#b48cff;--green:#4ff0c8;--red:#ff6a7a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:Rajdhani,system-ui,sans-serif;font-size:16px;font-weight:500}
body{min-height:100vh;background:radial-gradient(900px 600px at 50% -150px,#13224a,transparent 70%),radial-gradient(60% 40% at 0% 50%,rgba(120,50,220,.15),transparent 70%),linear-gradient(rgba(79,170,255,.04) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,rgba(79,170,255,.04) 1px,transparent 1px) 0 0/22px 22px,#050913;background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.wrap{max-width:1200px;margin:0 auto;padding:14px 14px 60px}
.ch{clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px);position:relative;background:linear-gradient(180deg,rgba(12,26,58,.96),rgba(6,14,34,.96))}
.ch:after{content:"";position:absolute;inset:0;pointer-events:none;background:var(--bc,var(--line));clip-path:polygon(evenodd,12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px,12px 0,12.6px 1.5px,1.5px 12.6px,1.5px calc(100% - 12.6px),12.6px calc(100% - 1.5px),calc(100% - 12.6px) calc(100% - 1.5px),calc(100% - 1.5px) calc(100% - 12.6px),calc(100% - 1.5px) 12.6px,calc(100% - 12.6px) 1.5px,12.6px 1.5px)}
.glow{filter:drop-shadow(0 0 6px rgba(63,200,255,.45))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-family:Jost;font-weight:700;letter-spacing:.1em;color:#8ce6ff;text-shadow:0 0 10px rgba(79,210,255,.7);font-size:18px;line-height:1.1}
.brand small{display:block;font-family:Rajdhani;font-size:11px;letter-spacing:.4em;color:var(--dim);text-shadow:none}
.hr{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1.5px solid rgba(143,230,255,.7);border-radius:8px;background:rgba(20,50,100,.5);font-weight:700;white-space:nowrap}
.btn:hover{background:rgba(30,80,150,.6)}
.btn.gold{border-color:#ffe08a;background:linear-gradient(180deg,#ffe07a,#f0a81a);color:#2a1800}
.btn.sm{padding:5px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.ttl{font-family:'Exo 2';font-style:italic;font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-size:20px;text-shadow:0 0 10px rgba(120,220,255,.7);margin:22px 0 10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{padding:12px 14px}
.kpi small{display:block;font-size:12px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.kpi b{display:block;font-family:Jost;font-weight:800;font-size:28px;margin-top:2px}
.kpi span{font-size:13px;color:var(--dim)}
.kpi.g{--bc:#ffe08a}.kpi.g b{color:var(--gold)}.kpi.p{--bc:#d2b2ff}.kpi.p b{color:#d9c2ff}.kpi.v b{color:var(--green)}
.tabs{display:flex;gap:8px;margin:18px 0 12px;flex-wrap:wrap}
.tabs button{padding:8px 16px;border-radius:99px;border:1.5px solid rgba(143,230,255,.45);font-weight:700;color:var(--dim)}
.tabs button.on{color:#fff;border-color:var(--line);background:rgba(30,90,170,.45);box-shadow:0 0 10px rgba(79,210,255,.5)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.bar input,.bar select,.field input,.field select,.field textarea{padding:9px 12px;border-radius:8px;border:1.5px solid rgba(143,230,255,.45);background:rgba(6,14,34,.9);outline:none}
.bar input{flex:1;min-width:200px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:5px 12px;border-radius:99px;border:1.5px solid rgba(160,190,230,.4);font-size:14px;font-weight:600;color:#dce8fa}
.chips button.on{border-color:var(--line);color:#bff3ff;background:rgba(30,90,170,.35)}
table{width:100%;border-collapse:collapse}
.tbl{padding:6px 10px}
th{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-align:left;padding:10px 8px;border-bottom:1px solid rgba(143,230,255,.25);font-weight:700}
td{padding:10px 8px;border-bottom:1px solid rgba(143,230,255,.12);vertical-align:middle;font-size:15px}
tr.row{cursor:pointer}tr.row:hover td{background:rgba(40,90,170,.18)}
.who b{display:block;font-weight:700}.who small{color:var(--dim);font-size:13px;word-break:break-all}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:800;letter-spacing:.06em;border:1.5px solid}
.pill.elite{color:#2a1800;background:linear-gradient(180deg,#ffe07a,#f0a81a);border-color:#ffe9a8}
.pill.recruta{color:#bff3ff;border-color:#8fe6ff;background:rgba(30,90,170,.35)}
.pill.none{color:var(--dim);border-color:rgba(160,190,230,.35)}
.pill.adm{color:#e9d9ff;border-color:var(--purple);background:rgba(110,60,200,.35)}
.st{font-weight:700}.st.ok{color:var(--green)}.st.warn{color:var(--gold)}.st.bad{color:var(--red)}.st.mute{color:var(--dim)}
.lv{font-family:Jost;font-weight:800;font-size:18px}
.rk{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 14px;margin-bottom:8px}
.rk .pos{font-family:Jost;font-weight:800;font-size:22px;text-align:center;color:var(--dim)}
.rk:nth-child(1) .pos{color:var(--gold)}.rk:nth-child(2) .pos{color:#dfe8f5}.rk:nth-child(3) .pos{color:#e0a060}
.rk .xp{font-family:Jost;font-weight:800;font-size:18px;color:var(--green);text-align:right}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;align-items:start}
.box{padding:16px}
.field{margin-bottom:12px}.field label{display:block;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:5px;font-weight:700}
.field input,.field select,.field textarea{width:100%}
.field textarea{min-height:90px;resize:vertical}
.tpl{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.tpl button{text-align:left;padding:8px 12px;border-radius:8px;border:1px solid rgba(143,230,255,.3);background:rgba(10,24,56,.7);font-size:14px}
.tpl button b{color:#bff3ff}
.prev{margin-top:4px;padding:12px;border-radius:12px;background:#1c2333;border:1px solid #33405a;display:flex;gap:10px}
.prev img{width:36px;height:36px;border-radius:8px}
.prev b{display:block;font-size:14px}.prev span{font-size:13.5px;color:#c8d3e6}
.hist div{padding:8px 0;border-bottom:1px solid rgba(143,230,255,.12);font-size:14px}
.hist small{color:var(--dim)}
.note{font-size:13.5px;color:var(--dim);margin-top:8px}
.drawer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;justify-content:flex-end}
.drawer .in{width:min(460px,100%);height:100%;overflow:auto;padding:16px;background:#071330;border-left:1.5px solid var(--line);box-shadow:0 0 30px rgba(79,210,255,.35)}
.drawer h3{font-family:Jost;font-size:22px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:12px 0;font-size:15px}.kv small{color:var(--dim);letter-spacing:.06em}
.ord{padding:10px 12px;margin-top:8px}
.login{max-width:380px;margin:12vh auto 0;padding:22px}
.login h1{font-family:'Exo 2';font-style:italic;font-weight:800;letter-spacing:.12em;font-size:24px;text-align:center;margin-bottom:4px}
.login p{text-align:center;color:var(--dim);margin-bottom:16px}
.err{color:var(--red);margin-top:8px;text-align:center}
.empty{padding:22px;text-align:center;color:var(--dim)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;padding:10px 18px;border-radius:10px;background:#0b1f45;border:1.5px solid var(--line);box-shadow:0 0 16px rgba(79,210,255,.5);font-weight:700}
@media (max-width:820px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tr.row{padding:10px 4px;border-bottom:1px solid rgba(143,230,255,.2)}
  td{border:0;padding:3px 6px}
  td[data-l]:before{content:attr(data-l)': ';color:var(--dim);font-size:13px}
  td.who{padding-bottom:6px}
}
</style>
</head>
<body>
<div class="wrap" id="root"><div class="empty">Carregando…</div></div>
<script src="/app/supabase.js"></script>
<script>
const URL_='https://lpdicrpetxqnoxceozfa.supabase.co', KEY='sb_publishable_ceGy_dHSjG3cngC8mVAPLg_R4sxr5kA';
const FN=URL_+'/functions/v1/fh-push';
const sb=window.supabase.createClient(URL_,KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'fh-auth'}});
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>'R$ '+Number(n||0).toFixed(2).replace('.',',');
const fmt=n=>Math.round(n||0).toLocaleString('pt-BR');
const CLS={paladino:'Paladino',guerreiro:'Guerreiro',monge:'Monge'};
const RANKS=[[1,'Recruta'],[5,'Escudeiro'],[10,'Guerreiro'],[20,'Cavaleiro'],[30,'Campeão'],[45,'Senhor da Guerra'],[60,'Lenda'],[80,'Titã'],[100,'Deus do Ferro']];
const xpNeed=L=>Math.round(80*Math.pow(L,1.6));
function lvl(xp){let L=1,r=xp;while(r>=xpNeed(L)){r-=xpNeed(L);L++}return L}
function rankOf(L){let r=RANKS[0][1];for(const [l,n] of RANKS)if(L>=l)r=n;return r}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function daysAgo(ymd){if(!ymd)return null;const [y,m,d]=ymd.split('-').map(Number);return Math.round((new Date(today()+'T12:00')-new Date(y,m-1,d,12))/864e5)}
function ago(ts){if(!ts)return '—';const s=(Date.now()-new Date(ts))/1000;if(s<3600)return Math.max(1,Math.round(s/60))+' min';if(s<86400)return Math.round(s/3600)+' h';return Math.round(s/86400)+' d'}
function dt(ts){if(!ts)return '—';const d=new Date(ts);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3500)}

let P=[], LOG=[], TAB='jogadores', FILTER='todos', Q='';
function status(p){
  const da=daysAgo(p.last_day);
  if(p.last_day===today()) return ['ok','Treinou hoje'];
  if(da!==null&&da<=2) return ['ok','Ativo ('+da+'d)'];
  if(da!==null&&da<=6) return ['warn','Sumiu há '+da+'d'];
  if(da!==null) return ['bad','Inativo há '+da+'d'];
  if(p.hero) return ['warn','Criou herói, não treinou'];
  if(p.user_id) return ['mute','Criou conta, sem herói'];
  return ['bad','Comprou e não entrou'];
}
const FILTERS=[['todos','Todos'],['elite','Elite'],['recruta','Recruta'],['hoje','Treinou hoje'],['ativos','Ativos 7d'],['sumidos','Sumidos'],['nunca','Nunca treinou'],['naoentrou','Comprou e não entrou']];
function pass(p){
  const da=daysAgo(p.last_day);
  if(FILTER==='elite'&&p.plan!=='elite')return false;
  if(FILTER==='recruta'&&p.plan!=='recruta')return false;
  if(FILTER==='hoje'&&p.last_day!==today())return false;
  if(FILTER==='ativos'&&!(da!==null&&da<=6))return false;
  if(FILTER==='sumidos'&&!(da!==null&&da>=3))return false;
  if(FILTER==='nunca'&&p.last_day)return false;
  if(FILTER==='naoentrou'&&(p.user_id||!p.orders))return false;
  if(Q){const q=Q.toLowerCase();if(!((p.email||'')+' '+(p.hero||'')+' '+(p.buyer||'')).toLowerCase().includes(q))return false}
  return true;
}

function kpis(){
  const buyers=P.filter(p=>p.spent>0);
  const rev=buyers.reduce((a,p)=>a+Number(p.spent),0);
  const elite=P.filter(p=>p.plan==='elite'&&!p.is_admin).length, rec=P.filter(p=>p.plan==='recruta').length;
  const hoje=P.filter(p=>p.last_day===today()).length;
  const at7=P.filter(p=>{const d=daysAgo(p.last_day);return d!==null&&d<=6}).length;
  const push=P.filter(p=>p.push_on).length;
  const noEnter=P.filter(p=>p.orders&&!p.user_id).length;
  const bumps=buyers.filter(p=>(p.orders||[]).some(o=>o.bumps&&o.bumps.length)).length;
  return `<div class="kpis">
   <div class="kpi ch g glow"><small>Faturamento</small><b>${brl(rev)}</b><span>${buyers.length} comprador(es) · ${bumps} com order bump</span></div>
   <div class="kpi ch p glow"><small>Planos</small><b>${elite} <span style="font-size:15px">Elite</span> · ${rec} <span style="font-size:15px">Recruta</span></b><span>${noEnter} comprou e ainda não entrou</span></div>
   <div class="kpi ch v glow"><small>Treinaram hoje</small><b>${hoje}</b><span>${at7} ativos nos últimos 7 dias</span></div>
   <div class="kpi ch glow"><small>Notificação ligada</small><b>${push}</b><span>de ${P.filter(p=>p.user_id).length} contas</span></div>
  </div>`;
}
function viewPlayers(){
  const L=P.filter(pass);
  return `<div class="bar"><input id="q" placeholder="Buscar por e-mail, nome do herói ou comprador" value="${esc(Q)}"></div>
  <div class="chips" style="margin-bottom:12px">${FILTERS.map(([k,n])=>`<button class="${FILTER===k?'on':''}" data-f="${k}">${n} <small>(${(()=>{const o=FILTER;FILTER=k;const c=P.filter(pass).length;FILTER=o;return c})()})</small></button>`).join('')}</div>
  <div class="tbl ch glow">${L.length?`<table><thead><tr><th>Jogador</th><th>Plano</th><th>Situação</th><th>Nível</th><th>Dias treinados</th><th>Último login</th><th>Gastou</th><th>Lembrete</th></tr></thead><tbody>
  ${L.map(p=>{const [c,t]=status(p);const L_=lvl(p.xp);return `<tr class="row" data-e="${esc(p.email)}">
   <td class="who"><b>${esc(p.hero||p.buyer||'—')}${p.is_admin?' <span class="pill adm">ADMIN</span>':''}</b><small>${esc(p.email)}</small></td>
   <td data-l="Plano"><span class="pill ${p.plan||'none'}">${p.plan?p.plan.toUpperCase():'SEM PLANO'}</span></td>
   <td data-l="Situação"><span class="st ${c}">${t}</span></td>
   <td data-l="Nível"><span class="lv">${p.hero?L_:'—'}</span> <small style="color:var(--dim)">${p.hero?rankOf(L_):''}</small></td>
   <td data-l="Dias treinados">${p.days} <small style="color:var(--dim)">· ${fmt(p.sets)} séries</small></td>
   <td data-l="Último login">${p.last_login?ago(p.last_login)+' atrás':'nunca'}</td>
   <td data-l="Gastou">${p.spent>0?brl(p.spent):'—'}</td>
   <td data-l="Lembrete">${p.push_on?'🔔 '+esc(p.train_time):'—'}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">Nenhum jogador nesse filtro.</div>'}</div>`;
}
function viewRank(){
  const L=P.filter(p=>p.hero&&!p.is_admin).sort((a,b)=>b.xp-a.xp);
  if(!L.length) return '<div class="box ch glow empty">Ainda ninguém criou herói.</div>';
  return L.map((p,i)=>{const L_=lvl(p.xp);return `<div class="rk ch glow" data-e="${esc(p.email)}" style="cursor:pointer"><span class="pos">${i+1}º</span><div><b>${esc(p.hero)}</b> <span class="pill ${p.plan||'none'}" style="margin-left:6px">${(p.plan||'—').toUpperCase()}</span><br><small style="color:var(--dim)">${CLS[p.cls]||''} · Nível ${L_} · ${rankOf(L_)} · ${p.bosses} chefes · ${p.dungeon} dias de dungeon · ${p.days} dias treinados</small></div><span class="xp">${fmt(p.xp)} XP</span></div>`}).join('');
}
const TPL=[
 ['all','[SISTEMA] Nova missão disponível','{nome}, uma nova missão foi liberada. Entre no app e cumpra para receber XP.'],
 ['inactive3','[SISTEMA] Jogador ausente detectado','{nome}, faz dias que você não treina. O despertar está ficando para trás. Volte hoje.'],
 ['never','[SISTEMA] Seu despertar ainda não começou','{nome}, seu herói está esperando a primeira missão. Registre um treino e receba seu primeiro XP.'],
 ['recruta','[SISTEMA] A Dungeon está bloqueada para você','{nome}, Caçadores Elite já estão enfrentando a Dungeon. Evolua seu plano e entre também.'],
 ['all','[SISTEMA] Evento especial','{nome}, hoje o XP está em dobro. Não perca.'],
];
const TARGETS=[['all','Todos com notificação ligada'],['notToday','Quem ainda não treinou hoje'],['inactive3','Sumidos há 3+ dias'],['never','Nunca treinaram'],['elite','Só Elite'],['recruta','Só Recruta']];
function viewPush(){
  const on=P.filter(p=>p.push_on).length;
  return `<div class="grid2">
  <div class="box ch glow">
   <div class="field"><label>Modelos prontos</label><div class="tpl">${TPL.map((t,i)=>`<button data-tpl="${i}"><b>${esc(t[1])}</b><br>${esc(t[2])}</button>`).join('')}</div></div>
   <div class="field"><label>Para quem</label><select id="p_t">${TARGETS.map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select></div>
   <div class="field"><label>Título</label><input id="p_ti" maxlength="80" value="[SISTEMA] "></div>
   <div class="field"><label>Mensagem</label><textarea id="p_b" maxlength="240" placeholder="Use {nome} para colocar o nome do jogador"></textarea></div>
   <div class="field"><label>Abrir em</label><select id="p_u"><option value="/app/">Tela inicial</option><option value="/app/?tab=treinar">Treinar</option><option value="/app/?tab=missoes">Missões</option></select></div>
   <div class="field"><label>Prévia</label><div class="prev"><img src="/app/icons/icon-192.png" alt=""><div><b id="pv_t">[SISTEMA]</b><span id="pv_b">…</span></div></div></div>
   <button class="btn gold" id="p_send">🔔 Enviar notificação</button>
   <p class="note">${on} pessoa(s) com notificação ligada. Só recebe quem ativou o lembrete no app.</p>
  </div>
  <div class="box ch glow"><div class="field"><label>Últimos envios</label></div><div class="hist">${LOG.length?LOG.map(l=>`<div><b>${esc(l.title)}</b><br>${esc(l.body)}<br><small>${dt(l.sent_at)} · ${esc((TARGETS.find(t=>t[0]===l.target)||[0,l.target])[1])} · ✅ ${l.sent} enviada(s)${l.failed?` · ❌ ${l.failed}`:''}</small></div>`).join(''):'<p class="note">Nenhum envio ainda.</p>'}</div></div>
  </div>`;
}
function drawer(email){
  const p=P.find(x=>x.email===email);if(!p)return;
  const [c,t]=status(p);const L_=lvl(p.xp);
  const d=document.createElement('div');d.className='drawer';d.innerHTML=`<div class="in">
   <div style="display:flex;justify-content:space-between;align-items:center"><h3>${esc(p.hero||p.buyer||p.email)}</h3><button class="btn sm" data-x>✕</button></div>
   <span class="pill ${p.plan||'none'}">${p.plan?p.plan.toUpperCase():'SEM PLANO'}</span> <span class="st ${c}" style="margin-left:6px">${t}</span>
   <div class="kv">
    <small>E-mail</small><span>${esc(p.email)}</span>
    <small>Comprador</small><span>${esc(p.buyer||'—')}</span>
    <small>Conta criada</small><span>${dt(p.signup)}</span>
    <small>Último login</small><span>${dt(p.last_login)}</span>
    <small>Último treino</small><span>${p.last_day||'nunca'}</span>
    <small>Herói</small><span>${p.hero?esc(p.hero)+' · '+(CLS[p.cls]||''):'—'}${p.title?' · « '+esc(p.title)+' »':''}</span>
    <small>Nível</small><span>${p.hero?L_+' · '+rankOf(L_):'—'} · ${fmt(p.xp)} XP</span>
    <small>Treino</small><span>${p.days} dias · ${fmt(p.sets)} séries</span>
    <small>Conquistas</small><span>${p.bosses} chefes · ${p.quests} missões · ${p.dungeon} dias de dungeon</span>
    <small>Lembrete</small><span>${p.push_on?'Ligado às '+esc(p.train_time)+(p.push_last?' · último aviso '+ago(p.push_last)+' atrás':''):'Desligado'}</span>
   </div>
   <div class="ttl" style="font-size:16px;margin-top:10px;display:flex;justify-content:space-between;align-items:center">Compras <button class="btn sm" data-grant>＋ Liberar item/plano</button></div>
   ${(p.orders||[]).map(o=>`<div class="ord ch" style="--bc:${o.plan==='elite'?'#ffe08a':'#8fe6ff'}"><b>${o.plan==='elite'?'Caçador Elite':'Recruta'}</b>${o.manual?' <span class="pill adm">MANUAL</span>':''} · ${brl(o.amount)} · <span class="st ${o.status==='pago'?'ok':'warn'}">${esc(o.status)}</span><br><small style="color:var(--dim)">${dt(o.paid_at)} · ${esc(o.method||'')}</small>${o.bumps&&o.bumps.length?`<br><small>➕ ${o.bumps.map(esc).join(', ')}</small>`:''}${o.upsells&&o.upsells.length?`<br><small>⬆️ ${o.upsells.map(esc).join(', ')}</small>`:''}${o.campaign?`<br><small style="color:var(--dim)">📣 ${esc(o.campaign)}${o.ad?' · '+esc(o.ad):''}</small>`:''}${o.note?`<br><small style="color:var(--dim)">📝 ${esc(o.note)}</small>`:''}<div style="margin-top:8px">${o.status==='pago'?`<button class="btn sm" data-st="cancelado" data-o="${esc(o.id)}">Cancelar acesso</button>`:`<button class="btn sm" data-st="pago" data-o="${esc(o.id)}">Reativar acesso</button>`}</div></div>`).join('')||'<p class="note">Sem compras registradas (conta de teste ou admin).</p>'}
   ${p.push_on&&p.user_id?`<div class="ttl" style="font-size:16px">Mandar notificação só pra ele</div>
   <div class="field"><input id="d_t" value="[SISTEMA] " maxlength="80"></div><div class="field"><textarea id="d_b" maxlength="240" placeholder="Mensagem"></textarea></div>
   <button class="btn gold" data-send1="${p.user_id}">🔔 Enviar</button>`:''}
  </div>`;
  d.addEventListener('click',e=>{if(e.target===d||e.target.closest('[data-x]'))d.remove();if(e.target.closest('[data-grant]')){d.remove();grantForm(p.email,p.buyer||p.hero||'');return}const st=e.target.closest('[data-st]');if(st){if(!confirm(st.dataset.st==='pago'?'Reativar este acesso?':'Cancelar este acesso? A pessoa perde o plano no app.'))return;sb.rpc('fh_admin_set_status',{p_order_id:st.dataset.o,p_status:st.dataset.st}).then(async r=>{if(r.error)return toast('❌ '+r.error.message);toast('✅ Atualizado');d.remove();await load();drawer(email)});return}
  const s=e.target.closest('[data-send1]');if(s)send({target:'users',user_ids:[s.dataset.send1],title:$('#d_t').value,body:$('#d_b').value,url:'/app/'},s)});
  document.body.appendChild(d);
}

const BUMPS=['Grimório da Alimentação do Herói','Missões Relâmpago','Pergaminho da Regeneração','Diário do Caçador · 90 dias','Arsenal Completo (todos os aceleradores + bônus)'];
function grantForm(email='',name=''){
  const d=document.createElement('div');d.className='drawer';d.innerHTML=`<form class="in" id="gf">
   <div style="display:flex;justify-content:space-between;align-items:center"><h3>Cadastrar acesso</h3><button type="button" class="btn sm" data-x>✕</button></div>
   <p class="note" style="margin-bottom:12px">Use quando alguém comprou e não recebeu, ou para dar acesso de cortesia. Depois a pessoa entra no app em <b>Criar acesso</b> com este e-mail e cria a senha.</p>
   <div class="field"><label>E-mail da pessoa</label><input id="g_e" type="email" required value="${esc(email)}"></div>
   <div class="field"><label>Nome</label><input id="g_n" value="${esc(name)}"></div>
   <div class="field"><label>Plano</label><div class="chips" id="g_p"><button type="button" data-p="recruta">Recruta</button><button type="button" class="on" data-p="elite">Caçador Elite</button></div></div>
   <div class="field"><label>Order bumps</label>${BUMPS.map((b,i)=>`<label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:15px;color:var(--txt);margin:6px 0"><input type="checkbox" value="${esc(b)}" class="g_b" style="width:auto"> ${esc(b)}</label>`).join('')}</div>
   <div class="field"><label>Upsells / outros itens</label><input id="g_u" placeholder="Separe por vírgula (ex.: Upgrade Elite pop-up)"></div>
   <div class="field"><label>Valor pago (opcional)</label><input id="g_v" type="number" step="0.01" min="0" placeholder="0,00"></div>
   <div class="field"><label>Observação</label><input id="g_o" placeholder="Ex.: pagou por Pix e não recebeu"></div>
   <button class="btn gold" style="width:100%;justify-content:center">✅ Liberar acesso</button>
   <p class="note">Os e-books dos order bumps continuam sendo entregues por e-mail pela Digital Hub. Aqui fica registrado o que a pessoa tem.</p></form>`;
  document.body.appendChild(d);
  d.addEventListener('click',e=>{if(e.target===d||e.target.closest('[data-x]'))d.remove();const b=e.target.closest('[data-p]');if(b){d.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('on',x===b))}});
  d.querySelector('#gf').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;
    const plan=d.querySelector('[data-p].on').dataset.p;
    const r=await sb.rpc('fh_admin_grant',{p_email:d.querySelector('#g_e').value,p_name:d.querySelector('#g_n').value,p_plan:plan,
      p_bumps:[...d.querySelectorAll('.g_b:checked')].map(x=>x.value),p_upsells:d.querySelector('#g_u').value.split(',').map(x=>x.trim()).filter(Boolean),
      p_amount:+d.querySelector('#g_v').value||0,p_note:d.querySelector('#g_o').value||null});
    btn.disabled=false;if(r.error)return toast('❌ '+r.error.message);
    toast(r.data.has_account?'✅ Liberado! A pessoa já tem conta, é só entrar.':'✅ Liberado! A pessoa já pode criar o acesso no app.');d.remove();await load();};
}
async function send(payload,btn){
  if(!payload.title.trim()||!payload.body.trim()){toast('Preencha título e mensagem');return}
  btn.disabled=true;
  try{const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token,apikey:KEY},body:JSON.stringify(payload)});
    const j=await r.json();if(!r.ok)throw new Error(j.error||'erro');
    toast(`✅ Enviada para ${j.sent} de ${j.total} pessoa(s)`);await load();
  }catch(e){toast('❌ '+e.message)}finally{btn.disabled=false}
}
function render(){
  $('#root').innerHTML=`<header><div class="brand">CENTRAL DO MESTRE<small>FORJA DO HERÓI · ADMIN</small></div><div class="hr"><button class="btn gold sm" id="add">＋ Cadastrar acesso</button><button class="btn sm" id="rl">↻ Atualizar</button><button class="btn sm" id="out">Sair</button></div></header>
  ${kpis()}
  <div class="tabs">${[['jogadores','👥 Jogadores'],['ranking','🏆 Ranking'],['notif','🔔 Notificações']].map(([k,n])=>`<button class="${TAB===k?'on':''}" data-tab="${k}">${n}</button>`).join('')}</div>
  <div id="view">${TAB==='jogadores'?viewPlayers():TAB==='ranking'?viewRank():viewPush()}</div>`;
  bind();
}
function bind(){
  $('#add').onclick=()=>grantForm();
  $('#rl').onclick=()=>load().then(()=>toast('Atualizado'));
  $('#out').onclick=async()=>{await sb.auth.signOut();login()};
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;render()});
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{FILTER=b.dataset.f;render()});
  document.querySelectorAll('[data-e]').forEach(r=>r.onclick=()=>drawer(r.dataset.e));
  const q=$('#q');if(q)q.oninput=()=>{Q=q.value;const pos=q.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)};
  if(TAB==='notif'){
    const pv=()=>{$('#pv_t').textContent=$('#p_ti').value.replaceAll('{nome}','Juliano');$('#pv_b').textContent=($('#p_b').value||'…').replaceAll('{nome}','Juliano')};
    $('#p_ti').oninput=pv;$('#p_b').oninput=pv;pv();
    document.querySelectorAll('[data-tpl]').forEach(b=>b.onclick=()=>{const t=TPL[+b.dataset.tpl];$('#p_t').value=t[0];$('#p_ti').value=t[1];$('#p_b').value=t[2];pv()});
    $('#p_send').onclick=e=>{const tg=$('#p_t');if(!confirmSend(tg.options[tg.selectedIndex].text))return;send({target:tg.value,title:$('#p_ti').value,body:$('#p_b').value,url:$('#p_u').value},e.currentTarget)};
  }
}
function confirmSend(who){return window.confirm('Enviar esta notificação para: '+who+'?')}
async function load(){
  const [a,b]=await Promise.all([sb.rpc('fh_admin_players'),sb.rpc('fh_admin_push_log')]);
  if(a.error)throw a.error;P=a.data||[];LOG=b.data||[];render();
}
function login(msg=''){
  $('#root').innerHTML=`<form class="login ch glow" id="lf"><h1>CENTRAL DO MESTRE</h1><p>Acesso restrito ao administrador</p>
   <div class="field"><label>E-mail</label><input id="le" type="email" autocomplete="username" required></div>
   <div class="field"><label>Senha</label><input id="lp" type="password" autocomplete="current-password" required></div>
   <button class="btn gold" style="width:100%;justify-content:center">Entrar</button>${msg?`<p class="err">${esc(msg)}</p>`:''}</form>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:$('#le').value.trim().toLowerCase(),password:$('#lp').value});if(error)return login('E-mail ou senha incorretos');boot()};
}
async function boot(){
  const {data:{session}}=await sb.auth.getSession();if(!session)return login();
  const {data:me}=await sb.rpc('fh_me');if(!me||!me.admin){await sb.auth.signOut();return login('Esta conta não é de administrador')}
  try{await load()}catch(e){$('#root').innerHTML='<div class="empty">Erro ao carregar: '+esc(e.message)+'</div>'}
}
boot();
</script>
</body>
</html>
