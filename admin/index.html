<style>
:root{--bg:#050913;--panel:rgba(10,22,50,.92);--line:#8fe6ff;--txt:#e8f2ff;--dim:#9fb6d6;--gold:#ffd25a;--purple:#b48cff;--green:#4ff0c8;--red:#ff6a7a}

html,body{background:var(--bg);color:var(--txt);font-family:Rajdhani,system-ui,sans-serif;font-size:16px;font-weight:500}
body{min-height:100vh;background:radial-gradient(900px 600px at 50% -150px,#13224a,transparent 70%),radial-gradient(60% 40% at 0% 50%,rgba(120,50,220,.15),transparent 70%),linear-gradient(rgba(79,170,255,.04) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,rgba(79,170,255,.04) 1px,transparent 1px) 0 0/22px 22px,#050913;background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.wrap{max-width:1200px;margin:0 auto;padding:14px 14px 60px}
.ch{clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px);position:relative;background:linear-gradient(180deg,rgba(12,26,58,.96),rgba(6,14,34,.96))}
.ch:after{content:"";position:absolute;inset:0;pointer-events:none;background:var(--bc,var(--line));clip-path:polygon(evenodd,12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px,12px 0,12.6px 1.5px,1.5px 12.6px,1.5px calc(100% - 12.6px),12.6px calc(100% - 1.5px),calc(100% - 12.6px) calc(100% - 1.5px),calc(100% - 1.5px) calc(100% - 12.6px),calc(100% - 1.5px) 12.6px,calc(100% - 12.6px) 1.5px,12.6px 1.5px)}
.glow{filter:drop-shadow(0 0 6px rgba(63,200,255,.45))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-family:Jost;font-weight:700;letter-spacing:.1em;color:#8ce6ff;text-shadow:0 0 10px rgba(79,210,255,.7);font-size:18px;line-height:1.1}
.brand small{display:block;font-family:Rajdhani;font-size:11px;letter-spacing:.4em;color:var(--dim);text-shadow:none}
.hr{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1.5px solid rgba(143,230,255,.7);border-radius:8px;background:rgba(20,50,100,.5);font-weight:700;white-space:nowrap}
.btn:hover{background:rgba(30,80,150,.6)}
.btn.gold{border-color:#ffe08a;background:linear-gradient(180deg,#ffe07a,#f0a81a);color:#2a1800}
.btn.sm{padding:5px 10px;font-size:14px}

.ttl{font-family:'Exo 2';font-style:italic;font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-size:20px;text-shadow:0 0 10px rgba(120,220,255,.7);margin:22px 0 10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{padding:12px 14px}
.kpi small{display:block;font-size:12px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}

.kpi span{font-size:13px;color:var(--dim)}
.kpi.g{--bc:#ffe08a}.kpi.g b{color:var(--gold)}.kpi.p{--bc:#d2b2ff}.kpi.p b{color:#d9c2ff}.kpi.v b{color:var(--green)}
.tabs{display:flex;gap:8px;margin:18px 0 12px;flex-wrap:wrap}
.tabs button{padding:8px 16px;border-radius:99px;border:1.5px solid rgba(143,230,255,.45);font-weight:700;color:var(--dim)}
.tabs button.on{color:#fff;border-color:var(--line);background:rgba(30,90,170,.45);box-shadow:0 0 10px rgba(79,210,255,.5)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.bar input,.bar select,.field input,.field select,.field textarea{padding:9px 12px;border-radius:8px;border:1.5px solid rgba(143,230,255,.45);background:rgba(6,14,34,.9);outline:none}

table{width:100%;border-collapse:collapse}

th{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-align:left;padding:10px 8px;border-bottom:1px solid rgba(143,230,255,.25);font-weight:700}
td{padding:10px 8px;border-bottom:1px solid rgba(143,230,255,.12);vertical-align:middle;font-size:15px}
tr.row{cursor:pointer}tr.row:hover td{background:rgba(40,90,170,.18)}
.who b{display:block;font-weight:700}.who small{color:var(--dim);font-size:13px;word-break:break-all}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:800;letter-spacing:.06em;border:1.5px solid}
.pill.elite{color:#2a1800;background:linear-gradient(180deg,#ffe07a,#f0a81a);border-color:#ffe9a8}
.pill.recruta{color:#bff3ff;border-color:#8fe6ff;background:rgba(30,90,170,.35)}
.pill.none{color:var(--dim);border-color:rgba(160,190,230,.35)}
.pill.adm{color:#e9d9ff;border-color:var(--purple);background:rgba(110,60,200,.35)}
.st{font-weight:700}.st.ok{color:var(--green)}.st.warn{color:var(--gold)}.st.bad{color:var(--red)}.st.mute{color:var(--dim)}
.lv{font-family:Jost;font-weight:800;font-size:18px}
.rk{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 14px;margin-bottom:8px}
.rk .pos{font-family:Jost;font-weight:800;font-size:22px;text-align:center;color:var(--dim)}
.rk:nth-child(1) .pos{color:var(--gold)}.rk:nth-child(2) .pos{color:#dfe8f5}.rk:nth-child(3) .pos{color:#e0a060}
.rk .xp{font-family:Jost;font-weight:800;font-size:18px;color:var(--green);text-align:right}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;align-items:start}
.box{padding:16px}
.field{margin-bottom:12px}.field label{display:block;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:5px;font-weight:700}
.field input,.field select,.field textarea{width:100%}
.field textarea{min-height:90px;resize:vertical}
.tpl{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.tpl button{text-align:left;padding:8px 12px;border-radius:8px;border:1px solid rgba(143,230,255,.3);background:rgba(10,24,56,.7);font-size:14px}
.tpl button b{color:#bff3ff}
.prev{margin-top:4px;padding:12px;border-radius:12px;background:#1c2333;border:1px solid #33405a;display:flex;gap:10px}
.prev img{width:36px;height:36px;border-radius:8px}
.prev b{display:block;font-size:14px}.prev span{font-size:13.5px;color:#c8d3e6}
.hist div{padding:8px 0;border-bottom:1px solid rgba(143,230,255,.12);font-size:14px}
.hist small{color:var(--dim)}
.note{font-size:13.5px;color:var(--dim);margin-top:8px}
.drawer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;justify-content:flex-end}
.drawer .in{width:min(460px,100%);height:100%;overflow:auto;padding:16px;background:#071330;border-left:1.5px solid var(--line);box-shadow:0 0 30px rgba(79,210,255,.35)}
.drawer h3{font-family:Jost;font-size:22px}
.thr{max-height:320px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.25)}
.bub{max-width:85%;padding:8px 11px;border-radius:12px 12px 12px 3px;background:#12224a;border:1px solid #2a4580;white-space:pre-wrap;font-size:14px}
.bub.me{align-self:flex-end;border-radius:12px 12px 3px 12px;background:#3a2c08;border-color:#8a6a1c}
.bub small{display:block;margin-top:4px;font-size:11px;color:var(--dim)}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:#e2414f;color:#fff;font-size:11px;line-height:18px;text-align:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:12px 0;font-size:15px}.kv small{color:var(--dim);letter-spacing:.06em}
.ord{padding:10px 12px;margin-top:8px}
.login{max-width:380px;margin:12vh auto 0;padding:22px}
.login h1{font-family:'Exo 2';font-style:italic;font-weight:800;letter-spacing:.12em;font-size:24px;text-align:center;margin-bottom:4px}
.login p{text-align:center;color:var(--dim);margin-bottom:16px}
.err{color:var(--red);margin-top:8px;text-align:center}
.empty{padding:22px;text-align:center;color:var(--dim)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;padding:10px 18px;border-radius:10px;background:#0b1f45;border:1.5px solid var(--line);box-shadow:0 0 16px rgba(79,210,255,.5);font-weight:700}
@media (max-width:820px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tr.row{padding:10px 4px;border-bottom:1px solid rgba(143,230,255,.2)}
  td{border:0;padding:3px 6px}
  td[data-l]:before{content:attr(data-l)': ';color:var(--dim);font-size:13px}
  td.who{padding-bottom:6px}
}
.mut{color:#8fa0c8}
.qzh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 14px}
.qzh .seg{display:flex;gap:4px}.qzh .seg button{padding:7px 12px;border-radius:8px;border:1px solid rgba(120,160,255,.3);background:rgba(8,16,44,.7);color:#cfe0ff;cursor:pointer}.qzh .seg button.on{border-color:#ffc83a;color:#fff;background:rgba(255,200,58,.15)}
.qzh select{padding:7px 10px;border-radius:8px;background:#0b1430;color:#e6ecff;border:1px solid rgba(120,160,255,.3)}
.qzk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.qzk div{padding:12px;border-radius:12px;background:rgba(10,18,48,.85);border:1px solid rgba(120,160,255,.22)}
.qzk small{display:block;font-size:10.5px;letter-spacing:.12em;color:#8fa0c8}.qzk b{font-size:24px;color:#fff}.qzk em{font-style:normal;color:#7dffb4;margin-left:8px;font-weight:700}
.qzk.sm b{font-size:20px}
.qzt{font-size:15px;margin:18px 0 8px;color:#fff}.qzt .mut{font-size:12px;font-weight:400}
.qzf{display:grid;gap:6px}
.qzr{display:grid;grid-template-columns:200px 1fr 60px;gap:10px;align-items:center;font-size:13px}
.qzn{color:#cfd8f3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qzb{position:relative;height:24px;border-radius:7px;background:rgba(255,255,255,.05);overflow:hidden}
.qzb i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#2a6bff,#4fd2ff);border-radius:7px}
.qzb b{position:relative;z-index:1;padding:0 8px;line-height:24px;font-size:12px;color:#fff;text-shadow:0 1px 2px #000}
.qzb.sm{height:10px}
.qzcmp td{vertical-align:middle}.qzcmp td:not(:first-child){width:36%}.qzd{font-weight:800;font-size:12.5px;color:#8fa0c8;text-align:right}.qzd.mid{color:#ffc83a}.qzd.bad{color:#ff6a7a}
.qzg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.qzbox{padding:12px;border-radius:12px;background:rgba(10,18,48,.85);border:1px solid rgba(120,160,255,.22)}
.qzbox>b{display:block;margin-bottom:6px;color:#ffd767;font-size:13px}
.qza{display:grid;grid-template-columns:120px 1fr 38px;gap:8px;align-items:center;font-size:12px;color:#cfd8f3;margin:4px 0}.qza em{font-style:normal;text-align:right}
.qztab{width:100%;border-collapse:collapse;font-size:13px}.qztab th,.qztab td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.06);text-align:left}.qztab th{color:#8fa0c8;font-weight:600}
@media(max-width:600px){.qzr{grid-template-columns:120px 1fr 44px}}
</style>

<body>
<div class="wrap" id="root"><div class="empty">Carregando…</div></div>
<script src="/app/supabase.js"></script>
<script>
const URL_='https://lpdicrpetxqnoxceozfa.supabase.co', KEY='sb_publishable_ceGy_dHSjG3cngC8mVAPLg_R4sxr5kA';
const FN=URL_+'/functions/v1/fh-push';
let UNR=[];
const sb=window.supabase.createClient(URL_,KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'fh-auth'}});
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>'R$ '+Number(n||0).toFixed(2).replace('.',',');
const fmt=n=>Math.round(n||0).toLocaleString('pt-BR');
const CLS={paladino:'Paladino',guerreiro:'Guerreiro',monge:'Monge'};
const RANKS=[[1,'Recruta'],[5,'Escudeiro'],[10,'Guerreiro'],[20,'Cavaleiro'],[30,'Campeão'],[45,'Senhor da Guerra'],[60,'Lenda'],[80,'Titã'],[100,'Deus do Ferro']];
const xpNeed=L=>Math.round(80*Math.pow(L,1.6));
function lvl(xp){let L=1,r=xp;while(r>=xpNeed(L)){r-=xpNeed(L);L++}return L}
function rankOf(L){let r=RANKS[0][1];for(const [l,n] of RANKS)if(L>=l)r=n;return r}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function daysAgo(ymd){if(!ymd)return null;const [y,m,d]=ymd.split('-').map(Number);return Math.round((new Date(today()+'T12:00')-new Date(y,m-1,d,12))/864e5)}
function ago(ts){if(!ts)return '—';const s=(Date.now()-new Date(ts))/1000;if(s<3600)return Math.max(1,Math.round(s/60))+' min';if(s<86400)return Math.round(s/3600)+' h';return Math.round(s/86400)+' d'}
function dt(ts){if(!ts)return '—';const d=new Date(ts);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3500)}

let P=[], LOG=[], TAB=location.hash==='#ab'?'ab':location.hash==='#teste'?'trial':'jogadores', FILTER='todos', Q='';
function status(p){
  const da=daysAgo(p.last_day);
  if(p.last_day===today()) return ['ok','Treinou hoje'];
  if(da!==null&&da<=2) return ['ok','Ativo ('+da+'d)'];
  if(da!==null&&da<=6) return ['warn','Sumiu há '+da+'d'];
  if(da!==null) return ['bad','Inativo há '+da+'d'];
  if(p.hero) return ['warn','Criou herói, não treinou'];
  if(p.user_id) return ['mute','Criou conta, sem herói'];
  return ['bad','Comprou e não entrou'];
}
const FILTERS=[['todos','Todos'],['elite','Elite'],['recruta','Recruta'],['hoje','Treinou hoje'],['ativos','Ativos 7d'],['sumidos','Sumidos'],['nunca','Nunca treinou'],['naoentrou','Comprou e não entrou']];
function pass(p){
  const da=daysAgo(p.last_day);
  if(FILTER==='elite'&&p.plan!=='elite')return false;
  if(FILTER==='recruta'&&p.plan!=='recruta')return false;
  if(FILTER==='hoje'&&p.last_day!==today())return false;
  if(FILTER==='ativos'&&!(da!==null&&da<=6))return false;
  if(FILTER==='sumidos'&&!(da!==null&&da>=3))return false;
  if(FILTER==='nunca'&&p.last_day)return false;
  if(FILTER==='naoentrou'&&(p.user_id||!p.orders))return false;
  if(Q){const q=Q.toLowerCase();if(!((p.email||'')+' '+(p.hero||'')+' '+(p.buyer||'')).toLowerCase().includes(q))return false}
  return true;
}

function kpis(){
  const buyers=P.filter(p=>p.spent>0);
  const rev=buyers.reduce((a,p)=>a+Number(p.spent),0);
  const elite=P.filter(p=>p.plan==='elite'&&!p.is_admin).length, rec=P.filter(p=>p.plan==='recruta').length;
  const hoje=P.filter(p=>p.last_day===today()).length;
  const at7=P.filter(p=>{const d=daysAgo(p.last_day);return d!==null&&d<=6}).length;
  const push=P.filter(p=>p.push_on).length;
  const noEnter=P.filter(p=>p.orders&&!p.user_id).length;
  const bumps=buyers.filter(p=>(p.orders||[]).some(o=>o.bumps&&o.bumps.length)).length;
  return `<div class="kpis">
   <div class="kpi ch g glow"><small>Faturamento</small><b>${brl(rev)}</b><span>${buyers.length} comprador(es) · ${bumps} com order bump</span></div>
   <div class="kpi ch p glow"><small>Planos</small><b>${elite} <span style="font-size:15px">Elite</span> · ${rec} <span style="font-size:15px">Recruta</span></b><span>${noEnter} comprou e ainda não entrou</span></div>
   <div class="kpi ch v glow"><small>Treinaram hoje</small><b>${hoje}</b><span>${at7} ativos nos últimos 7 dias</span></div>
   <div class="kpi ch glow"><small>Notificação ligada</small><b>${push}</b><span>de ${P.filter(p=>p.user_id).length} contas</span></div>
  </div>`;
}
function viewPlayers(){
  const L=P.filter(pass);
  return `<div class="bar"><input id="q" placeholder="Buscar por e-mail, nome do herói ou comprador" value="${esc(Q)}"></div>
  <div class="chips" style="margin-bottom:12px">${FILTERS.map(([k,n])=>`<button class="${FILTER===k?'on':''}" data-f="${k}">${n} <small>(${(()=>{const o=FILTER;FILTER=k;const c=P.filter(pass).length;FILTER=o;return c})()})</small></button>`).join('')}</div>
  <div class="tbl ch glow">${L.length?`<table><thead><tr><th>Jogador</th><th>Plano</th><th>Situação</th><th>Nível</th><th>Dias treinados</th><th>Último login</th><th>Gastou</th><th>Lembrete</th></tr></thead><tbody>
  ${L.map(p=>{const [c,t]=status(p);const L_=lvl(p.xp);return `<tr class="row" data-e="${esc(p.email)}">
   <td class="who">${p.avatar?`<img src="${esc(p.avatar)}" style="width:34px;height:34px;border-radius:50%;object-fit:cover;float:left;margin-right:8px;border:1.5px solid #8fe6ff">`:''}<b>${esc(p.hero||p.buyer||'—')}${p.is_admin?' <span class="pill adm">ADMIN</span>':''}</b><small>${esc(p.email)}</small></td>
   <td data-l="Plano"><span class="pill ${p.plan||'none'}">${p.plan?p.plan.toUpperCase():'SEM PLANO'}</span></td>
   <td data-l="Situação"><span class="st ${c}">${t}</span></td>
   <td data-l="Nível"><span class="lv">${p.hero?L_:'—'}</span> <small style="color:var(--dim)">${p.hero?rankOf(L_):''}</small></td>
   <td data-l="Dias treinados">${p.days} <small style="color:var(--dim)">· ${fmt(p.sets)} séries</small></td>
   <td data-l="Último login">${p.last_login?ago(p.last_login)+' atrás':'nunca'}</td>
   <td data-l="Gastou">${p.spent>0?brl(p.spent):'—'}</td>
   <td data-l="Lembrete">${p.push_on?'🔔 '+esc(p.train_time):'—'}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">Nenhum jogador nesse filtro.</div>'}</div>`;
}
function viewRank(){
  const L=P.filter(p=>p.hero&&!p.is_admin).sort((a,b)=>b.xp-a.xp);
  if(!L.length) return '<div class="box ch glow empty">Ainda ninguém criou herói.</div>';
  return L.map((p,i)=>{const L_=lvl(p.xp);return `<div class="rk ch glow" data-e="${esc(p.email)}" style="cursor:pointer"><span class="pos">${i+1}º</span><div style="display:flex;gap:10px;align-items:center">${p.avatar?`<img src="${esc(p.avatar)}" style="width:42px;height:42px;border-radius:50%;object-fit:cover;border:1.5px solid #8fe6ff">`:''}<div><b>${esc(p.hero)}</b> <span class="pill ${p.plan||'none'}" style="margin-left:6px">${(p.plan||'—').toUpperCase()}</span><br><small style="color:var(--dim)">${CLS[p.cls]||''} · Nível ${L_} · ${rankOf(L_)} · ${p.bosses} chefes · ${p.dungeon} dias de dungeon · ${p.days} dias treinados</small></div></div><span class="xp">${fmt(p.xp)} XP</span></div>`}).join('');
}

  const pc=(n,t)=>t?(n/t*100).toFixed(1).replace('.',',')+'%':'—';const L=TR.list||[];const now=Date.now();
  const st=t=>t.bought_at?`<span style="color:#5dffa0;font-weight:700">✅ Comprou ${t.plan==='elite'?'Elite':t.plan==='recruta'?'Recruta':t.plan}</span>`:Date.parse(t.expires_at)>now?`<span style="color:#ffd84a">⏳ Testando · ${Math.max(0,Math.floor((Date.parse(t.expires_at)-now)/36e5))}h</span>`:'<span style="color:#ff8a8a">⌛ Acabou sem comprar</span>';
  const dur=t=>{if(!t.bought_at)return '';const h=(Date.parse(t.bought_at)-Date.parse(t.started_at))/36e5;return h<0?'comprou antes':h<1?'em '+Math.round(h*60)+' min':'em '+h.toFixed(1).replace('.',',')+'h'};
  const k=(l,v,sub)=>`<div class="kpi ch glow"><small>${l}</small><b>${v}</b><span>${sub||''}</span></div>`;
  return `<div class="qzh"><div class="seg">${[1,7,30,90].map(d=>`<button class="${TRD===d?'on':''}" data-trd="${d}">${d===1?'Hoje':d+' dias'}</button>`).join('')}</div>${TRL?'<span class="mut">atualizando…</span>':''}</div>
  <div class="kpis" style="margin:10px 0">${k('Começaram o teste',TR.total,(TR.pending||0)+' pararam no código do e-mail')}${k('Testando agora',TR.active,'dentro das 24h')}${k('Compraram',TR.bought,'conversão '+pc(TR.bought,TR.total))}${k('Faturamento do teste',brl(+TR.revenue),TR.trained+' treinaram no teste')}</div>
  ${(TR.nudges||[]).length?`<div class="tbl ch glow" style="margin-bottom:12px"><table><thead><tr><th>Pop-up do teste</th><th>Viram</th><th>Clicaram</th><th>Compraram depois</th></tr></thead><tbody>${TR.nudges.map(n=>`<tr><td>${['','① Lembrete (12h ou 1º treino)','② Últimas horas (menos de 3h)','③ Última chance (R$ 18,90)'][n.stage]}</td><td>${n.viram}</td><td>${n.clicaram} · ${pc(n.clicaram,n.viram)}</td><td>${n.compraram} · ${pc(n.compraram,n.viram)}</td></tr>`).join('')}</tbody></table></div>`:''}
  <div class="tbl ch glow">${L.length?`<table><thead><tr><th>E-mail</th><th>Herói</th><th>Começou</th><th>Situação</th><th>Treinou</th><th>Comprou</th><th>Pop-ups</th><th>Origem</th></tr></thead><tbody>${L.map(t=>`<tr><td>${esc(t.email)}</td><td>${esc(t.hero||'—')}</td><td>${dt(t.started_at)}</td><td>${st(t)}</td><td>${t.sets?t.sets+' séries':'—'}</td><td>${t.bought_at?brl(+t.amount)+' · '+dur(t):'—'}</td><td>${t.popups?t.popups.split(',').map(x=>['','①','②','③'][+x]).join(' '):'—'}</td><td class="mut">${esc(t.src||'—')}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Ninguém começou o teste grátis neste período ainda.</div>'}</div>
  <p class="note" style="margin-top:10px">“Pararam no código” = criaram a conta mas não digitaram o código do e-mail. “Comprou” conta qualquer compra paga com o mesmo e-mail depois do teste.</p>`;
}
function viewQuizCmp(){
  if(!QZX){if(!QZL)setTimeout(loadQuiz,0);return qzMktBar()+'<p class="mut" style="padding:20px">Carregando a comparação…</p>'}
  const B=qzStats(QZX.br,'br'),P=qzStats(QZX.pt,'pt');const pc=(n,t)=>t?Math.round(n/t*100)+'%':'—';
  const kr=(l,fb,fp)=>`<tr><td>${l}</td><td>${fb}</td><td>${fp}</td></tr>`;
  const steps=[];[...B.st,...P.st].forEach(x=>{if(!steps.find(s=>s.step===x.step))steps.push({step:x.step,idx:x.idx})});steps.sort((a,b)=>a.idx-b.idx);
  const g=(S,k)=>(S.st.find(x=>x.step===k)||{}).people||0;
  const bar=(n,t)=>{const p=t?Math.round(n/t*100):0;return `<div class="qzb sm"><i style="width:${p}%"></i><b>${n} · ${p}%</b></div>`};
  const fr=steps.map(s=>`<tr><td>${QN[s.step]||s.step}</td><td>${bar(g(B,s.step),B.top)}</td><td>${bar(g(P,s.step),P.top)}</td></tr>`).join('');
  return `${qzMktBar()}<div class="qzh"><div class="seg">${[1,7,30].map(d=>`<button class="${QZD===d?'on':''}" data-qzd="${d}">${d===1?'Hoje':d+' dias'}</button>`).join('')}</div>${QZL?'<span class="mut">atualizando…</span>':''}</div>
  <h3 class="qzt">Brasil × Portugal</h3><table class="qztab qzcmp"><tr><th></th><th>🇧🇷 Brasil</th><th>🇵🇹 Portugal</th></tr>
  ${kr('Entraram',B.top,P.top)}${kr('Chegaram na oferta',B.res+' · '+pc(B.res,B.top),P.res+' · '+pc(P.res,P.top))}
  ${kr('Clicaram em comprar',B.cks+' · '+pc(B.cks,B.top),P.cks+' · '+pc(P.cks,P.top))}${kr('Oferta → clique',pc(B.cks,B.res),pc(P.cks,P.res))}
  ${kr('Cliques no Elite (inclui pop-up)',B.el,P.el)}${kr('Cliques no Recruta',B.rec,P.rec)}${kr('Pop-up aberto',B.pop,P.pop)}${kr('Celular',B.mob+'%',P.mob+'%')}</table>
  <h3 class="qzt">Funil lado a lado <span class="mut">(% de quem entrou em cada país)</span></h3><table class="qztab qzcmp">${'<tr><th>Etapa</th><th>🇧🇷 Brasil</th><th>🇵🇹 Portugal</th></tr>'+(fr||'<tr><td colspan=3 class="mut">Ainda sem dados.</td></tr>')}</table>
  <p class="mut" style="font-size:12px;margin:6px 0 0">Portugal começou a registar em 18/11. Antes disso, só há dados do Brasil.</p>`;
}
function viewQuiz(){
  if(QZM==='cmp')return viewQuizCmp();
  if(!QZ){if(!QZL)setTimeout(loadQuiz,0);return qzMktBar()+'<p class="mut" style="padding:20px">Carregando o funil…</p>'}
  const st=(QZ.steps||[]).filter(x=>x.step).sort((a,b)=>a.idx-b.idx);const top=st.length?st[0].people:0;
  const co=QZ.checkouts||[];const cnt=k=>(co.find(c=>c.plan===k)||{}).n||0;const cks=QPL[QZM].reduce((a,k)=>a+cnt(k),0);
  const res=(st.find(x=>x.step==='res')||{}).people||0;
  let prev=null;
  const rows=st.map(x=>{const pct=top?Math.round(x.people/top*100):0;const drop=prev?Math.round((1-x.people/prev)*100):0;prev=x.people;
    return `<div class="qzr"><span class="qzn">${QN[x.step]||x.step}</span><div class="qzb"><i style="width:${pct}%"></i><b>${x.people} · ${pct}%</b></div><span class="qzd ${drop>=15?'bad':drop>=8?'mid':''}">${drop>0?'−'+drop+'%':''}</span></div>`}).join('');
  const ans={};(QZ.answers||[]).forEach(a=>{(ans[a.step]=ans[a.step]||[]).push(a)});
  const ansH=Object.entries(ans).filter(([k])=>k!=='nome').map(([k,v])=>{const t=v.reduce((a,b)=>a+b.n,0);return `<div class="qzbox"><b>${QN[k]||k}</b>${v.sort((a,b)=>b.n-a.n).map(a=>`<div class="qza"><span>${QV[a.val]||a.val}</span><div class="qzb sm"><i style="width:${Math.round(a.n/t*100)}%"></i></div><em>${Math.round(a.n/t*100)}%</em></div>`).join('')}</div>`}).join('');
  const camps=(QZ.campaigns||[]).map(c=>`<tr><td>${esc(c.c||'(sem campanha)')}</td><td>${c.starts}</td><td>${c.results}</td><td>${c.checkouts}</td><td>${c.starts?Math.round(c.checkouts/c.starts*100):0}%</td></tr>`).join('');
  return `${qzMktBar()}<div class="qzh"><div class="seg">${[1,7,30].map(d=>`<button class="${QZD===d?'on':''}" data-qzd="${d}">${d===1?'Hoje':d+' dias'}</button>`).join('')}</div>
   <select id="qzc"><option value="">Todas as campanhas</option>${(QZ.campaigns||[]).filter(c=>c.c).map(c=>`<option ${QZC===c.c?'selected':''}>${esc(c.c)}</option>`).join('')}</select>${QZL?'<span class="mut">atualizando…</span>':''}</div>
  <div class="qzk"><div><small>ENTRARAM</small><b>${top}</b></div><div><small>CHEGARAM NA OFERTA</small><b>${res}</b><em>${top?Math.round(res/top*100):0}%</em></div><div><small>CLICARAM EM COMPRAR</small><b>${cks}</b><em>${top?Math.round(cks/top*100):0}%</em></div><div><small>CELULAR</small><b>${QZ.mobile??0}%</b></div></div>
  <h3 class="qzt">Funil por etapa <span class="mut">(− = quantos saíram em relação à etapa anterior)</span></h3><div class="qzf">${rows||'<p class="mut">Ainda sem dados. Assim que o quiz receber visitas, o funil aparece aqui.</p>'}</div>
  <h3 class="qzt">Cliques de compra</h3><div class="qzk sm">${[...QPL[QZM],'popup_aberto'].map(k=>`<div><small>${QV[k]}</small><b>${cnt(k)}</b></div>`).join('')}</div>
  <p class="mut" style="font-size:12px;margin:6px 0 0">Vendas confirmadas aparecem na aba Jogadores e na Digital Hub. Aqui é o clique no botão de compra.</p>
  ${camps?`<h3 class="qzt">Por campanha</h3><table class="qztab"><tr><th>Campanha</th><th>Entraram</th><th>Oferta</th><th>Cliques</th><th>Conv.</th></tr>${camps}</table>`:''}
  ${ansH?`<h3 class="qzt">O que as pessoas respondem</h3><div class="qzg">${ansH}</div>`:''}`;
}
let FB=null,FBF='todas',FBL=false;
async function loadMsgs(){FBL=true;render();const {data,error}=await sb.rpc('fh_admin_feedback');FBL=false;if(error){toast('❌ '+error.message);FB=[]}else FB=data||[];render()}
function viewMsgs(){
  if(!FB){if(!FBL)setTimeout(loadMsgs,0);return '<p class="mut" style="padding:20px">Carregando as mensagens…</p>'}
  const E=['','😫','😕','😐','🙂','🤩'];const all=FB;const n=all.length;const avg=n?(all.filter(x=>x.rating).reduce((a,b)=>a+b.rating,0)/Math.max(1,all.filter(x=>x.rating).length)).toFixed(1):'—';
  const ok=all.filter(x=>x.consent&&x.msg).length;
  const list=all.filter(x=>FBF==='todas'||(FBF==='autorizadas'&&x.consent&&x.msg)||(FBF==='aprovadas'&&x.status==='aprovado')||(FBF==='ruins'&&x.rating&&x.rating<=2));
  const card=m=>`<div class="qzbox" style="margin-bottom:10px;${m.status==='oculto'?'opacity:.45':''}"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>${E[m.rating]||'—'} ${esc(m.name||'Caçador')} ${m.mkt==='pt'?'🇵🇹':'🇧🇷'} <span class="mut" style="font-weight:500">· ${esc(m.plan||'')} · ${m.workouts||0} treinos em ${m.days||0} dias</span></b><span class="mut" style="font-size:12px">${new Date(m.created_at).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span></div>
   <p style="margin:8px 0;white-space:pre-wrap">${m.msg?esc(m.msg):'<i class="mut">(só deu a nota)</i>'}</p>
   <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px"><span class="mut">${esc(m.email||'')}</span><span style="margin-left:auto">${m.consent?'<b style="color:#4cc38a">✓ autorizou usar como depoimento</b>':'<span class="mut">🔒 não autorizou mostrar</span>'}</span></div>
   <div style="display:flex;gap:6px;margin-top:8px">${m.consent&&m.msg?`<button class="btn sm ${m.status==='aprovado'?'gold':''}" data-fbs="${m.id}:${m.status==='aprovado'?'novo':'aprovado'}">${m.status==='aprovado'?'★ Aprovada':'☆ Marcar como boa'}</button><button class="btn sm" data-fbc="${m.id}">Copiar</button>`:''}<button class="btn sm" data-fbs="${m.id}:${m.status==='oculto'?'novo':'oculto'}">${m.status==='oculto'?'Mostrar':'Arquivar'}</button></div></div>`;
  const unr=UNR.map(u=>{const pl=P.find(x=>x.user_id===u.user_id);return pl?`<div class="qzbox" style="margin-bottom:8px;display:flex;gap:10px;align-items:center"><div style="flex:1"><b>📩 ${esc(pl.hero||pl.buyer||pl.email)}</b> <span class="badge">${u.n}</span><br><span class="mut" style="font-size:13px">${esc(String(u.preview||'').slice(0,120))}</span></div><button class="btn sm gold" data-openp="${esc(pl.email)}">Abrir conversa</button></div>`:''}).join('');
  return `${unr?`<div class="ttl" style="font-size:16px;margin-bottom:8px">Respostas novas dos caçadores</div>${unr}<div style="height:14px"></div>`:''}<div class="qzk"><div><small>RESPOSTAS</small><b>${n}</b></div><div><small>NOTA MÉDIA</small><b>${avg}</b><em>de 5</em></div><div><small>AUTORIZARAM DEPOIMENTO</small><b>${ok}</b></div></div>
  <p class="mut" style="font-size:12.5px;margin:8px 0 12px">O Sistema manda uma mensagem particular no app para quem já treinou em 3 dias diferentes (a partir do 3º dia de uso). Ninguém mais vê. Só use como depoimento quem marcou a autorização, e só com o primeiro nome.</p>
  <div class="seg" style="margin-bottom:12px">${[['todas','Todas'],['autorizadas','Podem virar depoimento'],['aprovadas','★ Boas'],['ruins','😫 Reclamações']].map(([k,l])=>`<button class="${FBF===k?'on':''}" data-fbf="${k}">${l}</button>`).join('')}</div>${FBL?'<p class="mut">atualizando…</p>':''}
  ${list.length?list.map(card).join(''):'<p class="mut" style="padding:14px 0">Ainda nenhuma mensagem aqui. Elas chegam conforme os caçadores completam os primeiros dias de treino.</p>'}`;
}
async function loadThread(uid){
  const el=$('#thr');if(!el)return;const r=await sb.rpc('fh_admin_inbox_thread',{p_user:uid});
  if(r.error){el.innerHTML='<p class="err">'+esc(r.error.message)+'</p>';return}
  const t=r.data||[];
  el.innerHTML=t.length?t.map(m=>`<div class="bub ${m.from_admin?'me':''}"><div>${esc(m.body)}</div><small>${m.from_admin?'Você':'Caçador'} · ${dt(m.at)}${m.from_admin?(m.read_at?' · ✓✓ lida':' · ✓ enviada'):''}</small></div>`).join(''):'<p class="mut">Nenhuma mensagem ainda.</p>';
  el.scrollTop=el.scrollHeight;
  if(UNR.some(u=>u.user_id===uid)){UNR=UNR.filter(u=>u.user_id!==uid);const b=document.querySelector('[data-tab=msgs]');if(b)b.innerHTML=tabMsgsLabel()}
}
async function msgSend(p,btn){
  const body=$('#d_b').value.trim();if(!body)return toast('Escreva a mensagem');
  btn.disabled=true;
  try{const r=await sb.rpc('fh_admin_inbox_send',{p_user:p.user_id,p_body:body});if(r.error)throw r.error;
    let extra='';
    if($('#d_push')&&$('#d_push').checked){try{const {data:{session}}=await sb.auth.getSession();
      const pr=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token,apikey:KEY},body:JSON.stringify({target:'users',user_ids:[p.user_id],title:'📜 Mensagem do Mestre',body:body.length>120?body.slice(0,117)+'…':body,url:'/app/?msg=1'})});
      const j=await pr.json();extra=pr.ok&&j.sent?' e avisado no celular':' (o aviso no celular não foi entregue)'}catch(e){extra=' (o aviso no celular não foi entregue)'}}
    $('#d_b').value='';toast('✅ Mensagem enviada'+extra);loadThread(p.user_id);
  }catch(e){toast('❌ '+e.message)}finally{btn.disabled=false}
}
function tabMsgsLabel(){const n=UNR.reduce((a,u)=>a+u.n,0);return '💬 Mensagens'+(n?` <b class="badge">${n}</b>`:'')}
function confirmSend(who){return window.confirm('Enviar esta notificação para: '+who+'?')}
async function load(){
  const [a,b,u]=await Promise.all([sb.rpc('fh_admin_players'),sb.rpc('fh_admin_push_log'),sb.rpc('fh_admin_inbox_unread')]);
  if(a.error)throw a.error;P=a.data||[];LOG=b.data||[];UNR=(u&&u.data)||[];render();
}
function login(msg=''){
  $('#root').innerHTML=`<form class="login ch glow" id="lf"><h1>CENTRAL DO MESTRE</h1><p>Acesso restrito ao administrador</p>
   <div class="field"><label>E-mail</label><input id="le" type="email" autocomplete="username" required></div>
   <div class="field"><label>Senha</label><input id="lp" type="password" autocomplete="current-password" required></div>
   <button class="btn gold" style="width:100%;justify-content:center">Entrar</button>${msg?`<p class="err">${esc(msg)}</p>`:''}</form>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:$('#le').value.trim().toLowerCase(),password:$('#lp').value});if(error)return login('E-mail ou senha incorretos');boot()};
}
async function boot(){
  const {data:{session}}=await sb.auth.getSession();if(!session)return login();
  const {data:me}=await sb.rpc('fh_me');if(!me||!me.admin){await sb.auth.signOut();return login('Esta conta não é de administrador')}
  try{await load()}catch(e){$('#root').innerHTML='<div class="empty">Erro ao carregar: '+esc(e.message)+'</div>'}
}
boot();
</script>
