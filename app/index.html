<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="fh-ver" content="20261106131020">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forja do Herói — Treino RPG</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05070d">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" type="image/png" href="/app/icons/favicon-64.png">
<link rel="apple-touch-icon" href="/app/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Forja do Herói">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,700;1,800&family=Jost:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<script src="supabase.js"></script>
<style>
:root{
  --bg:#05070d;--panel:#0b1222;--panel2:#101a30;--line:#1b2b4d;--line2:#24406f;
  --gold:#4fc3ff;--gold2:#2f7fd6;--text:#e6f1ff;--mute:#8ea3c4;--dim:#5e7192;
  --red:#9d4dff;--green:#69b874;--blue:#5a9be0;--purple:#a77de8;--teal:#4fc1b0;
  --r:0px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Rajdhani,system-ui,sans-serif;font-size:16px;font-weight:500}
body{min-height:100vh;background:
  radial-gradient(1200px 500px at 50% -200px,#0f2147 0%,transparent 70%),
  linear-gradient(rgba(79,195,255,.035) 1px,transparent 1px) 0 0/100% 40px,
  linear-gradient(90deg,rgba(79,195,255,.035) 1px,transparent 1px) 0 0/40px 100%,var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold2)}
.app{max-width:560px;margin:0 auto;padding:0 14px 96px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 2px;background:linear-gradient(var(--bg) 70%,transparent)}
.brand{font-family:Jost,sans-serif;font-weight:900;letter-spacing:.12em;font-size:14px;color:var(--gold);text-shadow:0 0 12px rgba(79,195,255,.6)}
.brand small{display:block;font-family:Rajdhani;font-weight:600;letter-spacing:.2em;color:var(--dim);font-size:10px}
.topr{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:14px}
.iconbtn{width:36px;height:36px;border-radius:6px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:17px}
h2{font-family:Jost,sans-serif;font-weight:600;font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 0 10px rgba(150,215,255,.85);margin:24px 0 10px}
h2 .sub{font-family:Rajdhani;font-size:13px;color:var(--mute);letter-spacing:0;font-weight:600;margin-left:6px}
.card{position:relative;background:rgba(4,10,22,.78);border:1px solid rgba(200,235,255,.6);border-radius:0;padding:14px;box-shadow:0 0 10px rgba(79,195,255,.35),inset 0 0 18px rgba(79,195,255,.12)}
.card+.card{margin-top:10px}
.muted{color:var(--mute)}.dim{color:var(--dim)}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

/* hero */
.hero{position:relative;overflow:hidden;padding:18px}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(400px 160px at 15% 0,rgba(79,195,255,.16),transparent 70%);pointer-events:none}
.crest{width:78px;height:78px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:36px;
  background:radial-gradient(circle at 35% 30%,#0f2147,#060a14);border:2px solid var(--gold);box-shadow:0 0 0 4px #060a14,0 0 0 5px var(--gold2),0 0 24px rgba(79,195,255,.25)}
.hname{font-family:Jost,sans-serif;font-weight:900;font-size:22px;line-height:1.1}
.htitle{color:var(--gold);font-weight:700;font-size:14px}
.hclass{color:var(--mute);font-size:14px}
.lvl{margin-left:auto;text-align:center;flex:none}
.lvl b{display:block;font-family:Jost,sans-serif;font-size:34px;line-height:1;color:var(--gold);text-shadow:0 0 16px rgba(79,195,255,.35)}
.lvl span{font-size:11px;letter-spacing:.2em;color:var(--mute)}
.rank{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:6px;border:1px solid var(--gold2);color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.bar{height:12px;border-radius:99px;background:#04060c;border:1px solid var(--line);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold2),var(--gold));box-shadow:0 0 12px rgba(79,195,255,.5);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.red i{background:linear-gradient(90deg,#5b2a9e,var(--red));box-shadow:0 0 12px rgba(157,77,255,.5)}
.bar.thin{height:8px}
.xpline{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:5px}
.stat{padding:10px;text-align:center;border-radius:6px;background:var(--panel);border:1px solid var(--line)}
.stat b{display:block;font-size:20px;font-weight:700}
.stat span{font-size:11px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.attr{display:grid;grid-template-columns:44px 1fr 34px;gap:10px;align-items:center;padding:7px 0}
.attr .k{font-family:Jost,sans-serif;font-weight:700;font-size:14px}
.attr .v{text-align:right;font-weight:700;font-size:18px}
.attr small{grid-column:2/4;margin-top:-6px;font-size:12px;color:var(--dim)}
.week{display:flex;gap:6px;align-items:flex-end;height:70px;margin-top:8px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.week i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,var(--gold),var(--gold2));min-height:3px}
.week i.zero{background:var(--line)}
.week span{font-size:11px;color:var(--dim)}
.buffs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.buff{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:#1e2a1f;color:#9fd8a6;border:1px solid #2f4a33}
.buff.p{background:#261d33;color:#cdb3f5;border-color:#3f2f57}

/* achievements */
.ach{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:4px}
.badge .e{font-size:24px;filter:grayscale(1) brightness(.5)}
.badge .t{font-size:10.5px;line-height:1.1;color:var(--dim);font-weight:600}
.badge.on{border-color:var(--gold2);background:radial-gradient(circle at 50% 30%,#0f2147,var(--panel))}
.badge.on .e{filter:none}.badge.on .t{color:var(--text)}

/* train */
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:700;color:var(--mute)}
.seg button.on{background:linear-gradient(180deg,#0f2147,#0f2147);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold2)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-size:14px;font-weight:600;color:var(--mute)}
.chip.on{border-color:var(--gold2);color:var(--gold)}
.exlist{display:grid;gap:8px;margin-top:8px}
.ex{display:flex;align-items:center;gap:12px;padding:12px;border-radius:6px;background:var(--panel);border:1px solid var(--line);text-align:left;width:100%}
.ex:active{transform:scale(.99)}
.ex .ic{width:38px;height:38px;border-radius:6px;display:grid;place-items:center;background:#060a14;border:1px solid var(--line);font-size:18px;flex:none}
.ex .n{font-weight:700;font-size:16px}
.ex .d{font-size:12.5px;color:var(--mute)}
.ex .m{margin-left:auto;font-size:12px;font-weight:700;color:var(--gold);white-space:nowrap}
.tier{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:2px}
.t1{background:#22301f;color:#9fd8a6}.t2{background:#1d2a3a;color:#9cc6f2}.t3{background:#2e2140;color:#cdb3f5}.t4{background:#0f2a4a;color:#8bdcff}.t5{background:#24124a;color:#d6a1ff}
.timer{display:flex;align-items:center;gap:8px}
.timer .clock{font-family:Jost,sans-serif;font-weight:700;font-size:22px;min-width:70px;color:var(--gold)}
.timer .clock.done{color:var(--green);animation:pulse 1s infinite}
.tbtn{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:13px}
.entry{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry .n{font-weight:700}
.entry .d{font-size:13px;color:var(--mute)}
.entry .x{margin-left:auto;font-weight:700;color:var(--gold);white-space:nowrap}
.del{width:28px;height:28px;border-radius:8px;color:var(--dim);font-size:16px;flex:none}
.del:hover{color:var(--red);background:#1c1036}

/* quests / bosses */
.quest{position:relative}
.quest .qt{font-family:Jost,sans-serif;font-weight:700;font-size:16px}
.quest .qd{color:var(--mute);font-size:14px;margin:2px 0 10px}
.reward{font-size:13px;font-weight:700;color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:0;font-weight:700;font-size:15px;letter-spacing:.04em;background:rgba(79,195,255,.2);border:1px solid #dff4ff;color:#fff;text-shadow:0 0 8px #9fdcff;box-shadow:0 0 16px rgba(79,195,255,.45),inset 0 0 12px rgba(79,195,255,.25)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:linear-gradient(180deg,#e0664e,#9b3322);color:#fff;box-shadow:0 2px 0 #5c1c12}
.btn.full{width:100%}
.btn.sm{padding:7px 12px;font-size:13px}
.done-tag{font-size:12px;font-weight:700;color:var(--green);letter-spacing:.08em}
.boss{display:flex;gap:12px;align-items:center}
.boss .face{width:58px;height:58px;flex:none;border-radius:6px;display:grid;place-items:center;font-size:32px;background:radial-gradient(circle at 50% 35%,#24124a,#0a0616);border:1px solid #3d2470}
.boss.dead .face{filter:grayscale(1);opacity:.6;border-color:var(--line)}
.boss .bn{font-family:Jost,sans-serif;font-weight:700;font-size:16px}
.boss .bd{font-size:13.5px;color:var(--mute)}
.boss .hp{font-size:12px;color:var(--mute);margin-top:6px;display:flex;justify-content:space-between}
.slain{font-family:Jost,sans-serif;font-weight:900;color:var(--green);font-size:12px;letter-spacing:.14em;border:1px solid #2f4a33;padding:2px 6px;border-radius:5px;transform:rotate(-4deg);display:inline-block}
.shop{display:flex;align-items:center;gap:12px}
.shop .si{font-size:28px;width:48px;text-align:center}
.shop .sn{font-weight:700;font-size:16px}
.shop .sd{font-size:13px;color:var(--mute)}
.shop .btn{margin-left:auto;flex:none}
.dayh{display:flex;justify-content:space-between;font-family:Jost,sans-serif;font-weight:700;color:var(--gold);font-size:14px;margin:16px 0 4px}


/* janelas do sistema */
.glow{color:#fff;text-shadow:0 0 10px rgba(150,215,255,.85)}
.win{position:relative;border:1px solid rgba(200,235,255,.6);background:rgba(4,10,22,.8);box-shadow:0 0 10px rgba(79,195,255,.35),inset 0 0 18px rgba(79,195,255,.12);padding:16px}
.win+.win{margin-top:12px}
.wtitle{display:table;margin:2px auto 16px;padding:8px 46px;border:1px solid rgba(200,235,255,.6);box-shadow:0 0 10px rgba(79,195,255,.35),inset 0 0 12px rgba(79,195,255,.12);font-family:Jost,sans-serif;font-weight:500;font-size:22px;letter-spacing:.18em;color:#fff;text-shadow:0 0 10px rgba(150,215,255,.85)}
.st-top{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap}
.st-lv{text-align:center;line-height:1}
.st-lv b{display:block;font-family:Jost,sans-serif;font-weight:600;font-size:72px;color:#fff;text-shadow:0 0 20px rgba(150,215,255,.95)}
.st-lv span{font-size:13px;letter-spacing:.22em}
.st-info{display:grid;gap:6px;font-size:15px;line-height:1.2;font-weight:700}
.st-info small{font-size:11px;color:var(--mute);letter-spacing:.08em;font-weight:600}
.barrow{display:flex;align-items:center;gap:10px}
.barrow .lb{width:40px;font-weight:700;font-size:12px;letter-spacing:.06em;text-align:center}
.track{flex:1;height:14px;border-radius:99px;border:1.5px solid rgba(220,242,255,.85);padding:2px;box-shadow:0 0 8px rgba(79,195,255,.6)}
.track i{display:block;height:100%;border-radius:99px;background:#e6f6ff;box-shadow:0 0 8px #9fdcff;transition:width .6s}
.track.v i{background:#d8c2ff;box-shadow:0 0 8px #a77de8}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;text-align:center}
.mini b{display:block;font-family:Jost,sans-serif;font-weight:600;font-size:20px}
.mini span{font-size:10.5px;color:var(--mute);letter-spacing:.08em}
.stgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px}
.stc{display:flex;align-items:center;gap:8px}
.stc svg{flex:none;filter:drop-shadow(0 0 4px rgba(79,195,255,.9))}
.stc .k{font-weight:600;font-size:15px;letter-spacing:.06em}
.stc .v{font-family:Jost,sans-serif;font-weight:600;font-size:28px;margin-left:auto;padding-right:6px}
.corner{position:absolute;width:24px;height:24px;filter:drop-shadow(0 0 6px rgba(79,195,255,.9));pointer-events:none}
.c1{top:-2px;left:-2px;border-top:2px solid #9fe0ff;border-left:2px solid #9fe0ff}
.c2{top:-2px;right:-2px;border-top:2px solid #9fe0ff;border-right:2px solid #9fe0ff}
.c3{bottom:-2px;left:-2px;border-bottom:2px solid #9fe0ff;border-left:2px solid #9fe0ff}
.c4{bottom:-2px;right:-2px;border-bottom:2px solid #9fe0ff;border-right:2px solid #9fe0ff}
.qwin{background:linear-gradient(180deg,rgba(10,30,70,.94),rgba(5,14,32,.94));text-align:center;padding:26px 18px 22px}
.qhead{display:flex;align-items:center;justify-content:center;gap:10px;padding-bottom:12px;border-bottom:1px solid rgba(159,224,255,.5);font-family:Jost,sans-serif;font-weight:600;font-size:22px;letter-spacing:.1em}
.qbang{width:28px;height:28px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-size:15px;font-weight:700;box-shadow:0 0 8px rgba(150,215,255,.8)}
.qgoal{font-family:Jost,sans-serif;font-weight:600;font-size:20px;letter-spacing:.12em;color:#7dff9b;text-shadow:0 0 10px rgba(125,255,155,.7);margin:16px 0 8px}
.qrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;text-align:left;padding:9px 0;border-bottom:1px dashed rgba(159,224,255,.15)}
.qrow .qn{font-weight:700;font-size:15.5px;letter-spacing:.02em}
.qrow small{display:block;font-size:12.5px;color:var(--mute);font-weight:500;margin-top:2px}
.qrow .qv{font-family:Jost,sans-serif;font-weight:500;font-size:16px;white-space:nowrap}
.qrow.done .glow{color:#7dff9b;text-shadow:0 0 10px rgba(125,255,155,.7)}
.qrow .btn{margin-top:6px}
.warn{margin-top:16px;font-weight:700;font-size:15px;line-height:1.4}
.warn b{color:#ff5a5a;text-shadow:0 0 10px rgba(255,90,90,.7)}
.qtimer{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;color:#bfe9ff;font-family:Jost,sans-serif;font-size:17px;letter-spacing:.1em}


.facei{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
._old_hbanner{position:relative;height:190px;margin-bottom:12px;border:1px solid rgba(200,235,255,.6);box-shadow:0 0 14px rgba(79,195,255,.4);overflow:hidden;background:#04060c}
.hbanner img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
.hbanner:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,7,14,0) 40%,rgba(4,7,14,.9))}
.hbanner span{position:absolute;left:14px;bottom:10px;z-index:1;font-family:Jost,sans-serif;font-weight:600;letter-spacing:.16em;font-size:13px;color:#fff;text-shadow:0 0 10px rgba(150,215,255,.9)}
.st-face{width:84px;height:84px;border-radius:50%;overflow:hidden;border:2px solid #dff4ff;box-shadow:0 0 16px rgba(79,195,255,.7);flex:none}

/* artes e planos */
.stage{position:relative;overflow:hidden;height:260px;border:1px solid rgba(200,235,255,.5);box-shadow:0 0 16px rgba(79,195,255,.25);margin-bottom:12px}
.stage.sm{height:210px}
.stage-word{position:absolute;right:-6px;top:4px;font-family:Jost,sans-serif;font-weight:800;font-size:86px;line-height:.85;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.2);white-space:nowrap;pointer-events:none}
.stage.sm .stage-word{font-size:70px}
.stage-art{position:absolute;right:0;top:6px;height:calc(100% + 20px);width:auto;max-width:none;filter:drop-shadow(0 0 22px var(--acc));-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 92%,transparent),linear-gradient(180deg,#000 78%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 92%,transparent),linear-gradient(180deg,#000 78%,transparent);mask-composite:intersect}
.stage-info{position:relative;z-index:1;padding:16px;max-width:62%;display:flex;flex-direction:column;gap:6px;justify-content:flex-end;height:100%}
.stage .tag{align-self:flex-start;padding:4px 10px;border:1px solid rgba(200,235,255,.6);background:rgba(4,10,22,.6);font-size:10.5px;font-weight:700;letter-spacing:.16em;color:#fff}
.stage-name{display:inline-block;align-self:flex-start;background:#fff;color:#05070d;font-family:Jost,sans-serif;font-weight:800;font-size:20px;padding:2px 10px;line-height:1.3}
.stage-cls{font-weight:700;font-size:13.5px;color:var(--acc);text-shadow:0 0 10px currentColor;letter-spacing:.04em}
.stage-title{font-size:13px;color:#fff;opacity:.9}
.crown{display:inline-block;align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.14em;color:#1a1006;background:linear-gradient(90deg,#ffd27a,#ffb238);padding:3px 9px;box-shadow:0 0 12px rgba(255,198,90,.55)}
.crown.big{font-size:13px;padding:5px 12px}
.crown.sm{position:absolute;top:6px;right:6px;padding:1px 5px;font-size:11px}
.btn.gold{background:linear-gradient(180deg,rgba(255,210,122,.35),rgba(255,178,56,.25));border-color:#ffe2a3;text-shadow:0 0 10px rgba(255,210,122,.9);box-shadow:0 0 22px rgba(255,198,90,.5),inset 0 0 14px rgba(255,198,90,.3)}
.pill.elite{color:#1a1006;background:linear-gradient(90deg,#ffd27a,#ffb238);border-color:#ffd27a;font-size:12px}
.pill.up{color:#ffd27a;border-color:#a8801f;font-size:12px;cursor:pointer}
.ebanner{position:relative;height:150px;overflow:hidden;margin:-18px -16px 0;border-bottom:1px solid rgba(255,210,122,.5)}
.ebanner img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.ebanner .crown{position:absolute;left:14px;bottom:12px}
.elist{list-style:none;display:grid;gap:8px;margin:12px 0 14px}
.elist li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.elist li span{flex:none;width:22px;text-align:center}
.locked{padding:0;overflow:hidden;border-color:rgba(255,210,122,.55);box-shadow:0 0 16px rgba(255,198,90,.25)}
.lk-art{position:relative;height:200px;overflow:hidden;background:radial-gradient(circle at 50% 60%,#2a1d08,#05070d)}

.lk-art .crown{position:absolute;left:12px;bottom:12px}

.promo{display:flex;align-items:stretch;width:100%;text-align:left;margin:12px 0;border:1px solid rgba(255,210,122,.6);background:rgba(20,14,4,.85);box-shadow:0 0 16px rgba(255,198,90,.25);overflow:hidden;padding:0}

.promo-t{display:flex;flex-direction:column;gap:5px;padding:12px;justify-content:center}

.promo-t small{font-size:12px;color:var(--mute)}
.cbanner{position:relative;height:300px;margin:0 -14px;overflow:hidden}
.cbanner img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}

.cb-t{position:absolute;left:0;right:0;bottom:8px;z-index:1;text-align:center;padding:0 14px}
.cb-t .tag{display:inline-block;padding:4px 10px;border:1px solid rgba(200,235,255,.6);background:rgba(4,10,22,.6);font-size:10.5px;font-weight:700;letter-spacing:.16em}
.cb-t h1{font-family:Jost,sans-serif;font-weight:800;font-size:34px;letter-spacing:.06em;color:#fff;text-shadow:0 0 22px rgba(79,195,255,.85);margin-top:6px}
.cb-t p{color:#dbe8ff;font-weight:600;font-size:15px}
.bossban{position:relative;height:190px;overflow:hidden;margin:8px 0 14px;border:1px solid rgba(199,125,255,.6);box-shadow:0 0 18px rgba(157,77,255,.35)}

.bossban .tag{display:inline-block;padding:3px 9px;border:1px solid rgba(199,125,255,.6);background:rgba(17,12,34,.7);font-size:10.5px;font-weight:700;letter-spacing:.16em}
.lv-art{height:170px;width:auto;margin:-6px auto 6px;filter:drop-shadow(0 0 20px rgba(79,195,255,.7))}
.dggrid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.dgc{aspect-ratio:1;display:grid;place-items:center;font-size:12px;font-weight:700;border:1px solid rgba(159,224,255,.25);color:var(--dim)}
.dgc.ok{border-color:#7dff9b;color:#7dff9b;box-shadow:0 0 8px rgba(125,255,155,.4)}

.rank-row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px dashed rgba(159,224,255,.15)}
.rank-row.me{background:rgba(79,195,255,.12);border:1px solid rgba(159,224,255,.6)}
.rank-row .rk{width:26px;text-align:center;font-weight:800}
.rank-row .rn{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-row .rx{font-family:Jost,sans-serif;font-weight:600}
.node{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed rgba(159,224,255,.15);position:relative}
.node:last-child{border-bottom:0}
.node .nd{width:30px;height:30px;flex:none;display:grid;place-items:center;border:1px solid rgba(159,224,255,.4);transform:rotate(45deg);font-size:12px}
.node .nd{line-height:1}
.node.done .nd{border-color:#7dff9b;color:#7dff9b;box-shadow:0 0 8px rgba(125,255,155,.5)}
.node.cur .nd{border-color:#fff;box-shadow:0 0 10px rgba(79,195,255,.8);background:rgba(79,195,255,.2)}
.node.lock{opacity:.5}
.sheetc .sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.sgrid small{display:block;font-size:10.5px;letter-spacing:.12em;color:var(--mute)}
.sgrid b{font-family:Jost,sans-serif;font-weight:600;font-size:17px}
.sgrid b.up{color:#7dff9b;text-shadow:0 0 8px rgba(125,255,155,.6)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;text-align:left;padding:14px;border:1px solid rgba(200,235,255,.5);background:rgba(4,10,22,.8);box-shadow:inset 0 0 18px rgba(79,195,255,.1);display:flex;flex-direction:column;gap:3px}
.tile .te2{font-size:24px}
.tile b{font-size:16px}
.tile small{font-size:12px;color:var(--mute)}
.tile.lk{border-color:rgba(255,210,122,.45)}
.back{color:var(--cy2,#9fe0ff);font-weight:700;font-size:14px;padding:6px 0;letter-spacing:.06em}
.gname{color:#ffd27a!important;text-shadow:0 0 8px rgba(255,198,90,.6)}
.lockdot{position:absolute;top:2px;right:calc(50% - 20px);font-size:9px}
.cls .ce{width:58px;height:58px}
/* taverna */
.post{padding:12px 14px}
.post .ph{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#060a14;border:1px solid var(--gold2);font-size:18px;flex:none}
.reply .av{width:30px;height:30px;font-size:14px}
.post .pn{font-weight:700;line-height:1.15}
.post .pm{font-size:12px;color:var(--dim)}
.post .pt{margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.post .pa{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pact{padding:5px 10px;border-radius:8px;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--mute)}
.pact.on{color:#d6a1ff;border-color:#3d2470;background:#160d2c}
.replies{margin-top:10px;padding-left:12px;border-left:2px solid var(--line);display:grid;gap:10px}
.reply .pt{margin-top:4px;font-size:15px}
.share-card{margin-top:8px;padding:10px 12px;border-radius:6px;background:#060a14;border:1px dashed var(--gold2);font-size:14px}
.share-card b{color:var(--gold)}
.you{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--gold);border:1px solid var(--gold2);border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:2px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:linear-gradient(transparent,var(--bg) 30%);padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr);background:#080c18;border:1px solid var(--line);border-radius:6px;padding:5px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:6px;color:var(--dim);font-size:10px;font-weight:700;letter-spacing:0;position:relative;min-width:0}
.nav button .e{font-size:19px;filter:grayscale(.8)}
.nav button.on{color:var(--gold);background:#0f2147}
.nav button.on .e{filter:none}
.dot{position:absolute;top:4px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px #080c18}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(5,4,3,.75);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.scrim.center{align-items:center}
.sheet{width:100%;max-width:560px;background:linear-gradient(180deg,#0f1d3a,#0a1020);border:1px solid var(--line2);border-bottom:0;border-radius:6px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .25s cubic-bezier(.2,.8,.2,1)}
.scrim.center .sheet{border-radius:6px;border-bottom:1px solid var(--line2);margin:16px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.sheet h3{font-family:Jost,sans-serif;font-size:20px;color:var(--gold);margin-bottom:4px}
.field{margin-top:12px}
.field label{display:block;font-size:13px;color:var(--mute);font-weight:600;margin-bottom:5px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:6px;background:var(--panel);border:1px solid var(--line);font-size:22px;font-weight:700;flex:none}
.stepper input{text-align:center;font-size:20px;font-weight:700}
.preview{margin-top:14px;padding:12px;border-radius:6px;background:#060a14;border:1px dashed var(--gold2);display:flex;justify-content:space-between;align-items:center}
.preview b{font-family:Jost,sans-serif;font-size:24px;color:var(--gold)}
.toasts{position:fixed;top:12px;left:0;right:0;z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{max-width:520px;width:100%;background:rgba(8,16,34,.95);border:1px solid var(--gold);border-radius:4px;padding:10px 14px;font-weight:700;box-shadow:0 0 22px rgba(79,195,255,.35),0 10px 30px rgba(0,0,0,.6);animation:drop .3s cubic-bezier(.2,1.2,.4,1);display:flex;gap:10px;align-items:center}
.toast .te{font-size:22px}
.toast small{display:block;font-weight:600;color:var(--mute)}
.lvup{text-align:center;padding:10px 0}
.fbr{display:flex;justify-content:center;gap:6px;margin:12px 0 4px}.fbr button{font-size:30px;line-height:1;background:rgba(255,255,255,.04);border:1px solid rgba(120,160,255,.25);border-radius:14px;padding:8px 7px;filter:grayscale(.7);opacity:.7;transition:.15s}.fbr button.on{filter:none;opacity:1;border-color:var(--gold);box-shadow:0 0 14px rgba(255,198,90,.45);transform:scale(1.08)}
.fbta{width:100%;min-height:92px;border-radius:12px;background:rgba(5,12,32,.7);border:1px solid rgba(120,160,255,.3);color:#e6ecff;padding:10px 12px;font-size:15px;line-height:1.4;font-family:inherit;resize:vertical;margin-top:10px}
.fbck{display:flex;gap:9px;align-items:flex-start;text-align:left;font-size:13px;color:var(--mute);margin:10px 2px 14px}.fbck input{margin-top:2px;width:18px;height:18px;accent-color:#ffc65a;flex:none}
.lvup .big{font-family:Jost,sans-serif;font-weight:900;font-size:72px;line-height:1;color:var(--gold);text-shadow:0 0 30px rgba(79,195,255,.6);animation:glow 1.6s infinite}
.lvup .cap{font-family:Jost,sans-serif;letter-spacing:.3em;color:var(--mute);font-size:13px}
.classes{display:grid;gap:10px;margin-top:8px}
.cls{display:flex;gap:12px;align-items:center;text-align:left;padding:12px;border-radius:6px;background:var(--panel);border:1px solid var(--line);width:100%}
.cls.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold2),0 0 20px rgba(79,195,255,.15)}
.cls .ce{font-size:30px;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#060a14;border:1px solid var(--gold2);flex:none}
.cls .cn{font-family:Jost,sans-serif;font-weight:700}
.cls .cd{font-size:13px;color:var(--mute)}
.intro{text-align:center;padding:30px 4px 10px}
.intro h1{font-family:Jost,sans-serif;font-weight:900;font-size:30px;color:var(--gold);letter-spacing:.06em;text-shadow:0 0 24px rgba(79,195,255,.3)}
.intro p{color:var(--mute);margin-top:6px}
.sync{font-size:11px;color:var(--dim);text-align:center;margin-top:24px}
.tn{position:relative}.tn a.btn{text-decoration:none}.tn .tn-h{color:#fff!important;-webkit-text-fill-color:#fff;background:none}.tn-c{text-align:center}.tn .muted{font-size:14.5px}
.tn-x{position:absolute;top:-6px;right:-4px;background:none;border:0;color:var(--mute);font-size:24px;padding:4px 8px}
.tn-h{font:800 italic 23px/1.12 'Exo 2',Jost,sans-serif;margin:10px 0 6px;color:#fff;text-shadow:0 0 14px rgba(150,215,255,.5)}
.tag.tn-red{background:#ff4d4d;border-color:#ff9a9a}
.tn-hero{display:flex;gap:12px;align-items:center;padding:10px 12px;margin:12px 0;text-align:left}
.tn-hero img{width:58px;height:58px;object-fit:cover;object-position:top;border-radius:10px;border:1px solid #ffe2a3}
.tn-hero b{color:#fff}.tn-hero small{display:block;color:var(--mute);font-size:13px}
.tn-bar{height:7px;background:#14223f;border-radius:4px;margin-top:6px;overflow:hidden}.tn-bar i{display:block;height:100%;background:linear-gradient(90deg,#4fd2ff,#a35cff)}
.tn-lbl{font:600 12px Jost;letter-spacing:.14em;color:var(--mute)}
.tn-clock{display:flex;justify-content:center;gap:8px;margin:10px 0 4px}
.tn-clock div{min-width:62px;padding:8px 6px;border:1px solid #ffcf4a;background:rgba(255,190,60,.1);border-radius:10px;text-align:center}
.tn-clock b{display:block;font:800 italic 30px/1 'Exo 2',Jost,sans-serif;color:#ffd84a}
.tn-clock span{font:600 10px Jost;letter-spacing:.14em;color:var(--mute)}
.tn-clock.red div{border-color:#ff6b6b;background:rgba(255,80,80,.12)}.tn-clock.red b{color:#ff8a8a}
.tn-list{list-style:none;margin:10px 0;padding:0;font-size:14.5px;line-height:1.55;text-align:left}
.tn-list li{padding-left:22px;position:relative}.tn-list li:before{content:'✔';position:absolute;left:0;color:#5be38a}
.tn-plans{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
.tn-plan{display:block;padding:12px 8px 10px;text-align:center;color:#fff;text-decoration:none}
.tn-plan.hot{border-color:#ffcf4a;box-shadow:0 0 18px rgba(255,200,70,.35)}
.tn-plan .tag{position:absolute;top:-10px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:9px;padding:3px 7px;background:#ffcf4a;color:#231400;border-color:#ffe2a3}
.tn-plan b{display:block;font:700 15px Jost;margin-top:4px}
.tn-plan .p{font:800 italic 26px 'Exo 2',Jost,sans-serif;color:#ffd84a;margin:2px 0}
.tn-plan small{display:block;color:var(--mute);font-size:12px;line-height:1.3}
.tn-vit{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.tn-vit span{font:600 11.5px Jost;padding:4px 8px;border-radius:20px;background:rgba(91,227,138,.12);border:1px solid rgba(91,227,138,.5);color:#bff5d1}
.tn-big{font:800 italic 40px 'Exo 2',Jost,sans-serif;color:#ffd84a}
.tn-ghost{background:transparent!important;border:0!important;color:var(--mute)!important;margin-top:6px}
.tn-pulse{animation:emgp 1.6s infinite}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes pop{from{transform:scale(.7);opacity:0}}
@keyframes drop{from{transform:translateY(-20px);opacity:0}}
@keyframes glow{50%{text-shadow:0 0 50px rgba(79,195,255,.9)}}
@keyframes pulse{50%{opacity:.5}}
.alqgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.alq{position:relative;text-align:left;padding:12px;border-radius:12px;border:1px solid color-mix(in srgb,var(--rc) 55%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--rc) 16%,#0a1224),#070c18);color:var(--text);display:flex;flex-direction:column;gap:3px;box-shadow:0 0 14px color-mix(in srgb,var(--rc) 22%,transparent)}
.alq .ae{font-size:28px;line-height:1}.alq small{font-size:10px;font-weight:700;letter-spacing:.1em}.alq b{font-size:14px;line-height:1.2}.alq .am{font-size:11.5px;color:var(--mute)}
.alq.lk{opacity:.55;filter:saturate(.5)}.alq.dn{border-color:#7dff9b}.alq .ad{font-size:10px;font-weight:800;color:#7dff9b;letter-spacing:.08em}

/* instalar app */
.ibanner{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:4px 0 12px;padding:10px 12px;border:1px solid rgba(79,195,255,.6);background:rgba(4,14,30,.9);box-shadow:0 0 14px rgba(79,195,255,.25)}
.ibanner img{width:44px;height:44px;border-radius:10px;flex:none}
.ibanner b{display:block;font-size:15px}.ibanner small{color:var(--mute);font-size:12.5px}
.ibanner .x{margin-left:auto;color:var(--dim);font-size:18px;padding:4px 6px}
.ilogo{display:block;width:96px;height:96px;border-radius:22px;margin:4px auto 10px;box-shadow:0 0 24px rgba(79,195,255,.45)}
.isteps{list-style:none;counter-reset:i;margin:12px 0 0}
.isteps li{counter-increment:i;position:relative;padding:10px 0 10px 44px;border-top:1px solid rgba(79,195,255,.15);font-size:15px;line-height:1.35}
.isteps li:first-child{border-top:0}
.isteps li:before{content:counter(i);position:absolute;left:0;top:9px;width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--gold);color:var(--gold);font-weight:700;box-shadow:0 0 10px rgba(79,195,255,.4)}
.isteps .k{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border:1px solid rgba(200,235,255,.45);background:rgba(79,195,255,.12);font-weight:700;white-space:nowrap}
.inote{margin-top:12px;padding:10px 12px;border-left:3px solid #ffd27a;background:rgba(255,198,90,.08);font-size:13.5px;color:var(--mute)}
.musbtn{display:block;width:fit-content;margin:0 0 10px auto;padding:5px 10px;border:1px solid rgba(200,235,255,.4);background:rgba(4,10,22,.8);font-size:13px;font-weight:700;color:var(--mute)}
.instl{display:block;margin:14px auto 0;color:var(--gold);font-size:14px;text-decoration:underline}

/* ================== SKIN v2 (fiel aos mockups) ================== */
.app.z,.nav .in{zoom:var(--z,1)}
.brand{white-space:nowrap}
:root{--cy:#4fd2ff;--cy2:#2a8fd6;--gd:#ffcc4d;--gd2:#e09a1a;--pu:#a35cff;--pu2:#6b2bd9;--panelv:rgba(6,14,32,.86)}
body{background:radial-gradient(900px 600px at 50% -120px,#13224a 0%,transparent 70%),radial-gradient(700px 500px at 100% 60%,rgba(98,40,180,.12),transparent 70%),#050913;background-attachment:fixed}
.app{padding:0 12px 112px}
.disp{font-family:'Exo 2',Jost,sans-serif;font-weight:800;font-style:italic;letter-spacing:.06em;text-transform:uppercase}
.nglow{text-shadow:0 0 10px rgba(79,210,255,.75)}
/* topo */
.top{padding:10px 0 10px;margin:0 -12px;padding-left:0;padding-right:12px;background:linear-gradient(#050913 75%,rgba(5,9,19,0))}
.brand{position:relative;padding:8px 34px 8px 26px;background:linear-gradient(90deg,#0a1a3a,#0b1d44 70%,rgba(11,29,68,0));clip-path:polygon(0 0,100% 0,86% 100%,0 100%);font-family:'Exo 2',Jost,sans-serif;font-weight:800;font-size:17px;letter-spacing:.08em;color:#7fe0ff;text-shadow:0 0 12px rgba(79,210,255,.8);border-bottom:2px solid rgba(79,210,255,.7)}

.brand small{font-family:Rajdhani;font-size:10.5px;letter-spacing:.42em;color:#9cc7e8;text-shadow:none;margin-top:1px}
.topr{gap:7px}

.pill.up{color:#ffd27a;border-color:#a8801f}
.coin{width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a8,#f5b928 55%,#b07408);box-shadow:0 0 6px rgba(255,190,60,.7);display:inline-block}
.iconbtn{width:38px;height:38px;border-radius:8px;background:rgba(8,16,36,.9);border:1px solid rgba(120,170,230,.45);color:#e8f4ff}
.iconbtn svg{width:20px;height:20px}
/* navegação */
.nav{padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(rgba(5,9,19,0),#050913 35%)}
.nav .in{background:linear-gradient(180deg,rgba(14,24,50,.97),rgba(8,14,32,.97));border:1px solid rgba(110,170,240,.45);border-radius:16px;padding:6px;box-shadow:0 0 18px rgba(79,195,255,.18),0 10px 30px rgba(0,0,0,.6)}
.nav button{gap:2px;padding:6px 0 5px;border-radius:10px;color:#c6d6ef;font-size:11.5px;font-weight:600;border:1px solid transparent}

      const z=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=240;
      c.getContext('2d').drawImage(im,(im.width-z)/2,(im.height-z)/2,z,z,0,0,240,240);

}

const $ = s=>document.querySelector(s);
const sum=(a,f)=>a.reduce((t,x)=>t+(f?f(x):x),0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('pt-BR');
function ymd(d=new Date()){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function addDays(s,n){const [y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1,d+n);return ymd(dt)}
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return()=>{seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ================== CÁLCULOS ================== */
function classMult(ex){const c=CLASSES[S.cls][ex.t];return c||(ex.t==='aer'&&S.cls==='paladino'?1.1:1)}
function baseXP(ex,s,r,kg){
  if(ex.t==='aer') return r*ex.m;
  if(ex.t==='cal') return s*r*ex.m*2;
  return s*r*(1+(kg||0)/30)*ex.m;
}
function streakInfo(){
  const days=[...new Set(S.log.map(e=>e.d))].sort();
  const set=new Set(days);
  const today=ymd();
  let cur=0, start=set.has(today)?today:addDays(today,-1);
  while(set.has(start)){cur++;start=addDays(start,-1)}
  let best=0,run=0,prev=null;
  for(const d of days){run=(prev&&addDays(prev,1)===d)?run+1:1;best=Math.max(best,run);prev=d}
  return {cur,best,days:days.length,trainedToday:set.has(today)};
}
function multipliers(ex){
  const st=streakInfo();
  const streakB=Math.min(st.cur,10)*0.05;
  const elixir=S.elixir===ymd()?0.5:0;const pen=S.pen?0.5:1;
  return {cls:classMult(ex),streak:1+streakB,elixir:1+elixir,pen,total:classMult(ex)*(1+streakB)*(1+elixir)*pen};
}
function xpNeed(L){return Math.round(80*Math.pow(L,1.6))}
function totalXP(){return sum(S.log,e=>e.xp)+S.bonusXP}
function levelInfo(xp=totalXP()){
  let L=1,rest=xp;
  while(rest>=xpNeed(L)){rest-=xpNeed(L);L++}
  return {L,into:rest,need:xpNeed(L)};
}
function rankOf(L){let r=RANKS[0][1];for(const [l,n] of RANKS) if(L>=l) r=n;return r}
function gold(){return Math.max(0,Math.floor(sum(S.log,e=>Math.floor(e.xp/20)))+S.goldBonus-S.goldSpent)}
function attrs(){
  const a={FOR:0,RES:0,AGI:0,VIG:0};
  for(const e of S.log){const ex=EXM[e.ex];if(!ex)continue;for(const k in ex.a)a[k]+=e.xp*ex.a[k]}
  const st=streakInfo(); a.VIG=st.days*60+st.best*40;
  const out={};for(const k in a){out[k]=1+Math.floor(Math.sqrt(a[k]/12));out[k+'_raw']=a[k]}
  return out;
}
function attrProgress(raw){const lv=1+Math.floor(Math.sqrt(raw/12));const lo=12*Math.pow(lv-1,2),hi=12*Math.pow(lv,2);return (raw-lo)/(hi-lo)}
function todayEntries(){const t=ymd();return S.log.filter(e=>e.d===t)}

function ensureQuests(){
  const t=ymd();
  if(S.q.d===t&&S.q.ids.length) return;
  if(S.created&&S.q.d&&S.q.d<t&&S.q.ids.length&&S.q.d>=PEN_FROM&&!clockTampered()){
    const d0=S.q.d,d1=addDays(d0,1);
    if(!questsOk(d0,S.q.ids)) penStart('missoes',d0);
    else if(d1<t) penStart('ausencia',d1);
  }
  const pool=QUESTS.filter(q=>(!q.cls||q.cls.includes(S.cls))&&(!q.sex||q.sex===sexOf()));
  const r=rng(hash(t+S.name+S.cls));
  const ids=[];const p=[...pool];
  while(ids.length<3&&p.length){ids.push(p.splice(Math.floor(r()*p.length),1)[0].id)}
  S.q={d:t,ids,claimed:[]};
}
function questReward(){const L=levelInfo().L;return {xp:Math.round(60*(1+L*0.06)),gold:25}}
function bossProgress(b){
  const es=S.log.filter(e=>b.ex.includes(e.ex));
  if(b.u==='kg'){
    const target=b.bw*(S.bw||0); if(!target) return {best:0,target:0,p:0};
    const best=Math.max(0,...es.map(e=>e.kg||0)); return {best,target:Math.round(target*10)/10,p:Math.min(1,best/target)};
  }
  const best=Math.max(0,...es.map(e=>e.r)); return {best,target:b.goal,p:Math.min(1,best/b.goal)};
}
function counters(){
  const st=streakInfo();
  return {entries:S.log.length,best:st.best,days:st.days,
    reps:sum(S.log.filter(e=>!EXM[e.ex]?.u),e=>e.s*e.r),
    vol:sum(S.log.filter(e=>EXM[e.ex]?.t==='mus'),e=>e.s*e.r*(e.kg||0)),
    level:levelInfo().L,quests:S.qTotal,bosses:Object.keys(S.bosses).length};
}

const PEN_FROM='2026-11-24',PEN_GOAL=12,EMG_H=3;
const EMG_KINDS=[
  {k:'sets',t:'Complete 6 séries de qualquer exercício',goal:6,f:es=>sum(es.filter(e=>EXM[e.ex]&&EXM[e.ex].t!=='run'),e=>EXM[e.ex].t==='aer'?Math.floor(e.r/5):e.s)},

  {k:'var',t:'Treine 3 exercícios diferentes',goal:3,f:es=>new Set(es.filter(e=>EXM[e.ex]&&EXM[e.ex].t!=='run').map(e=>e.ex)).size}];
function questsOk(d,ids){const es=S.log.filter(e=>e.d===d);return ids.every(id=>{const q=QUESTS.find(x=>x.id===id);return !q||q.f(es)>=q.goal})}
function penStart(why,from){
  if(S.cheat)return;
  if(S.pen){S.pen.goal=Math.min(30,S.pen.goal+6);S.pen.why=why;S.pen.seen=false;return}
  S.pen={ts:Date.now(),d:ymd(),from:from||'',why,goal:PEN_GOAL,seen:false};
}
function penProgress(){if(!S.pen)return 0;return sum(S.log.filter(e=>e.ts>=S.pen.ts&&EXM[e.ex]&&EXM[e.ex].t!=='run'),e=>EXM[e.ex].t==='aer'?Math.floor(e.r/5):e.s)}
function penWhy(){return S.pen.why==='emergencia'?'Você falhou na Missão de Emergência.':S.pen.why==='ausencia'?'Você sumiu e deixou as missões diárias para trás.':'Você não cumpriu as missões diárias.'}
function emgDay(){const w=weekStart();return addDays(w,hash(w+'emg'+(S.name||''))%7)}
function emgKind(){return EMG_KINDS.find(x=>x.k===(S.emg&&S.emg.k))||EMG_KINDS[0]}
function emgActive(){const e=S.emg;return !!(e&&!e.done&&!e.fail&&Date.now()<=e.end)}
function emgProgress(){const e=S.emg;if(!e)return 0;return emgKind().f(S.log.filter(x=>x.ts>=e.ts&&x.ts<=e.end))}
function emgTick(){
  if(!S.created||S.cheat)return;
  const t=ymd(),now=Date.now(),w=weekStart(),e=S.emg;
  if(e&&!e.done&&!e.fail&&now>e.end){e.fail=true;penStart('emergencia');save()}
  if((!S.emg||S.emg.w!==w)&&t>=PEN_FROM&&t===emgDay()){
    const h=new Date().getHours();if(h<7||h>=21)return;
    const k=EMG_KINDS[hash(t+'k'+(S.name||''))%EMG_KINDS.length];
    const eod=new Date();eod.setHours(23,59,59,0);
    S.emg={w,d:t,ts:now,end:Math.min(now+EMG_H*36e5,eod.getTime()),k:k.k,done:false,fail:false};save();
    try{sfx('boss')}catch(_){}queueModal(emgModal);
  }
}

function penCheck(){if(S.pen&&penProgress()>=S.pen.goal){S.pen=null;S.penWins=(S.penWins||0)+1;setTimeout(()=>{sfx('allquests');queueModal(penWinModal)},350)}}

function afterProgress(prevLevel){
  emgCheck();penCheck();
  // chefes
  for(const b of BOSSES){
    if(S.bosses[b.id]||(b.sex&&b.sex!==sexOf())) continue;
    const p=bossProgress(b);
    if(p.p>=1&&p.target>0){
      S.bosses[b.id]=Date.now();
      const xp=300+Object.keys(S.bosses).length*50;
      S.bonusXP+=xp;S.goldBonus+=120;
      queueModal(()=>bossModal(b,xp));
    }
  }
  // conquistas
  const c=counters();
  for(const a of ACH){
    if(!S.ach[a.id]&&a.f(c)){S.ach[a.id]=Date.now();S.goldBonus+=30;toast(a.e,'Conquista desbloqueada!',a.t+' · +30 ouro');setTimeout(()=>sfx('achievement'),700)}
  }
  const L=levelInfo().L;
  if(L>prevLevel){
    const oldR=rankOf(prevLevel),newR=rankOf(L);
    queueModal(()=>levelModal(L,newR!==oldR?newR:null));
    // conquistas de nível após subir
    const c2=counters();
    for(const a of ACH){ if(!S.ach[a.id]&&a.f(c2)){S.ach[a.id]=Date.now();S.goldBonus+=30;toast(a.e,'Conquista desbloqueada!',a.t+' · +30 ouro');setTimeout(()=>sfx('achievement'),700)} }
  }
  save();
}
function logExercise(exId,s,r,kg,kgs){
  const ex=EXM[exId];const prev=levelInfo().L;if(ex.t!=='mus'||!kgs||!kgs.length)kgs=null;
  const chk=antiCheat(ex,s,r,kg);
  if(!chk.ok){sfx&&sfx('error');toast('🛡️',chk.t,chk.m);return false}
  const m=multipliers(ex);
  let xp=Math.max(1,Math.round(baseXP(ex,s,r,kgs?sum(kgs,v=>v)/kgs.length:kg)*m.total));
  const room=Math.max(0,LIM.xpDay-trainXPToday());
  if(xp>room){xp=room;setTimeout(()=>toast('🛡️','Teto diário de XP de treino','Hoje você já chegou a '+fmt(LIM.xpDay)+' XP de treino. O resto conta no diário, sem XP.'),400)}
  const en={id:uid(),d:ymd(),ts:Date.now(),ex:exId,s,r,kg:ex.t==='mus'?kg:0,xp};if(kgs)en.kgs=kgs;S.log.push(en);
  S.last[exId]=kgs?{s,r,kg,kgs}:{s,r,kg};
  sfx('xp');toast('✨','+'+fmt(xp)+' XP · +'+Math.floor(xp/20)+' ouro',ex.n+' — '+(ex.t==='aer'?r+' min':s+'×'+r+(ex.u?'s':'')+(ex.t==='mus'?' · '+kgTxt(en):'')));
  afterProgress(prev);
  setTimeout(()=>trialNudge('treino'),2600);
  return true;
}
/* ================== ANTITRAPAÇA ================== */
const LIM={sets:10,setsHour:40,setsDay:80,kg:600,xpDay:3000,runKmDay:15};
function fmtDur(sec){sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),x=sec%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')}
function repLimit(ex){
  if(ex.t==='aer') return 120;
  if(ex.u==='s') return ex.tier>=5?60:ex.tier>=3?120:ex.id==='corda'?900:600;
  if(ex.t==='mus') return 50;
  return ex.tier>=5?15:ex.tier>=4?30:ex.tier>=3?50:ex.tier>=2?120:200;
}
function trainXPToday(){return sum(todayEntries().filter(e=>EXM[e.ex]?.t!=='run'),e=>e.xp)}
function clockTampered(){return Date.now()<(S.lastSeen||0)-10*60e3}
function antiCheat(ex,s,r,kg){
  if(clockTampered()) return {ok:false,t:'Relógio do aparelho alterado',m:'A data ou hora do celular voltou no tempo. Ajuste para o horário automático e tente de novo.'};
  if(s>LIM.sets) return {ok:false,t:'Muitas séries de uma vez',m:'Registre no máximo '+LIM.sets+' séries por vez.'};
  const rl=repLimit(ex);
  if(r>rl) return {ok:false,t:'Número fora do realista',m:ex.n+': máximo de '+rl+(ex.u?' segundos':' repetições')+' por série.'};
  if(ex.t==='mus'&&kg>LIM.kg) return {ok:false,t:'Carga fora do realista',m:'O máximo aceito é '+LIM.kg+' kg.'};
  if(ex.t==='aer'){const dm=sum(todayEntries().filter(e=>EXM[e.ex]&&EXM[e.ex].t==='aer'),e=>e.r);if(dm+r>240) return {ok:false,t:'Muito aeróbico hoje',m:'O máximo é de 4 horas de aeróbico por dia.'}}
  const now=Date.now();
  const hour=sum(S.log.filter(e=>EXM[e.ex]?.t!=='run'&&now-e.ts<36e5&&e.ts<=now),e=>e.s);
  if(hour+s>LIM.setsHour) return {ok:false,t:'Calma, herói!',m:'Você registrou '+hour+' séries na última hora. O corpo precisa de tempo entre as séries: tente de novo daqui a pouco.'};
  const day=sum(todayEntries().filter(e=>EXM[e.ex]?.t!=='run'),e=>e.s);
  if(day+s>LIM.setsDay) return {ok:false,t:'Limite diário de séries',m:'Hoje você já fez '+day+' séries. Descanso também é treino: volte amanhã.'};
  return {ok:true};
}
/* desfaz recompensas que dependiam de séries apagadas */
function revalidateToday(){
  const es=todayEntries();
  if(S.q.d===ymd()){
    S.q.rw=S.q.rw||{};
    for(const id of S.q.claimed.slice()){
      const q=QUESTS.find(x=>x.id===id);if(!q||q.f(es)>=q.goal)continue;
      const rw=S.q.rw[id]||questReward();
      S.q.claimed=S.q.claimed.filter(x=>x!==id);S.qTotal=Math.max(0,S.qTotal-1);S.bonusXP-=rw.xp;S.goldBonus-=rw.gold;delete S.q.rw[id];
      if(S.q.allB){S.q.allB=false;S.bonusXP-=100;S.goldBonus-=50}
      toast('↩️','Recompensa de missão removida',q.t+': as séries que cumpriam a missão foram apagadas');
    }
  }
  if(typeof mtPlan==='function'&&S.mt&&S.mt.p){for(const [k,pr] of Object.entries(S.mt.p)){const d=pr.day-1;if(d<1||pr.done[d]!==ymd())continue;
    if(!mtPlan(k,d).items.every(mtItemDone)){const rw=(pr.rw&&pr.rw[d])||mtBonus();delete pr.done[d];pr.day=d;S.bonusXP-=rw.xp;S.goldBonus-=rw.gold;toast('↩️','Dia do mestre desfeito','As séries do treino do mestre foram apagadas')}}}
  for(const [d,dt] of Object.entries(S.dg.done)){
    if(dt!==ymd())continue;const day=dgDay(+d);
    if(!day.items.every(dgItemDone)){delete S.dg.done[d];S.bonusXP-=120+(+d)*8;S.goldBonus-=40;toast('↩️','Dia da Dungeon desfeito','Dia '+d+': as séries do dia foram apagadas')}
  }
  if(S.ab&&S.ab.done)for(const [d,dt] of Object.entries(S.ab.done)){
    if(dt!==ymd())continue;
    if(!abDay(+d).items.every(dgItemDone)){delete S.ab.done[d];S.bonusXP-=abXP(+d);S.goldBonus-=60;toast('↩️','Dia do Abismo desfeito','Dia '+d+': as séries do dia foram apagadas')}
  }
}

const ISO={run:false,cd:0,t0:0,int:null,hit:false,n:0,best:0,wake:null};
function isoBeep(f,d){try{const A=window.__isoAC||(window.__isoAC=new (window.AudioContext||window.webkitAudioContext)());const o=A.createOscillator(),g=A.createGain();o.frequency.value=f;o.type='square';g.gain.value=.08;o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+(d||.12))}catch(e){}}

  if(goal&&el>=goal&&!ISO.hit){ISO.hit=true;isoBeep(1320,.35);navigator.vibrate&&navigator.vibrate([200,80,200]);$('#isoG').textContent='🔥 META BATIDA! Segure mais se aguentar';T.parentElement.classList.add('hit')}
}
function isoGo(){
  const B=$('#isoB'),G=$('#isoG');if(!B)return;
  if(ISO.run){ // parar
    const el=Math.floor((Date.now()-ISO.t0)/1000);isoReset();
    B.textContent='▶ Próxima série';B.classList.remove('stop');
    if(el>0){ISO.n++;ISO.best=Math.max(ISO.best,el);$('#f_r').value=ISO.best;$('#f_s').value=Math.max(+$('#f_s').value||0,ISO.n);updatePreview()}

    $('#isoN').textContent=ISO.n?`Séries cronometradas: ${ISO.n} · melhor: ${ISO.best}s`:'';navigator.vibrate&&navigator.vibrate(120);return}
  if(ISO.cd>0)return;
  ISO.hit=false;const box=B.parentElement;box.classList.remove('hit');box.style.setProperty('--p','0%');
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>ISO.wake=w).catch(()=>{})}catch(e){}
  ISO.cd=3;$('#isoT').innerHTML='3';isoBeep(660);G.textContent='Prepare-se…';B.textContent='⏹ Parar';B.classList.add('stop');ISO.run=true;

    isoTick()},100);

const PUSH_FN='https://lpdicrpetxqnoxceozfa.supabase.co/functions/v1/fh-push';
function pushOk(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window}
function isStandalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}
function b64u(s){const p='='.repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function pushEnable(hora){
  S.treinoHora=hora;save();
  if(!pushOk()) return /iPhone|iPad/.test(navigator.userAgent)&&!isStandalone()?'ios':'nosup';
  const perm=await Notification.requestPermission(); if(perm!=='granted') return 'denied';
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub){const {publicKey}=await (await fetch(PUSH_FN+'?pub=1')).json();sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(publicKey)})}
    const j=sub.toJSON();const {data:{user}}=await FH.auth.getUser(); if(!user) return 'nouser';
    const {error}=await FH.from('fh_push').upsert({user_id:user.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,train_time:hora,tz:Intl.DateTimeFormat().resolvedOptions().timeZone||'America/Sao_Paulo',enabled:true,updated_at:new Date().toISOString()});
    if(error) throw error; S.pushOn=true;save(); return 'ok';
  }catch(e){console.warn('push',e);return 'err'}
}

const TV={db:null,me:null,owner:false,ready:false,docs:[],err:'',canWrite:true,unsub:null,draft:'',chan:'geral'};
let tvChain=Promise.resolve();
function subTaverna(){
  if(TV.unsub||!TV.db) return;
  const t=setTimeout(()=>{if(!TV.ready){TV.err='A Taverna está demorando para carregar. Verifique sua conexão.';paintFeed()}},10000);
  try{
    TV.unsub=TV.db.collection('taverna').onSnapshot(snap=>{
      TV.docs=snap.docs.filter(d=>d.exists).map(d=>Object.assign({},d.data()||{},{uid:d.id}));
      TV.ready=true;if(!snap.metadata||!snap.metadata.fromCache){TV.err='';clearTimeout(t)}
      paintFeed();
    },e=>{clearTimeout(t);TV.err='Não foi possível carregar a Taverna agora.';paintFeed()});
  }catch(e){clearTimeout(t);TV.err='Não foi possível carregar a Taverna agora.'}
}
function tvErr(e){
  if(e&&e.code==='invalid_argument'){TV.canWrite=false;toast('🔒','Você só pode ler a Taverna','Peça ao dono do app para te convidar como editor');if(tab==='taverna')render()}
  else if(e&&e.code==='quota_exceeded') toast('⚠️','A Taverna está cheia','Apague posts antigos para liberar espaço');
  else toast('⚠️','Não foi possível enviar','Tente de novo em instantes');
}
function heroSnap(){const li=levelInfo();return {name:S.name||'Herói',cls:S.cls,sex:sexOf(),avatar:myFace(),level:li.L,rank:rankOf(li.L),title:S.title||'',elite:isElite(),season:{k:seasonKey(),xp:seasonXP()}}}
function writeMine(mut){
  if(!TV.db||!TV.me) return;
  tvChain=tvChain.then(async()=>{
    const cur=TV.docs.find(d=>d.uid===TV.me);
    const doc=cur?JSON.parse(JSON.stringify(cur)):{};
    delete doc.uid;
    doc.posts=Array.isArray(doc.posts)?doc.posts:[];doc.likes=(doc.likes&&typeof doc.likes==='object')?doc.likes:{};
    mut(doc);
    doc.posts=doc.posts.slice(-100);
    const lk=Object.keys(doc.likes);if(lk.length>400){for(const k of lk.slice(0,lk.length-400))delete doc.likes[k]}
    doc.hero=heroSnap();doc.updated=Date.now();
    await TV.db.doc('taverna/'+TV.me).set(doc);
  }).catch(tvErr);
  return tvChain;
}
function modDelete(uid,pid){
  tvChain=tvChain.then(async()=>{
    const d=TV.docs.find(x=>x.uid===uid);if(!d)return;
    const doc=JSON.parse(JSON.stringify(d));delete doc.uid;
    doc.posts=(doc.posts||[]).filter(p=>p.id!==pid);
    await TV.db.doc('taverna/'+uid).set(doc);
  }).catch(tvErr);
}
const TV_LINK=/(https?:\/\/|www\.|\b[a-z0-9-]{2,}(\.|\s*(\[\.\]|\(\.\)|\bponto\b)\s*)(com|net|org|br|io|me|ly|app|link|site|online|store|shop|xyz|info|co|gg|tv|bio|club|top|pro|vip|page|wa)\b|wa\.me|t\.me\/|bit\.ly)/i;
function tvHasLink(t){return TV_LINK.test(String(t||''))}
function tvPost(text,kind,data,replyTo,vip){
  text=String(text||'').trim().slice(0,500);
  if(text&&tvHasLink(text)&&!TV.owner){toast('🚫','Links não são permitidos na Taverna','Apague o link e poste de novo');return false}
  if(!text&&!kind) return false;
  const p={id:uid(),ts:Date.now(),text,kind:kind||'text'};
  if(data)p.data=data;if(replyTo)p.replyTo=replyTo;if(vip||(!replyTo&&TV.chan==='vip'&&isElite()))p.vip=true;
  writeMine(doc=>doc.posts.push(p));
  return true;
}
function workoutShare(){
  const es=todayEntries();if(!es.length) return null;
  const items=es.map(e=>{const ex=EXM[e.ex]||{n:e.ex};if(ex.t==='run')return {n:'Corrida '+(e.r/1000).toFixed(2).replace('.',',')+' km em '+fmtDur(e.sec||0),s:0,r:0,kg:0,u:''};if(ex.t==='aer')return {n:ex.n,s:1,r:e.r,kg:0,u:'min'};return {n:ex.n,s:e.s,r:e.r,kg:ex.t==='mus'?e.kg:0,u:ex.u?'s':''}}).slice(0,12);
  return {xp:sum(es,e=>e.xp),items};
}
function ago(ts){
  const s=Math.max(0,(Date.now()-ts)/1000);
  if(s<60)return 'agora';if(s<3600)return Math.floor(s/60)+' min';if(s<86400)return Math.floor(s/3600)+' h';
  if(s<86400*7)return Math.floor(s/86400)+' d';const d=new Date(ts);return d.toLocaleDateString('pt-BR');
}
function feedData(){
  const all=[],likes={};
  for(const d of TV.docs){
    const hero=(d.hero&&typeof d.hero==='object')?d.hero:{};
    for(const p of (Array.isArray(d.posts)?d.posts:[])){
      if(!p||typeof p!=='object'||typeof p.id!=='string')continue;
      all.push({id:p.id,ts:+p.ts||0,text:String(p.text||'').slice(0,500),kind:String(p.kind||'text'),data:p.data,replyTo:typeof p.replyTo==='string'?p.replyTo:null,vip:!!p.vip,uid:d.uid,key:d.uid+':'+p.id,hero});
    }
    if(d.likes&&typeof d.likes==='object')for(const k in d.likes)(likes[k]=likes[k]||new Set()).add(d.uid);
  }
  const keys=new Set(all.map(p=>p.key));
  const top=all.filter(p=>!p.replyTo&&(TV.chan==='vip'?p.vip:!p.vip)).sort((a,b)=>b.ts-a.ts).slice(0,80);
  const reps={};for(const p of all)if(p.replyTo&&keys.has(p.replyTo))(reps[p.replyTo]=reps[p.replyTo]||[]).push(p);
  for(const k in reps)reps[k].sort((a,b)=>a.ts-b.ts);
  return {top,reps,likes};
}
function shareCard(p){
  const d=p.data;if(!d||typeof d!=='object')return '';
  if(p.kind==='treino'&&Array.isArray(d.items)){
    return `<div class="share-card">⚔️ <b>Treino do dia · +${fmt(+d.xp||0)} XP</b>${d.items.slice(0,12).map(i=>`<div class="muted">${esc(i.n)} — ${i.u==='min'?(+i.r||0)+' min':`${+i.s||0}×${+i.r||0}${i.u==='s'?'s':''}`}${+i.kg?' · '+(+i.kg)+' kg':''}</div>`).join('')}</div>`;
  }
  if(p.kind==='nivel'){
    return `<div class="share-card">🏅 <b>Nível ${+d.level||1}</b> · ${esc(d.rank||'')} · ${fmt(+d.xp||0)} XP total · 🔥 ${+d.streak||0} dias seguidos · ${+d.bosses||0} chefes derrotados</div>`;

}

}

function validCode(c){c=String(c||'').trim().toUpperCase().replace(/\s/g,'');const m=/^ELITE-([A-Z0-9]{5})([A-Z0-9])$/.exec(c);if(!m)return false;let x=0;for(const ch of m[1])x=(x*31+ch.charCodeAt(0))%CODE_A.length;return CODE_A[(x+7)%CODE_A.length]===m[2]}

const G_SPEC={forca:'⚔️ Força',resist:'🔥 Resistência',disc:'🧘 Disciplina'};
let gBoard=false;
function gRank(s){let r=G_RANKS[0];for(const x of G_RANKS)if(s>=x[1])r=x;return r}
function gNext(s){return G_RANKS.find(x=>x[1]>s)}
function gRI(r){return G_RANKS.findIndex(x=>x[0]===r)}
function gWeek(d=ymd()){const [y,m,dd]=d.split('-').map(Number);const dt=new Date(y,m-1,dd);const wd=(dt.getDay()+6)%7;return addDays(d,-wd)}
function gMs(d){const [y,m,dd]=d.split('-').map(Number);return new Date(y,m-1,dd).getTime()}
function gStats(ws){
  const prev=S.log.filter(e=>e.d>=addDays(ws,-28)&&e.d<ws);
  const D=Math.max(2,Math.round(new Set(prev.map(e=>e.d)).size/4));
  const sets=Math.max(20,Math.round(prev.filter(e=>e.ex!=='corrida').length/4));
  return {D,sets};
}
function gTargets(){
  const ws=gWeek(),G=S.guild;
  if(!G.wk||G.wk.id!==ws){const L=levelInfo().L,st=gStats(ws);
    G.wk={id:ws,L,t:{e:Math.min(7,Math.max(G.goal||3,1)),d:Math.round(st.sets*1.25),avg:st.sets,c:Math.min(7,Math.max(3,st.D+1)),b:L<10?1:2,a:L<15?1:2,s:Math.min(400,100+L*10)},active:[],done:{}};save()}
  return G.wk;
}
function gMissions(){
  const wk=gTargets(),t=wk.t,L=wk.L,ws=wk.id,wl=S.log.filter(e=>e.d>=ws);
  const days=new Set(wl.map(e=>e.d)).size,sets=wl.filter(e=>e.ex!=='corrida').length,st=streakInfo().cur;
  const best={},prior={};S.log.forEach(e=>{if(!e.kg||e.ex==='corrida')return;const o=e.d<ws?prior:best;o[e.ex]=Math.max(o[e.ex]||0,+e.kg||0)});
  const prs=Object.keys(best).filter(k=>prior[k]>0&&best[k]>prior[k]).length;
  const bos=Object.values(S.bosses||{}).filter(ts=>+ts>=gMs(ws)).length;
  const reps={};wl.forEach(e=>{if(e.ex==='corrida')return;const k=e.d+'|'+e.ex;reps[k]=(reps[k]||0)+(+e.r||0)});const mr=Math.max(0,...Object.values(reps));
  return [
    {id:'e',rk:'E',t:'Contrato de Ferro',d:`Cumpra seu juramento: treine ${t.e} dias nesta semana.`,p:days,g:t.e,x:60+L*4,s:25},
    {id:'d',rk:'D',t:'Caçada de Volume',d:`Complete ${t.d} séries até domingo (sua média é ${t.avg}).`,p:sets,g:t.d,x:90+L*5,s:40},
    {id:'c',rk:'C',t:'Sequência Inquebrável',d:`Chegue a ${t.c} dias seguidos de treino sem quebrar a chama 🔥.`,p:st,g:t.c,x:130+L*6,s:60},
    {id:'b',rk:'B',t:'Prova do Recorde',d:`Bata seu recorde de carga em ${t.b} exercício${t.b>1?'s':''} nesta semana.`,p:prs,g:t.b,x:180+L*7,s:90},
    {id:'a',rk:'A',t:'Caçador de Chefes',d:`Derrote ${t.a} chefe${t.a>1?'s':''} da aba Chefes nesta semana.`,p:bos,g:t.a,x:240+L*8,s:130},
    {id:'s',rk:'S',t:'Lenda do Ferro',d:`Faça ${t.s} repetições de um mesmo exercício em um único dia.`,p:mr,g:t.s,x:400+L*10,s:220}
  ];
}

const DG_POOL={
  monge:{A:[['flexao',1],['paralelas',1],['flexao_diam',2],['pike',2],['flexao_arq',3],['flexao_1b',4]],B:[['australiana',1],['chinup',1],['barra',2],['elev_pernas',3],['lsit',3]],C:[['agach',1],['afundo',1],['abdominal',1],['prancha',1],['bulgaro',2],['pistol',4]]},
  guerreiro:{A:[['supino',1],['desenv',1],['triceps',1],['supino_incl',2],['elev_lat',2],['triceps_testa',3]],B:[['terra',1],['remada',1],['rosca',1],['puxada',2],['martelo',2],['remada_baixa',3]],C:[['agach_barra',1],['legpress',1],['panturrilha',1],['stiff',2],['extensora',2],['flexora',3]]},
  paladino:{A:[['supino',1],['flexao',1],['paralelas',2],['desenv',2],['flexao_diam',3]],B:[['australiana',1],['remada',1],['barra',2],['rosca',2],['chinup',3]],C:[['agach_barra',1],['prancha',1],['bulgaro',2],['elev_pernas',3],['pistol',4]]}
};
const DG_NAMES={A:'Empurrar',B:'Puxar',C:'Pernas e Core'};
function dgDay(d){
  const w=Math.min(4,Math.ceil(d/7));
  if(d%7===0) return {d,rest:true,name:'Descanso ativo',items:[{ex:'prancha',s:3,r:20+10*w},{ex:'polichinelo',s:2,r:40}]};
  const k='ABC'[(d-Math.floor(d/7)-1)%3];
  const pool=DG_POOL[S.cls][k].filter(x=>w>=x[1]);
  const chosen=pool.slice().sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>x[0]);
  const items=pool.filter(x=>chosen.includes(x[0])).map(([id])=>{const ex=EXM[id];let r;
    if(ex.u==='s') r=(ex.tier>=3?8:20)+(ex.tier>=3?3:10)*(w-1);
    else if(ex.t==='mus') r=[12,10,8,6][w-1];
    else {const base=ex.tier>=4?3:ex.tier===3?5:ex.tier===2?8:12;r=Math.round(base*(1+0.2*(w-1)))}
    return {ex:id,s:w>=3?4:3,r}});
  return {d,name:DG_NAMES[k],items};
}
function dgCurrent(){let d=1;while(S.dg.done[d]&&d<=30)d++;return d}
function dgAvailable(d){if(d>30)return false;if(d===1)return true;const prev=S.dg.done[d-1];return !!prev&&prev<ymd()}
function dgItemDone(it){return todayEntries().some(e=>e.ex===it.ex)}
function dgComplete(){
  const d=dgCurrent();const day=dgDay(d);
  if(!dgAvailable(d)||!day.items.every(dgItemDone)) return;
  const prev=levelInfo().L;const xp=120+d*8;
  S.dg.done[d]=ymd();S.bonusXP+=xp;S.goldBonus+=40;
  if(d===10||d===20){const r=d===10?'Guardião das Ruínas':'Senhor do Abismo';if(!S.titles.includes(r)){S.titles.push(r);setTimeout(()=>toast('🏆','Relíquia conquistada!','Título “'+r+'”'),900)}}
  sfx(d===30?'dungeonfinal':'dungeon');toast('🗺️','Dia '+d+' da Dungeon concluído!','+'+xp+' XP · +40 ouro');
  if(d===30){S.bonusXP+=1000;if(!S.titles.includes('Conquistador da Dungeon'))S.titles.push('Conquistador da Dungeon');toast('👑','DUNGEON CONQUISTADA!','+1.000 XP e o título “Conquistador da Dungeon”')}
  afterProgress(prev);render();
}

};
function mtObj(){return (S.mt&&MT_OBJ[S.mt.obj])?S.mt.obj:'hip'}
function mtTier(){const L=levelInfo().L;return Math.min(5,1+Math.floor(L/6))}
function mtProg(key){S.mt=S.mt||{};S.mt.p=S.mt.p||{};return S.mt.p[key]=S.mt.p[key]||{day:1,done:{}}}
function mtPlan(key,day,obj){
  const M=MESTRES[key];const pr0=mtProg(key);day=day||pr0.day;obj=obj||(pr0.o&&pr0.o[day])||mtObj();const dow=day%7;const [name,groups]=(obj==='glu'?M_SPLIT_G:M_SPLIT)[key][dow];
  const rest=dow===0;const r=rng(hash('d'+day+key+(S.name||'')+(obj==='hip'?'':obj)));const tier=Math.min(5,mtTier()+(obj==='for'&&!rest?1:0));const L=levelInfo().L;
  const picks=[];const want=rest?3:obj==='for'?4:(groups.length>1?5:4);
  const per=groups.map((g,i)=>Math.ceil((want-picks.length)/(groups.length-i)));
  groups.forEach((g0,gi)=>{
    const [g,sub]=g0.split(':');
    let pool=EX.filter(e=>e.g===g&&(!e.nx||obj==='glu')&&!e.cx&&e.t!=='run'&&(rest?e.t==='cal':M.type.includes(e.t))&&(e.t!=='cal'||(e.tier||1)<=tier));
    if(sub==='t')pool=pool.filter(e=>TRI.includes(e.id));if(sub==='b')pool=pool.filter(e=>BI.includes(e.id));if(sub==='g')pool=pool.filter(e=>GLU.includes(e.id));if(sub==='q')pool=pool.filter(e=>QUA.includes(e.id));
    pool=pool.filter(e=>!picks.includes(e.id));
    pool.sort((a,b)=>((b.tier||1)-(a.tier||1))*(obj==='for'?2:obj==='emag'?.4:1)+(r()-.5)*2.2);
    if(sub==='g'){const top=M.type.includes('mus')?'hip_thrust':'ponte_gluteo';const i0=pool.findIndex(e=>e.id===top);if(i0>0)pool.unshift(pool.splice(i0,1)[0])}
    let n=Math.min(per[gi],pool.length);if(key==='paladino'&&!rest&&gi===0)n=Math.max(n,Math.min(pool.length,3));
    for(let i=0;i<n&&picks.length<want;i++)picks.push(pool[i].id);
  });
  const w=Math.min(4,1+Math.floor(L/8));
  if(obj==='emag'&&!rest&&!picks.some(id=>EXM[id].g==='Cardio')){const c=['burpee','polichinelo','corda'].filter(id=>EXM[id]&&!picks.includes(id));if(c.length)picks.push(c[Math.floor(r()*c.length)])}
  const r25=v=>Math.round(v/2.5)*2.5;
  const items=picks.map(id=>{const ex=EXM[id];let s=ex.t==='mus'?4:3,rr;
    if(ex.u==='s') rr=(ex.tier>=3?10:25)+(ex.tier>=3?4:10)*(w-1);
    else if(ex.t==='mus') rr=[12,10,10,8][w-1];
    else {const base=ex.tier>=4?3:ex.tier===3?6:ex.tier===2?10:15;rr=Math.round(base*(1+0.2*(w-1)))}
    if(obj==='for'){s=ex.t==='mus'?5:4;if(ex.u==='s')rr=Math.round(rr*1.2);else if(ex.t==='mus')rr=[6,5,5,4][w-1];else rr=Math.max(3,Math.round(rr*.6))}
    if(obj==='glu'){s=ex.t==='mus'?4:3;if(ex.u==='s')rr=rr+10;else if(ex.t==='mus')rr=[15,12,12,10][w-1];else rr=Math.round(rr*1.3)}
    if(obj==='emag'){s=3;if(ex.u==='s')rr=rr+15;else if(ex.t==='mus')rr=[15,15,18,20][w-1];else rr=Math.round(rr*1.5)}
    let kg=0;const l=S.last[id];if(ex.t==='mus'&&l){kg=l.kg+(l.r>=rr?2.5:0);if(obj==='for'&&l.r>rr+2)kg=r25(l.kg*1.12);if(obj==='emag'&&l.r<rr-3)kg=r25(l.kg*.75)}
    return {ex:id,s,r:rr,kg}});
  return {key,day,name,rest,obj,items,fala:M.fala[Math.floor(r()*M.fala.length)]};
}

function mtItemDone(it){return sum(todayEntries().filter(e=>e.ex===it.ex),e=>e.s)>=it.s}

/* ================== CORRIDA (GPS) ================== */
const RUN={on:false,paused:false,dist:0,moving:0,last:null,watch:null,wake:null,tick:null,lastTick:0,bad:0,acc:null,msg:'',pts:0};
function hav(a,b){const R=6371e3,t=Math.PI/180;const dLa=(b.la-a.la)*t,dLo=(b.lo-a.lo)*t;const x=Math.sin(dLa/2)**2+Math.cos(a.la*t)*Math.cos(b.la*t)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function runKmToday(){return sum(todayEntries().filter(e=>e.ex==='corrida'),e=>e.r)/1000}
function runXPPerKm(){return Math.round(60*(1+Math.min(levelInfo().L,30)*0.02))}
async function runWake(){try{if('wakeLock' in navigator){RUN.wake=await navigator.wakeLock.request('screen')}}catch(e){}}
function runStart(){
  if(!isElite())return eliteModal('Corrida com GPS');
  if(!('geolocation' in navigator))return toast('⚠️','GPS indisponível','Este aparelho não liberou a localização');
  if(clockTampered())return toast('🛡️','Relógio do aparelho alterado','Ajuste a data e hora para o automático');
  Object.assign(RUN,{on:true,paused:false,dist:0,moving:0,last:null,bad:0,acc:null,msg:'Procurando sinal de GPS…',pts:0,lastTick:Date.now()});
  RUN.watch=navigator.geolocation.watchPosition(runPos,e=>{RUN.msg=e.code===1?'Permita o acesso à localização para marcar a corrida.':'Sem sinal de GPS. Vá para um lugar aberto.';runPaint()},{enableHighAccuracy:true,maximumAge:0,timeout:20000});
  runWake();
  clearInterval(RUN.tick);RUN.tick=setInterval(()=>{const n=Date.now();if(RUN.on&&!RUN.paused&&RUN.last)RUN.moving+=(n-RUN.lastTick)/1000;RUN.lastTick=n;runPaint()},1000);
  render();
}
function runPos(p){
  if(!RUN.on||RUN.paused)return;
  const c=p.coords;RUN.acc=Math.round(c.accuracy);
  if(c.accuracy>35){RUN.msg='Sinal fraco ('+RUN.acc+' m). Aguardando precisão melhor…';runPaint();return}
  const pt={la:c.latitude,lo:c.longitude,t:p.timestamp||Date.now()};
  if(!RUN.last){RUN.last=pt;RUN.msg='GPS travado. Bora correr!';runPaint();return}
  const d=hav(RUN.last,pt),dt=(pt.t-RUN.last.t)/1000;if(dt<=0)return;
  const v=d/dt;
  if(v>7){RUN.bad+=dt;RUN.last=pt;RUN.msg='Velocidade acima de 25 km/h não conta (carro, moto ou bike).';
    if(RUN.bad>25){RUN.paused=true;RUN.msg='Corrida pausada: velocidade de veículo detectada.';sfx&&sfx('error')}
    runPaint();return}
  RUN.bad=Math.max(0,RUN.bad-dt);
  if(d<3)return;
  RUN.dist+=d;RUN.pts++;RUN.last=pt;RUN.msg='Correndo · precisão '+RUN.acc+' m';runPaint();
}
function runPause(){RUN.paused=!RUN.paused;if(!RUN.paused){RUN.last=null;RUN.bad=0;RUN.msg='Retomando… aguardando GPS';runWake()}render()}
function runStop(save){
  if(RUN.watch!=null)navigator.geolocation.clearWatch(RUN.watch);clearInterval(RUN.tick);try{RUN.wake&&RUN.wake.release()}catch(e){}
  const km=RUN.dist/1000,sec=RUN.moving;RUN.on=false;RUN.watch=null;
  if(!save){render();return}
  if(km<0.2){toast('🏃','Corrida muito curta','Corra pelo menos 200 m para registrar');render();return}
  const pace=sec/km;
  if(pace<150){toast('🛡️','Ritmo impossível','Mais rápido que 2:30 por km não é corrida a pé. A corrida não foi registrada.');render();return}
  const left=Math.max(0,LIM.runKmDay-runKmToday());const ck=Math.min(km,left);
  const m=multipliers({t:'cal'});const st=m.streak*m.elixir;
  const xp=Math.round(ck*runXPPerKm()*st);const prev=levelInfo().L;
  S.log.push({id:uid(),d:ymd(),ts:Date.now(),ex:'corrida',s:1,r:Math.round(km*1000),kg:0,xp,sec:Math.round(sec)});
  sfx('quest');toast('🏃',(km).toFixed(2).replace('.',',')+' km · +'+fmt(xp)+' XP',ck<km?'Só '+LIM.runKmDay+' km por dia contam XP':'Ritmo médio '+fmtDur(pace)+'/km');
  afterProgress(prev);render();
}
function runPaint(){
  const g=id=>document.getElementById(id);if(!g('runKm'))return;
  const km=RUN.dist/1000;g('runKm').textContent=km.toFixed(2).replace('.',',');g('runTime').textContent=fmtDur(RUN.moving);
  g('runPace').textContent=km>0.05?fmtDur(RUN.moving/km):'--:--';g('runXP').textContent='+'+fmt(Math.round(Math.min(km,Math.max(0,LIM.runKmDay-runKmToday()))*runXPPerKm()));
  g('runMsg').textContent=RUN.msg||'';
}

function bestReps(id){return Math.max(0,...S.log.filter(e=>e.ex===id).map(e=>e.r))}
function viewProgress(){
  if(!isElite()) return backMais()+`<h2>🌳 Guia de Progressão</h2>`+lockedView('Guia de Progressão','O caminho exato de cada habilidade da calistenia: o que dominar antes de passar para o próximo nível, com metas claras.',ART.full.monge,['4 árvores: Empurrar, Puxar, Pernas e Core','Metas de repetições para liberar o próximo passo','Do iniciante ao muscle-up e front lever']);
  return backMais()+`<h2>🌳 Guia de Progressão</h2><p class="muted" style="font-size:14px;margin:-4px 0 12px">Domine cada passo (atinja a meta numa série) para liberar o próximo.</p>`+TREES.map(t=>{
    let active=false;
    const steps=t.steps.map(([id,goal],i)=>{const ex=EXM[id];const b=bestReps(id);const done=b>=goal;let st='lock';
      if(done)st='done';else if(!active){st='cur';active=true}
      return `<div class="node ${st}"><span class="nd">${st==='done'?'✓':st==='cur'?'▶':'🔒'}</span><div style="flex:1;min-width:0"><div class="glow" style="font-weight:700">${esc(ex.n)} ${ex.tier?`<span class="tier t${ex.tier}">${ROMAN[ex.tier]}</span>`:''}</div>
       <div class="dim" style="font-size:12.5px">Meta: ${goal}${ex.u?'s':' reps'} numa série · seu melhor: ${b}${ex.u?'s':''}</div>
       ${st==='cur'?`<div class="track" style="margin-top:6px;height:10px"><i style="width:${Math.min(100,b/goal*100)}%"></i></div>`:''}</div>
       ${st==='cur'?`<button class="btn sm" data-a="ex" data-id="${id}">Treinar</button>`:''}</div>`}).join('');
    return `<div class="win"><div class="wtitle" style="font-size:16px;padding:6px 26px">${t.n.toUpperCase()}</div>${steps}</div>`}).join('');
}

  const ids=[...new Set(S.log.filter(e=>EXM[e.ex]&&EXM[e.ex].t==='mus').map(e=>e.ex))];
  if(!ids.length) return backMais()+`<h2>📊 Planilha do Guerreiro</h2><div class="card"><p class="muted">Registre exercícios de musculação para a planilha começar a se preencher.</p></div>`;
  return backMais()+`<h2>📊 Planilha do Guerreiro</h2>`+ids.map(id=>{const es=S.log.filter(e=>e.ex===id);const ex=EXM[id];
    const best=Math.max(...es.map(e=>e.kg||0));const rm=Math.max(...es.map(e=>(e.kg||0)*(1+e.r/30)));const last=es[es.length-1];
    const sug=last.r>=10?Math.round(((last.kg||0)+2.5)*2)/2:(last.kg||0);
    const byD={};es.forEach(e=>{byD[e.d]=Math.max(byD[e.d]||0,e.kg||0)});const hist=Object.entries(byD).sort().slice(-8);const hmax=Math.max(1,...hist.map(x=>x[1])),hmin=Math.min(...hist.map(x=>x[1]));
    const chart=hist.length>1?`<div class="kgh">${hist.map(([d,v])=>`<span title="${d.slice(8)}/${d.slice(5,7)}: ${fmtKg(v)} kg"><i style="height:${hmax>hmin?Math.round(18+62*(v-hmin)/(hmax-hmin)):60}%"></i><small>${fmtKg(v)}</small><em>${d.slice(8)}/${d.slice(5,7)}</em></span>`).join('')}</div>`:'';
    return `<div class="card sheetc"><div class="row between"><b class="glow">${esc(ex.n)}</b><span class="dim" style="font-size:12px">${es.length} ${es.length===1?'treino':'treinos'}</span></div>
     <div class="sgrid"><div><small>RECORDE</small><b>${fmtKg(best)} kg</b></div><div><small>1RM ESTIMADO</small><b>${fmtKg(Math.round(rm*2)/2)} kg</b></div><div><small>ÚLTIMO</small><b>${last.s}×${last.r} · ${kgTxt(last)}</b></div><div><small>PRÓXIMO TREINO</small><b class="${sug>(last.kg||0)?'up':''}">${sug} kg ${sug>(last.kg||0)?'↑':''}</b></div></div>${chart}</div>`}).join('');
}

/* ================== TIMER ================== */
function tickTimer(){
  const el=$('#clock');if(!el)return;
  if(!timerEnd){el.textContent='--:--';el.classList.remove('done');return}
  const left=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));
  el.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
  el.classList.toggle('done',left===0);
}
function startTimer(sec){
  timerEnd=Date.now()+sec*1000;clearInterval(timerInt);
  timerInt=setInterval(()=>{tickTimer();if(Date.now()>=timerEnd){clearInterval(timerInt);sfx('timer');toast('⏱️','Descanso terminado!','Hora da próxima série');try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}},250);
  tickTimer();
}

  const w=Math.min(4,Math.ceil(d/15));

    if(ex.u==='s') r=(ex.tier>=3?12:30)+(ex.tier>=3?4:10)*w;

    else {const base=ex.tier>=4?4:ex.tier===3?6:ex.tier===2?10:15;r=Math.round(base*(1.2+0.15*w))}

const TV_PH=()=>FH_URL+'/storage/v1/object/public/fh-tav/';
function tvSafe(u){return typeof u==='string'&&u.startsWith(TV_PH())&&!/["'<>\s]/.test(u)}
function tvShrink(file){return new Promise((ok,no)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const M=1280,r=Math.min(1,M/Math.max(img.width,img.height)),w=Math.round(img.width*r),h=Math.round(img.height*r);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);
    const tryQ=q=>c.toBlob(bl=>{if(!bl)return no(new Error('falha'));if(bl.size>1400000&&q>.45)return tryQ(q-.15);ok({blob:bl,w,h,url:URL.createObjectURL(bl)})},'image/jpeg',q);tryQ(.82)};
  img.onerror=()=>{URL.revokeObjectURL(u);no(new Error('imagem inválida'))};img.src=u})}
document.addEventListener('change',async e=>{if(e.target.id!=='tv_file')return;if(!isElite()&&!TV.owner){e.target.value='';return}const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  if(!/^image\//.test(f.type)){toast('📷','Escolha uma imagem');return}
  try{const ph=await tvShrink(f);if(TV.photo)try{URL.revokeObjectURL(TV.photo.url)}catch(_){}TV.photo=ph;const t=$('#tv_text');if(t)TV.draft=t.value;render()}catch(err){toast('📷','Não consegui abrir essa foto','Tente outra imagem')}});
async function tvPostPhoto(text,btn){
  if(TV.uploading)return;if(tvHasLink(text)&&!TV.owner){toast('🚫','Links não são permitidos na Taverna','Apague o link e poste de novo');return}if(!isElite()&&!TV.owner){TV.photo=null;toast('👑','Foto na Taverna é exclusiva do VIP');render();return}TV.uploading=true;if(btn){btn.disabled=true;btn.textContent='Enviando…'}
  try{const id=uid(),path=TV.me+'/'+id+'.jpg';
    const {error}=await FH.storage.from('fh-tav').upload(path,TV.photo.blob,{contentType:'image/jpeg',cacheControl:'31536000'});
    if(error)throw error;
    const url=TV_PH()+path;try{URL.revokeObjectURL(TV.photo.url)}catch(_){}
    tvPost(text,'foto',{url,w:TV.photo.w,h:TV.photo.h});TV.photo=null;TV.draft='';const t=$('#tv_text');if(t)t.value='';
    toast('📸','Foto postada na Taverna');render();
  }catch(err){toast('📷','Não foi possível enviar a foto','Verifique a internet e tente de novo');if(btn){btn.disabled=false;btn.textContent='➤ Postar'}}
  finally{TV.uploading=false}}
function postKind(p){
  if(p.kind==='foto')return '📸 Foto';
  if(p.kind==='treino')return '💪 Treino de força';
  if(p.kind==='nivel')return '🏅 Evolução';
  if(/dungeon/i.test(p.text))return '🗺️ Dungeon';
  if(/chefe|goblin|troll|golem|hidra|lich|espectro|drag|wyvern|demônio/i.test(p.text))return '🐉 Chefes';
  return '';
}
