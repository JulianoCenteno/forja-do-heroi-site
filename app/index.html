<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forja do Herói — Treino RPG</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05070d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<script src="supabase.js"></script>
<style>
:root{
  --bg:#05070d;--panel:#0b1222;--panel2:#101a30;--line:#1b2b4d;--line2:#24406f;
  --gold:#4fc3ff;--gold2:#2f7fd6;--text:#e6f1ff;--mute:#8ea3c4;--dim:#5e7192;
  --red:#9d4dff;--green:#69b874;--blue:#5a9be0;--purple:#a77de8;--teal:#4fc1b0;
  --r:0px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Rajdhani,system-ui,sans-serif;font-size:16px;font-weight:500}
body{min-height:100vh;background:
  radial-gradient(1200px 500px at 50% -200px,#0f2147 0%,transparent 70%),
  linear-gradient(rgba(79,195,255,.035) 1px,transparent 1px) 0 0/100% 40px,
  linear-gradient(90deg,rgba(79,195,255,.035) 1px,transparent 1px) 0 0/40px 100%,var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold2)}
.app{max-width:560px;margin:0 auto;padding:0 14px 96px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 2px;background:linear-gradient(var(--bg) 70%,transparent)}
.brand{font-family:Jost,sans-serif;font-weight:900;letter-spacing:.12em;font-size:14px;color:var(--gold);text-shadow:0 0 12px rgba(79,195,255,.6)}
.brand small{display:block;font-family:Rajdhani;font-weight:600;letter-spacing:.2em;color:var(--dim);font-size:10px}
.topr{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:14px}
.iconbtn{width:36px;height:36px;border-radius:6px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:17px}
h2{font-family:Jost,sans-serif;font-weight:600;font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 0 10px rgba(150,215,255,.85);margin:24px 0 10px}
h2 .sub{font-family:Rajdhani;font-size:13px;color:var(--mute);letter-spacing:0;font-weight:600;margin-left:6px}
.card{position:relative;background:rgba(4,10,22,.78);border:1px solid rgba(200,235,255,.6);border-radius:0;padding:14px;box-shadow:0 0 10px rgba(79,195,255,.35),inset 0 0 18px rgba(79,195,255,.12)}
.card+.card{margin-top:10px}
.muted{color:var(--mute)}.dim{color:var(--dim)}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

/* hero */
.hero{position:relative;overflow:hidden;padding:18px}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(400px 160px at 15% 0,rgba(79,195,255,.16),transparent 70%);pointer-events:none}
.crest{width:78px;height:78px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:36px;
  background:radial-gradient(circle at 35% 30%,#0f2147,#060a14);border:2px solid var(--gold);box-shadow:0 0 0 4px #060a14,0 0 0 5px var(--gold2),0 0 24px rgba(79,195,255,.25)}
.hname{font-family:Jost,sans-serif;font-weight:900;font-size:22px;line-height:1.1}
.htitle{color:var(--gold);font-weight:700;font-size:14px}
.hclass{color:var(--mute);font-size:14px}
.lvl{margin-left:auto;text-align:center;flex:none}
.lvl b{display:block;font-family:Jost,sans-serif;font-size:34px;line-height:1;color:var(--gold);text-shadow:0 0 16px rgba(79,195,255,.35)}
.lvl span{font-size:11px;letter-spacing:.2em;color:var(--mute)}
.rank{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:6px;border:1px solid var(--gold2);color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.bar{height:12px;border-radius:99px;background:#04060c;border:1px solid var(--line);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold2),var(--gold));box-shadow:0 0 12px rgba(79,195,255,.5);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.red i{background:linear-gradient(90deg,#5b2a9e,var(--red));box-shadow:0 0 12px rgba(157,77,255,.5)}
.bar.thin{height:8px}
.xpline{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:5px}
.stat{padding:10px;text-align:center;border-radius:6px;background:var(--panel);border:1px solid var(--line)}
.stat b{display:block;font-size:20px;font-weight:700}
.stat span{font-size:11px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.attr{display:grid;grid-template-columns:44px 1fr 34px;gap:10px;align-items:center;padding:7px 0}
.attr .k{font-family:Jost,sans-serif;font-weight:700;font-size:14px}
.attr .v{text-align:right;font-weight:700;font-size:18px}
.attr small{grid-column:2/4;margin-top:-6px;font-size:12px;color:var(--dim)}
.week{display:flex;gap:6px;align-items:flex-end;height:70px;margin-top:8px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.week i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,var(--gold),var(--gold2));min-height:3px}
.week i.zero{background:var(--line)}
.week span{font-size:11px;color:var(--dim)}
.buffs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.buff{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:#1e2a1f;color:#9fd8a6;border:1px solid #2f4a33}
.buff.p{background:#261d33;color:#cdb3f5;border-color:#3f2f57}

/* achievements */
.ach{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:4px}
.badge .e{font-size:24px;filter:grayscale(1) brightness(.5)}
.badge .t{font-size:10.5px;line-height:1.1;color:var(--dim);font-weight:600}
.badge.on{border-color:var(--gold2);background:radial-gradient(circle at 50% 30%,#0f2147,var(--panel))}
.badge.on .e{filter:none}.badge.on .t{color:var(--text)}

/* train */
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:700;color:var(--mute)}
.seg button.on{background:linear-gradient(180deg,#0f2147,#0f2147);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold2)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-size:14px;font-weight:600;color:var(--mute)}
.chip.on{border-color:var(--gold2);color:var(--gold)}
.exlist{display:grid;gap:8px;margin-top:8px}
.ex{display:flex;align-items:center;gap:12px;padding:12px;border-radius:6px;background:var(--panel);border:1px solid var(--line);text-align:left;width:100%}
.ex:active{transform:scale(.99)}
.ex .ic{width:38px;height:38px;border-radius:6px;display:grid;place-items:center;background:#060a14;border:1px solid var(--line);font-size:18px;flex:none}
.ex .n{font-weight:700;font-size:16px}
.ex .d{font-size:12.5px;color:var(--mute)}
.ex .m{margin-left:auto;font-size:12px;font-weight:700;color:var(--gold);white-space:nowrap}
.tier{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:2px}
.t1{background:#22301f;color:#9fd8a6}.t2{background:#1d2a3a;color:#9cc6f2}.t3{background:#2e2140;color:#cdb3f5}.t4{background:#0f2a4a;color:#8bdcff}.t5{background:#24124a;color:#d6a1ff}
.timer{display:flex;align-items:center;gap:8px}
.timer .clock{font-family:Jost,sans-serif;font-weight:700;font-size:22px;min-width:70px;color:var(--gold)}
.timer .clock.done{color:var(--green);animation:pulse 1s infinite}
.tbtn{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:13px}
.entry{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry .n{font-weight:700}
.entry .d{font-size:13px;color:var(--mute)}
.entry .x{margin-left:auto;font-weight:700;color:var(--gold);white-space:nowrap}
.del{width:28px;height:28px;border-radius:8px;color:var(--dim);font-size:16px;flex:none}
.del:hover{color:var(--red);background:#1c1036}

/* quests / bosses */
.quest{position:relative}
.quest .qt{font-family:Jost,sans-serif;font-weight:700;font-size:16px}
.quest .qd{color:var(--mute);font-size:14px;margin:2px 0 10px}
.reward{font-size:13px;font-weight:700;color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:0;font-weight:700;font-size:15px;letter-spacing:.04em;background:rgba(79,195,255,.2);border:1px solid #dff4ff;color:#fff;text-shadow:0 0 8px #9fdcff;box-shadow:0 0 16px rgba(79,195,255,.45),inset 0 0 12px rgba(79,195,255,.25)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:linear-gradient(180deg,#e0664e,#9b3322);color:#fff;box-shadow:0 2px 0 #5c1c12}
.btn.full{width:100%}
.btn.sm{padding:7px 12px;font-size:13px}
.done-tag{font-size:12px;font-weight:700;color:var(--green);letter-spacing:.08em}
.boss{display:flex;gap:12px;align-items:center}
.boss .face{width:58px;height:58px;flex:none;border-radius:6px;display:grid;place-items:center;font-size:32px;background:radial-gradient(circle at 50% 35%,#24124a,#0a0616);border:1px solid #3d2470}
.boss.dead .face{filter:grayscale(1);opacity:.6;border-color:var(--line)}
.boss .bn{font-family:Jost,sans-serif;font-weight:700;font-size:16px}
.boss .bd{font-size:13.5px;color:var(--mute)}
.boss .hp{font-size:12px;color:var(--mute);margin-top:6px;display:flex;justify-content:space-between}
.slain{font-family:Jost,sans-serif;font-weight:900;color:var(--green);font-size:12px;letter-spacing:.14em;border:1px solid #2f4a33;padding:2px 6px;border-radius:5px;transform:rotate(-4deg);display:inline-block}
.shop{display:flex;align-items:center;gap:12px}
.shop .si{font-size:28px;width:48px;text-align:center}
.shop .sn{font-weight:700;font-size:16px}
.shop .sd{font-size:13px;color:var(--mute)}
.shop .btn{margin-left:auto;flex:none}
.dayh{display:flex;justify-content:space-between;font-family:Jost,sans-serif;font-weight:700;color:var(--gold);font-size:14px;margin:16px 0 4px}


/* janelas do sistema */
.glow{color:#fff;text-shadow:0 0 10px rgba(150,215,255,.85)}
.win{position:relative;border:1px solid rgba(200,235,255,.6);background:rgba(4,10,22,.8);box-shadow:0 0 10px rgba(79,195,255,.35),inset 0 0 18px rgba(79,195,255,.12);padding:16px}
.win+.win{margin-top:12px}
.wtitle{display:table;margin:2px auto 16px;padding:8px 46px;border:1px solid rgba(200,235,255,.6);box-shadow:0 0 10px rgba(79,195,255,.35),inset 0 0 12px rgba(79,195,255,.12);font-family:Jost,sans-serif;font-weight:500;font-size:22px;letter-spacing:.18em;color:#fff;text-shadow:0 0 10px rgba(150,215,255,.85)}
.st-top{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap}
.st-lv{text-align:center;line-height:1}
.st-lv b{display:block;font-family:Jost,sans-serif;font-weight:600;font-size:72px;color:#fff;text-shadow:0 0 20px rgba(150,215,255,.95)}
.st-lv span{font-size:13px;letter-spacing:.22em}
.st-info{display:grid;gap:6px;font-size:15px;line-height:1.2;font-weight:700}
.st-info small{font-size:11px;color:var(--mute);letter-spacing:.08em;font-weight:600}
.barrow{display:flex;align-items:center;gap:10px}
.barrow .lb{width:40px;font-weight:700;font-size:12px;letter-spacing:.06em;text-align:center}
.track{flex:1;height:14px;border-radius:99px;border:1.5px solid rgba(220,242,255,.85);padding:2px;box-shadow:0 0 8px rgba(79,195,255,.6)}
.track i{display:block;height:100%;border-radius:99px;background:#e6f6ff;box-shadow:0 0 8px #9fdcff;transition:width .6s}
.track.v i{background:#d8c2ff;box-shadow:0 0 8px #a77de8}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;text-align:center}
.mini b{display:block;font-family:Jost,sans-serif;font-weight:600;font-size:20px}
.mini span{font-size:10.5px;color:var(--mute);letter-spacing:.08em}
.stgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px}
.stc{display:flex;align-items:center;gap:8px}
.stc svg{flex:none;filter:drop-shadow(0 0 4px rgba(79,195,255,.9))}
.stc .k{font-weight:600;font-size:15px;letter-spacing:.06em}
.stc .v{font-family:Jost,sans-serif;font-weight:600;font-size:28px;margin-left:auto;padding-right:6px}
.corner{position:absolute;width:24px;height:24px;filter:drop-shadow(0 0 6px rgba(79,195,255,.9));pointer-events:none}
.c1{top:-2px;left:-2px;border-top:2px solid #9fe0ff;border-left:2px solid #9fe0ff}
.c2{top:-2px;right:-2px;border-top:2px solid #9fe0ff;border-right:2px solid #9fe0ff}
.c3{bottom:-2px;left:-2px;border-bottom:2px solid #9fe0ff;border-left:2px solid #9fe0ff}
.c4{bottom:-2px;right:-2px;border-bottom:2px solid #9fe0ff;border-right:2px solid #9fe0ff}
.qwin{background:linear-gradient(180deg,rgba(10,30,70,.94),rgba(5,14,32,.94));text-align:center;padding:26px 18px 22px}
.qhead{display:flex;align-items:center;justify-content:center;gap:10px;padding-bottom:12px;border-bottom:1px solid rgba(159,224,255,.5);font-family:Jost,sans-serif;font-weight:600;font-size:22px;letter-spacing:.1em}
.qbang{width:28px;height:28px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-size:15px;font-weight:700;box-shadow:0 0 8px rgba(150,215,255,.8)}
.qgoal{font-family:Jost,sans-serif;font-weight:600;font-size:20px;letter-spacing:.12em;color:#7dff9b;text-shadow:0 0 10px rgba(125,255,155,.7);margin:16px 0 8px}
.qrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;text-align:left;padding:9px 0;border-bottom:1px dashed rgba(159,224,255,.15)}
.qrow .qn{font-weight:700;font-size:15.5px;letter-spacing:.02em}
.qrow small{display:block;font-size:12.5px;color:var(--mute);font-weight:500;margin-top:2px}
.qrow .qv{font-family:Jost,sans-serif;font-weight:500;font-size:16px;white-space:nowrap}
.qrow.done .glow{color:#7dff9b;text-shadow:0 0 10px rgba(125,255,155,.7)}
.qrow .btn{margin-top:6px}
.warn{margin-top:16px;font-weight:700;font-size:15px;line-height:1.4}
.warn b{color:#ff5a5a;text-shadow:0 0 10px rgba(255,90,90,.7)}
.qtimer{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;color:#bfe9ff;font-family:Jost,sans-serif;font-size:17px;letter-spacing:.1em}


.facei{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
._old_hbanner{position:relative;height:190px;margin-bottom:12px;border:1px solid rgba(200,235,255,.6);box-shadow:0 0 14px rgba(79,195,255,.4);overflow:hidden;background:#04060c}
.hbanner img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
.hbanner:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,7,14,0) 40%,rgba(4,7,14,.9))}
.hbanner span{position:absolute;left:14px;bottom:10px;z-index:1;font-family:Jost,sans-serif;font-weight:600;letter-spacing:.16em;font-size:13px;color:#fff;text-shadow:0 0 10px rgba(150,215,255,.9)}
.st-face{width:84px;height:84px;border-radius:50%;overflow:hidden;border:2px solid #dff4ff;box-shadow:0 0 16px rgba(79,195,255,.7);flex:none}

/* artes e planos */
.stage{position:relative;overflow:hidden;height:260px;border:1px solid rgba(200,235,255,.5);box-shadow:0 0 16px rgba(79,195,255,.25);margin-bottom:12px}
.stage.sm{height:210px}
.stage-word{position:absolute;right:-6px;top:4px;font-family:Jost,sans-serif;font-weight:800;font-size:86px;line-height:.85;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.2);white-space:nowrap;pointer-events:none}
.stage.sm .stage-word{font-size:70px}
.stage-art{position:absolute;right:0;top:6px;height:calc(100% + 20px);width:auto;max-width:none;filter:drop-shadow(0 0 22px var(--acc));-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 92%,transparent),linear-gradient(180deg,#000 78%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 92%,transparent),linear-gradient(180deg,#000 78%,transparent);mask-composite:intersect}
.stage-info{position:relative;z-index:1;padding:16px;max-width:62%;display:flex;flex-direction:column;gap:6px;justify-content:flex-end;height:100%}
.stage .tag{align-self:flex-start;padding:4px 10px;border:1px solid rgba(200,235,255,.6);background:rgba(4,10,22,.6);font-size:10.5px;font-weight:700;letter-spacing:.16em;color:#fff}
.stage-name{display:inline-block;align-self:flex-start;background:#fff;color:#05070d;font-family:Jost,sans-serif;font-weight:800;font-size:20px;padding:2px 10px;line-height:1.3}
.stage-cls{font-weight:700;font-size:13.5px;color:var(--acc);text-shadow:0 0 10px currentColor;letter-spacing:.04em}
.stage-title{font-size:13px;color:#fff;opacity:.9}
.crown{display:inline-block;align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.14em;color:#1a1006;background:linear-gradient(90deg,#ffd27a,#ffb238);padding:3px 9px;box-shadow:0 0 12px rgba(255,198,90,.55)}
.crown.big{font-size:13px;padding:5px 12px}
.crown.sm{position:absolute;top:6px;right:6px;padding:1px 5px;font-size:11px}
.btn.gold{background:linear-gradient(180deg,rgba(255,210,122,.35),rgba(255,178,56,.25));border-color:#ffe2a3;text-shadow:0 0 10px rgba(255,210,122,.9);box-shadow:0 0 22px rgba(255,198,90,.5),inset 0 0 14px rgba(255,198,90,.3)}
.pill.elite{color:#1a1006;background:linear-gradient(90deg,#ffd27a,#ffb238);border-color:#ffd27a;font-size:12px}
.pill.up{color:#ffd27a;border-color:#a8801f;font-size:12px;cursor:pointer}
.ebanner{position:relative;height:150px;overflow:hidden;margin:-18px -16px 0;border-bottom:1px solid rgba(255,210,122,.5)}
.ebanner img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.ebanner .crown{position:absolute;left:14px;bottom:12px}
.elist{list-style:none;display:grid;gap:8px;margin:12px 0 14px}
.elist li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.elist li span{flex:none;width:22px;text-align:center}
.locked{padding:0;overflow:hidden;border-color:rgba(255,210,122,.55);box-shadow:0 0 16px rgba(255,198,90,.25)}
.lk-art{position:relative;height:200px;overflow:hidden;background:radial-gradient(circle at 50% 60%,#2a1d08,#05070d)}
.lk-art img{width:100%;height:100%;object-fit:cover;object-position:50% 15%;filter:saturate(.8) brightness(.75)}
.lk-art .crown{position:absolute;left:12px;bottom:12px}
.lk-body{padding:16px}
.lk-body h3{font-family:Jost,sans-serif;font-size:20px;text-transform:uppercase;margin-bottom:6px}
.promo{display:flex;align-items:stretch;width:100%;text-align:left;margin:12px 0;border:1px solid rgba(255,210,122,.6);background:rgba(20,14,4,.85);box-shadow:0 0 16px rgba(255,198,90,.25);overflow:hidden;padding:0}
.promo img{width:42%;object-fit:cover;object-position:50% 20%;min-height:96px}
.promo-t{display:flex;flex-direction:column;gap:5px;padding:12px;justify-content:center}
.promo-t b{font-size:15px;line-height:1.2}
.promo-t small{font-size:12px;color:var(--mute)}
.cbanner{position:relative;height:300px;margin:0 -14px;overflow:hidden}
.cbanner img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.cbanner:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,13,0) 35%,#05070d 96%)}
.cb-t{position:absolute;left:0;right:0;bottom:8px;z-index:1;text-align:center;padding:0 14px}
.cb-t .tag{display:inline-block;padding:4px 10px;border:1px solid rgba(200,235,255,.6);background:rgba(4,10,22,.6);font-size:10.5px;font-weight:700;letter-spacing:.16em}
.cb-t h1{font-family:Jost,sans-serif;font-weight:800;font-size:34px;letter-spacing:.06em;color:#fff;text-shadow:0 0 22px rgba(79,195,255,.85);margin-top:6px}
.cb-t p{color:#dbe8ff;font-weight:600;font-size:15px}
.bossban{position:relative;height:190px;overflow:hidden;margin:8px 0 14px;border:1px solid rgba(199,125,255,.6);box-shadow:0 0 18px rgba(157,77,255,.35)}
.bossban img{width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.bossban>div{position:absolute;left:0;right:0;bottom:0;padding:14px;background:linear-gradient(180deg,transparent,rgba(5,7,13,.92))}
.bossban .tag{display:inline-block;padding:3px 9px;border:1px solid rgba(199,125,255,.6);background:rgba(17,12,34,.7);font-size:10.5px;font-weight:700;letter-spacing:.16em}
.lv-art{height:170px;width:auto;margin:-6px auto 6px;filter:drop-shadow(0 0 20px rgba(79,195,255,.7))}
.dggrid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.dgc{aspect-ratio:1;display:grid;place-items:center;font-size:12px;font-weight:700;border:1px solid rgba(159,224,255,.25);color:var(--dim)}
.dgc.ok{border-color:#7dff9b;color:#7dff9b;box-shadow:0 0 8px rgba(125,255,155,.4)}
.dgc.cur{border-color:#fff;color:#fff;box-shadow:0 0 10px rgba(79,195,255,.8);background:rgba(79,195,255,.2)}
.rank-row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px dashed rgba(159,224,255,.15)}
.rank-row.me{background:rgba(79,195,255,.12);border:1px solid rgba(159,224,255,.6)}
.rank-row .rk{width:26px;text-align:center;font-weight:800}
.rank-row .rn{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-row .rx{font-family:Jost,sans-serif;font-weight:600}
.node{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed rgba(159,224,255,.15);position:relative}
.node:last-child{border-bottom:0}
.node .nd{width:30px;height:30px;flex:none;display:grid;place-items:center;border:1px solid rgba(159,224,255,.4);transform:rotate(45deg);font-size:12px}
.node .nd{line-height:1}
.node.done .nd{border-color:#7dff9b;color:#7dff9b;box-shadow:0 0 8px rgba(125,255,155,.5)}
.node.cur .nd{border-color:#fff;box-shadow:0 0 10px rgba(79,195,255,.8);background:rgba(79,195,255,.2)}
.node.lock{opacity:.5}
.sheetc .sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.sgrid small{display:block;font-size:10.5px;letter-spacing:.12em;color:var(--mute)}
.sgrid b{font-family:Jost,sans-serif;font-weight:600;font-size:17px}
.sgrid b.up{color:#7dff9b;text-shadow:0 0 8px rgba(125,255,155,.6)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;text-align:left;padding:14px;border:1px solid rgba(200,235,255,.5);background:rgba(4,10,22,.8);box-shadow:inset 0 0 18px rgba(79,195,255,.1);display:flex;flex-direction:column;gap:3px}
.tile .te2{font-size:24px}
.tile b{font-size:16px}
.tile small{font-size:12px;color:var(--mute)}
.tile.lk{border-color:rgba(255,210,122,.45)}
.back{color:var(--cy2,#9fe0ff);font-weight:700;font-size:14px;padding:6px 0;letter-spacing:.06em}
.gname{color:#ffd27a!important;text-shadow:0 0 8px rgba(255,198,90,.6)}
.lockdot{position:absolute;top:2px;right:calc(50% - 20px);font-size:9px}
.cls .ce{width:58px;height:58px}
/* taverna */
.post{padding:12px 14px}
.post .ph{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#060a14;border:1px solid var(--gold2);font-size:18px;flex:none}
.reply .av{width:30px;height:30px;font-size:14px}
.post .pn{font-weight:700;line-height:1.15}
.post .pm{font-size:12px;color:var(--dim)}
.post .pt{margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.post .pa{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pact{padding:5px 10px;border-radius:8px;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--mute)}
.pact.on{color:#d6a1ff;border-color:#3d2470;background:#160d2c}
.replies{margin-top:10px;padding-left:12px;border-left:2px solid var(--line);display:grid;gap:10px}
.reply .pt{margin-top:4px;font-size:15px}
.share-card{margin-top:8px;padding:10px 12px;border-radius:6px;background:#060a14;border:1px dashed var(--gold2);font-size:14px}
.share-card b{color:var(--gold)}
.you{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--gold);border:1px solid var(--gold2);border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:2px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:linear-gradient(transparent,var(--bg) 30%);padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr);background:#080c18;border:1px solid var(--line);border-radius:6px;padding:5px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:6px;color:var(--dim);font-size:10px;font-weight:700;letter-spacing:0;position:relative;min-width:0}
.nav button .e{font-size:19px;filter:grayscale(.8)}
.nav button.on{color:var(--gold);background:#0f2147}
.nav button.on .e{filter:none}
.dot{position:absolute;top:4px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px #080c18}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(5,4,3,.75);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.scrim.center{align-items:center}
.sheet{width:100%;max-width:560px;background:linear-gradient(180deg,#0f1d3a,#0a1020);border:1px solid var(--line2);border-bottom:0;border-radius:6px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .25s cubic-bezier(.2,.8,.2,1)}
.scrim.center .sheet{border-radius:6px;border-bottom:1px solid var(--line2);margin:16px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.sheet h3{font-family:Jost,sans-serif;font-size:20px;color:var(--gold);margin-bottom:4px}
.field{margin-top:12px}
.field label{display:block;font-size:13px;color:var(--mute);font-weight:600;margin-bottom:5px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:6px;background:var(--panel);border:1px solid var(--line);font-size:22px;font-weight:700;flex:none}
.stepper input{text-align:center;font-size:20px;font-weight:700}
.preview{margin-top:14px;padding:12px;border-radius:6px;background:#060a14;border:1px dashed var(--gold2);display:flex;justify-content:space-between;align-items:center}
.preview b{font-family:Jost,sans-serif;font-size:24px;color:var(--gold)}
.toasts{position:fixed;top:12px;left:0;right:0;z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{max-width:520px;width:100%;background:rgba(8,16,34,.95);border:1px solid var(--gold);border-radius:4px;padding:10px 14px;font-weight:700;box-shadow:0 0 22px rgba(79,195,255,.35),0 10px 30px rgba(0,0,0,.6);animation:drop .3s cubic-bezier(.2,1.2,.4,1);display:flex;gap:10px;align-items:center}
.toast .te{font-size:22px}
.toast small{display:block;font-weight:600;color:var(--mute)}
.lvup{text-align:center;padding:10px 0}
.lvup .big{font-family:Jost,sans-serif;font-weight:900;font-size:72px;line-height:1;color:var(--gold);text-shadow:0 0 30px rgba(79,195,255,.6);animation:glow 1.6s infinite}
.lvup .cap{font-family:Jost,sans-serif;letter-spacing:.3em;color:var(--mute);font-size:13px}
.classes{display:grid;gap:10px;margin-top:8px}
.cls{display:flex;gap:12px;align-items:center;text-align:left;padding:12px;border-radius:6px;background:var(--panel);border:1px solid var(--line);width:100%}
.cls.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold2),0 0 20px rgba(79,195,255,.15)}
.cls .ce{font-size:30px;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#060a14;border:1px solid var(--gold2);flex:none}
.cls .cn{font-family:Jost,sans-serif;font-weight:700}
.cls .cd{font-size:13px;color:var(--mute)}
.intro{text-align:center;padding:30px 4px 10px}
.intro h1{font-family:Jost,sans-serif;font-weight:900;font-size:30px;color:var(--gold);letter-spacing:.06em;text-shadow:0 0 24px rgba(79,195,255,.3)}
.intro p{color:var(--mute);margin-top:6px}
.sync{font-size:11px;color:var(--dim);text-align:center;margin-top:24px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes pop{from{transform:scale(.7);opacity:0}}
@keyframes drop{from{transform:translateY(-20px);opacity:0}}
@keyframes glow{50%{text-shadow:0 0 50px rgba(79,195,255,.9)}}
@keyframes pulse{50%{opacity:.5}}
</style>
</head>

const fmt=n=>Math.round(n).toLocaleString('pt-BR');
function ymd(d=new Date()){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function addDays(s,n){const [y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1,d+n);return ymd(dt)}
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return()=>{seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

async function saveRemote(){
  if(!dbRef) return;
  if(saving){saveAgain=true;return}
  saving=true;
  try{ await dbRef.set(JSON.parse(JSON.stringify(S))); setSync('cloud'); }
  catch(e){ setSync('local'); }

}
function setSync(s){syncState=s;const el=$('#sync');if(el)el.textContent=syncLabel()}

async function initCloud(){
  try{
    if(!window.claude||typeof claude.use!=='function') return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    TV.db=db;TV.me=id;
    try{TV.owner=!!(await Promise.resolve(user.isOwner&&user.isOwner()))}catch(e){}
    subTaverna();
    const ref=db.doc('data/users/'+id+'/heroi');
    const snap=await Promise.race([ref.get(),new Promise((_,r)=>setTimeout(()=>r('timeout'),10000))]);
    dbRef=ref;
    const remote=snap&&snap.exists?snap.data():null;
    if(remote&&remote.created&&(remote.updated||0)>(S.updated||0)){
      S=migrate(JSON.parse(JSON.stringify(remote)));
      try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}

/* ================== CÁLCULOS ================== */
function classMult(ex){return CLASSES[S.cls][ex.t]}
function baseXP(ex,s,r,kg){
  if(ex.t==='cal') return s*r*ex.m*2;
  return s*r*(1+(kg||0)/30)*ex.m;
}
function streakInfo(){
  const days=[...new Set(S.log.map(e=>e.d))].sort();
  const set=new Set(days);
  const today=ymd();
  let cur=0, start=set.has(today)?today:addDays(today,-1);
  while(set.has(start)){cur++;start=addDays(start,-1)}
  let best=0,run=0,prev=null;
  for(const d of days){run=(prev&&addDays(prev,1)===d)?run+1:1;best=Math.max(best,run);prev=d}
  return {cur,best,days:days.length,trainedToday:set.has(today)};
}
function multipliers(ex){
  const st=streakInfo();
  const streakB=Math.min(st.cur,10)*0.05;
  const elixir=S.elixir===ymd()?0.5:0;
  return {cls:classMult(ex),streak:1+streakB,elixir:1+elixir,total:classMult(ex)*(1+streakB)*(1+elixir)};
}
function xpNeed(L){return Math.round(80*Math.pow(L,1.6))}
function totalXP(){return sum(S.log,e=>e.xp)+S.bonusXP}
function levelInfo(xp=totalXP()){
  let L=1,rest=xp;
  while(rest>=xpNeed(L)){rest-=xpNeed(L);L++}
  return {L,into:rest,need:xpNeed(L)};
}
function rankOf(L){let r=RANKS[0][1];for(const [l,n] of RANKS) if(L>=l) r=n;return r}
function gold(){return Math.max(0,Math.floor(sum(S.log,e=>Math.floor(e.xp/20)))+S.goldBonus-S.goldSpent)}
function attrs(){
  const a={FOR:0,RES:0,AGI:0,VIG:0};
  for(const e of S.log){const ex=EXM[e.ex];if(!ex)continue;for(const k in ex.a)a[k]+=e.xp*ex.a[k]}
  const st=streakInfo(); a.VIG=st.days*60+st.best*40;
  const out={};for(const k in a){out[k]=1+Math.floor(Math.sqrt(a[k]/12));out[k+'_raw']=a[k]}
  return out;
}
function attrProgress(raw){const lv=1+Math.floor(Math.sqrt(raw/12));const lo=12*Math.pow(lv-1,2),hi=12*Math.pow(lv,2);return (raw-lo)/(hi-lo)}
function todayEntries(){const t=ymd();return S.log.filter(e=>e.d===t)}

function ensureQuests(){
  const t=ymd();
  if(S.q.d===t&&S.q.ids.length) return;
  const pool=QUESTS.filter(q=>!q.cls||q.cls.includes(S.cls));
  const r=rng(hash(t+S.name+S.cls));
  const ids=[];const p=[...pool];
  while(ids.length<3&&p.length){ids.push(p.splice(Math.floor(r()*p.length),1)[0].id)}
  S.q={d:t,ids,claimed:[]};
}
function questReward(){const L=levelInfo().L;return {xp:Math.round(60*(1+L*0.06)),gold:25}}
function bossProgress(b){
  const es=S.log.filter(e=>b.ex.includes(e.ex));
  if(b.u==='kg'){
    const target=b.bw*(S.bw||0); if(!target) return {best:0,target:0,p:0};
    const best=Math.max(0,...es.map(e=>e.kg||0)); return {best,target:Math.round(target*10)/10,p:Math.min(1,best/target)};
  }
  const best=Math.max(0,...es.map(e=>e.r)); return {best,target:b.goal,p:Math.min(1,best/b.goal)};
}
function counters(){
  const st=streakInfo();
  return {entries:S.log.length,best:st.best,days:st.days,
    reps:sum(S.log.filter(e=>!EXM[e.ex]?.u),e=>e.s*e.r),
    vol:sum(S.log.filter(e=>EXM[e.ex]?.t==='mus'),e=>e.s*e.r*(e.kg||0)),
    level:levelInfo().L,quests:S.qTotal,bosses:Object.keys(S.bosses).length};
}

/* ================== EVENTOS DE JOGO ================== */
function afterProgress(prevLevel){
  // chefes
  for(const b of BOSSES){
    if(S.bosses[b.id]) continue;
    const p=bossProgress(b);
    if(p.p>=1&&p.target>0){
      S.bosses[b.id]=Date.now();
      const xp=300+Object.keys(S.bosses).length*50;
      S.bonusXP+=xp;S.goldBonus+=120;
      queueModal(()=>bossModal(b,xp));
    }
  }
  // conquistas
  const c=counters();
  for(const a of ACH){
    if(!S.ach[a.id]&&a.f(c)){S.ach[a.id]=Date.now();S.goldBonus+=30;toast(a.e,'Conquista desbloqueada!',a.t+' · +30 ouro')}
  }
  const L=levelInfo().L;
  if(L>prevLevel){
    const oldR=rankOf(prevLevel),newR=rankOf(L);
    queueModal(()=>levelModal(L,newR!==oldR?newR:null));
    // conquistas de nível após subir
    const c2=counters();
    for(const a of ACH){ if(!S.ach[a.id]&&a.f(c2)){S.ach[a.id]=Date.now();S.goldBonus+=30;toast(a.e,'Conquista desbloqueada!',a.t+' · +30 ouro')} }
  }
  save();
}
function logExercise(exId,s,r,kg){
  const ex=EXM[exId];const prev=levelInfo().L;
  const m=multipliers(ex);
  const xp=Math.max(1,Math.round(baseXP(ex,s,r,kg)*m.total));
  S.log.push({id:uid(),d:ymd(),ts:Date.now(),ex:exId,s,r,kg:ex.t==='mus'?kg:0,xp});
  S.last[exId]={s,r,kg};
  toast('✨','+'+fmt(xp)+' XP · +'+Math.floor(xp/20)+' ouro',ex.n+' — '+s+'×'+r+(ex.u?'s':'')+(ex.t==='mus'?' · '+kg+' kg':''));
  afterProgress(prev);
}
function claimQuest(id){
  if(S.q.claimed.includes(id)) return;
  const prev=levelInfo().L;const rw=questReward();
  S.q.claimed.push(id);S.qTotal++;S.bonusXP+=rw.xp;S.goldBonus+=rw.gold;
  toast('📯','Missão cumprida!','+'+rw.xp+' XP · +'+rw.gold+' ouro');
  if(S.q.ids.every(q=>S.q.claimed.includes(q))){S.bonusXP+=100;S.goldBonus+=50;toast('🏆','Todas as missões do dia!','Bônus: +100 XP · +50 ouro')}
  afterProgress(prev);
}
function buy(id){
  const it=SHOP.find(x=>x.id===id);if(!it||gold()<it.p)return;
  if(it.kind==='elixir'){ if(S.elixir===ymd()) return; S.elixir=ymd(); }
  else { if(S.titles.includes(it.v)) return; S.titles.push(it.v); S.title=it.v; }
  S.goldSpent+=it.p; toast(it.e,'Comprado!',it.n); save(); render();
}

const TV={db:null,me:null,owner:false,ready:false,docs:[],err:'',canWrite:true,unsub:null,draft:'',chan:'geral'};
let tvChain=Promise.resolve();
function subTaverna(){
  if(TV.unsub||!TV.db) return;
  const t=setTimeout(()=>{if(!TV.ready){TV.err='A Taverna está demorando para carregar. Verifique sua conexão.';paintFeed()}},10000);
  try{
    TV.unsub=TV.db.collection('taverna').onSnapshot(snap=>{
      TV.docs=snap.docs.filter(d=>d.exists).map(d=>Object.assign({},d.data()||{},{uid:d.id}));
      TV.ready=true;if(!snap.metadata||!snap.metadata.fromCache){TV.err='';clearTimeout(t)}
      paintFeed();
    },e=>{clearTimeout(t);TV.err='Não foi possível carregar a Taverna agora.';paintFeed()});
  }catch(e){clearTimeout(t);TV.err='Não foi possível carregar a Taverna agora.'}
}
function tvErr(e){
  if(e&&e.code==='invalid_argument'){TV.canWrite=false;toast('🔒','Você só pode ler a Taverna','Peça ao dono do app para te convidar como editor');if(tab==='taverna')render()}
  else if(e&&e.code==='quota_exceeded') toast('⚠️','A Taverna está cheia','Apague posts antigos para liberar espaço');
  else toast('⚠️','Não foi possível enviar','Tente de novo em instantes');
}
function heroSnap(){const li=levelInfo();return {name:S.name||'Herói',cls:S.cls,level:li.L,rank:rankOf(li.L),title:S.title||'',elite:isElite(),season:{k:seasonKey(),xp:seasonXP()}}}
function writeMine(mut){
  if(!TV.db||!TV.me) return;
  tvChain=tvChain.then(async()=>{
    const cur=TV.docs.find(d=>d.uid===TV.me);
    const doc=cur?JSON.parse(JSON.stringify(cur)):{};
    delete doc.uid;
    doc.posts=Array.isArray(doc.posts)?doc.posts:[];doc.likes=(doc.likes&&typeof doc.likes==='object')?doc.likes:{};
    mut(doc);
    doc.posts=doc.posts.slice(-100);
    const lk=Object.keys(doc.likes);if(lk.length>400){for(const k of lk.slice(0,lk.length-400))delete doc.likes[k]}
    doc.hero=heroSnap();doc.updated=Date.now();
    await TV.db.doc('taverna/'+TV.me).set(doc);
  }).catch(tvErr);
  return tvChain;
}
function modDelete(uid,pid){
  tvChain=tvChain.then(async()=>{
    const d=TV.docs.find(x=>x.uid===uid);if(!d)return;
    const doc=JSON.parse(JSON.stringify(d));delete doc.uid;
    doc.posts=(doc.posts||[]).filter(p=>p.id!==pid);
    await TV.db.doc('taverna/'+uid).set(doc);
  }).catch(tvErr);
}
function tvPost(text,kind,data,replyTo,vip){
  text=String(text||'').trim().slice(0,500);
  if(!text&&!kind) return false;
  const p={id:uid(),ts:Date.now(),text,kind:kind||'text'};
  if(data)p.data=data;if(replyTo)p.replyTo=replyTo;if(vip||(!replyTo&&TV.chan==='vip'&&isElite()))p.vip=true;
  writeMine(doc=>doc.posts.push(p));
  return true;
}
function workoutShare(){

  const items=es.map(e=>{const ex=EXM[e.ex]||{n:e.ex};return {n:ex.n,s:e.s,r:e.r,kg:ex.t==='mus'?e.kg:0,u:ex.u?'s':''}}).slice(0,12);
  return {xp:sum(es,e=>e.xp),items};
}
function ago(ts){
  const s=Math.max(0,(Date.now()-ts)/1000);
  if(s<60)return 'agora';if(s<3600)return Math.floor(s/60)+' min';if(s<86400)return Math.floor(s/3600)+' h';
  if(s<86400*7)return Math.floor(s/86400)+' d';const d=new Date(ts);return d.toLocaleDateString('pt-BR');
}
function feedData(){
  const all=[],likes={};
  for(const d of TV.docs){
    const hero=(d.hero&&typeof d.hero==='object')?d.hero:{};
    for(const p of (Array.isArray(d.posts)?d.posts:[])){
      if(!p||typeof p!=='object'||typeof p.id!=='string')continue;
      all.push({id:p.id,ts:+p.ts||0,text:String(p.text||'').slice(0,500),kind:String(p.kind||'text'),data:p.data,replyTo:typeof p.replyTo==='string'?p.replyTo:null,vip:!!p.vip,uid:d.uid,key:d.uid+':'+p.id,hero});
    }
    if(d.likes&&typeof d.likes==='object')for(const k in d.likes)(likes[k]=likes[k]||new Set()).add(d.uid);
  }
  const keys=new Set(all.map(p=>p.key));
  const top=all.filter(p=>!p.replyTo&&(TV.chan==='vip'?p.vip:!p.vip)).sort((a,b)=>b.ts-a.ts).slice(0,80);
  const reps={};for(const p of all)if(p.replyTo&&keys.has(p.replyTo))(reps[p.replyTo]=reps[p.replyTo]||[]).push(p);
  for(const k in reps)reps[k].sort((a,b)=>a.ts-b.ts);
  return {top,reps,likes};
}

  const d=p.data;if(!d||typeof d!=='object')return '';

  }
  if(p.kind==='nivel'){
    return `<div class="share-card">🏅 <b>Nível ${+d.level||1}</b> · ${esc(d.rank||'')} · ${fmt(+d.xp||0)} XP total · 🔥 ${+d.streak||0} dias seguidos · ${+d.bosses||0} chefes derrotados</div>`;
  }
  return '';
}

const DG_POOL={
  monge:{A:[['flexao',1],['paralelas',1],['flexao_diam',2],['pike',2],['flexao_arq',3],['flexao_1b',4]],B:[['australiana',1],['chinup',1],['barra',2],['elev_pernas',3],['lsit',3]],C:[['agach',1],['afundo',1],['abdominal',1],['prancha',1],['bulgaro',2],['pistol',4]]},
  guerreiro:{A:[['supino',1],['desenv',1],['triceps',1],['supino_incl',2],['elev_lat',2],['triceps_testa',3]],B:[['terra',1],['remada',1],['rosca',1],['puxada',2],['martelo',2],['remada_baixa',3]],C:[['agach_barra',1],['legpress',1],['panturrilha',1],['stiff',2],['extensora',2],['flexora',3]]},
  paladino:{A:[['supino',1],['flexao',1],['paralelas',2],['desenv',2],['flexao_diam',3]],B:[['australiana',1],['remada',1],['barra',2],['rosca',2],['chinup',3]],C:[['agach_barra',1],['prancha',1],['bulgaro',2],['elev_pernas',3],['pistol',4]]}
};
const DG_NAMES={A:'Empurrar',B:'Puxar',C:'Pernas e Core'};
function dgDay(d){
  const w=Math.min(4,Math.ceil(d/7));
  if(d%7===0) return {d,rest:true,name:'Descanso ativo',items:[{ex:'prancha',s:3,r:20+10*w},{ex:'polichinelo',s:2,r:40}]};
  const k='ABC'[(d-Math.floor(d/7)-1)%3];
  const pool=DG_POOL[S.cls][k].filter(x=>w>=x[1]);
  const chosen=pool.slice().sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>x[0]);
  const items=pool.filter(x=>chosen.includes(x[0])).map(([id])=>{const ex=EXM[id];let r;
    if(ex.u==='s') r=(ex.tier>=3?8:20)+(ex.tier>=3?3:10)*(w-1);
    else if(ex.t==='mus') r=[12,10,8,6][w-1];
    else {const base=ex.tier>=4?3:ex.tier===3?5:ex.tier===2?8:12;r=Math.round(base*(1+0.2*(w-1)))}
    return {ex:id,s:w>=3?4:3,r}});
  return {d,name:DG_NAMES[k],items};
}
function dgCurrent(){let d=1;while(S.dg.done[d]&&d<=30)d++;return d}
function dgAvailable(d){if(d>30)return false;if(d===1)return true;const prev=S.dg.done[d-1];return !!prev&&prev<ymd()}
function dgItemDone(it){return todayEntries().some(e=>e.ex===it.ex)}
function dgComplete(){
  const d=dgCurrent();const day=dgDay(d);
  if(!dgAvailable(d)||!day.items.every(dgItemDone)) return;
  const prev=levelInfo().L;const xp=120+d*8;
  S.dg.done[d]=ymd();S.bonusXP+=xp;S.goldBonus+=40;
  toast('🗺️','Dia '+d+' da Dungeon concluído!','+'+xp+' XP · +40 ouro');
  if(d===30){S.bonusXP+=1000;if(!S.titles.includes('Conquistador da Dungeon'))S.titles.push('Conquistador da Dungeon');toast('👑','DUNGEON CONQUISTADA!','+1.000 XP e o título “Conquistador da Dungeon”')}
  afterProgress(prev);render();
}

   <div style="margin-top:12px;font-size:13.5px;color:#bfe9ff">Recompensa do dia: +${120+d*8} XP e 40 ouro</div>

   ${t('diario','📖','Diário','Histórico de treinos')}<button class="tile" data-a="settings"><span class="te2">⚙️</span><b>Ficha</b><small>Nome, classe e plano</small></button>

/* ================== TIMER ================== */
function tickTimer(){
  const el=$('#clock');if(!el)return;
  if(!timerEnd){el.textContent='--:--';el.classList.remove('done');return}
  const left=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));
  el.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
  el.classList.toggle('done',left===0);
}
function startTimer(sec){
  timerEnd=Date.now()+sec*1000;clearInterval(timerInt);
  timerInt=setInterval(()=>{tickTimer();if(Date.now()>=timerEnd){clearInterval(timerInt);toast('⏱️','Descanso terminado!','Hora da próxima série');try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}},250);
  tickTimer();
}

/* ================== EVENTOS ================== */
document.addEventListener('click',ev=>{
  const t=ev.target;
  if(t.matches('[data-scrim]')){ if(!modalOpen) closeModal(); return; }
  const tb=t.closest('[data-tab]');if(tb){tab=tb.dataset.tab;closeModal();render();window.scrollTo(0,0);return}
  const b=t.closest('[data-a]');if(!b)return;
  const a=b.dataset.a;
  switch(a){
    case 'close': closeModal(); break;
    case 'ok': {const f=window.__ok;window.__ok=null;closeModal();f&&f();break}
    case 'pickCls':{
      window.__clsPick=b.dataset.c;
      b.parentElement.querySelectorAll('.cls').forEach(x=>x.classList.toggle('on',x===b));
      if(!S.created){window.__cname=$('#c_name').value;window.__cbw=$('#c_bw').value;render()}
      break}
    case 'create':{
      const name=$('#c_name').value.trim();if(!name){$('#c_name').focus();$('#c_name').style.borderColor='var(--red)';return}
      S=blank();S.created=true;S.name=name;S.bw=+$('#c_bw').value||0;S.cls=window.__clsPick||'paladino';
      S.goldBonus=50;save();tab='heroi';render();toast('⚒️','Bem-vindo, '+name+'!','Você recebeu 50 ouro para começar');break}
    case 'settings': settingsSheet(); break;
    case 'saveSettings':{
      const n=$('#s_name').value.trim();if(n)S.name=n;S.bw=+$('#s_bw').value||0;S.title=$('#s_title').value;
      if(window.__clsPick&&window.__clsPick!==S.cls){S.cls=window.__clsPick;S.q.d=''}
      save();closeModal();render();toast('📜','Ficha atualizada');break}
    case 'copyBk':{
      const txt=JSON.stringify(S);const ta=$('#s_bk');
      const done=()=>toast('📋','Backup copiado','Guarde em um lugar seguro');
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,()=>{ta.value=txt;ta.select();toast('📋','Selecione e copie o texto')})}
      else{ta.value=txt;ta.select();toast('📋','Selecione e copie o texto')}
      break}
    case 'loadBk':{
      try{const o=JSON.parse($('#s_bk').value);if(!o||!Array.isArray(o.log))throw 0;
        confirmModal('Isso substitui todo o progresso atual pelo backup colado.',()=>{S=migrate(o);S.created=true;save();render();toast('⤵️','Backup restaurado')},'Restaurar');
      }catch(e){toast('⚠️','Backup inválido','Cole o texto completo copiado antes')}
      break}
    case 'reset': confirmModal('Todo o seu progresso (níveis, diário, ouro, chefes) será apagado.',()=>{const k=S.updated;S=blank();S.updated=Date.now();save();render()},'Apagar tudo'); break;
    case 'type': trainType=b.dataset.v;trainGroup='Todos';render();break;
    case 'group': trainGroup=b.dataset.v;render();break;
    case 'ex': exerciseSheet(b.dataset.id);break;
    case 'step':{const inp=$('#'+b.dataset.t);const d=+b.dataset.d;inp.value=Math.max(0,Math.round(((+inp.value||0)+d)*100)/100);updatePreview();break}
    case 'log':{
      const {ex,s,r,kg}=readSheet();if(!s||!r){toast('⚠️','Informe séries e repetições');return}
      closeModal();logExercise(ex.id,s,r,kg);render();
      startTimer(ex.t==='mus'?90:60);break}
    case 'del': confirmModal('Apagar este registro? O XP e o ouro dele serão removidos.',()=>deleteEntry(b.dataset.id),'Apagar'); break;
    case 'claim': claimQuest(b.dataset.id);render();break;
    case 'buy': buy(b.dataset.id);break;
    case 'timer': startTimer(+b.dataset.v);break;
    case 'elite': eliteModal(b.dataset.f||'');break;
    case 'activate':{const c=$('#e_code').value;if(activateElite(c)){closeModal();render();queueModal(()=>openModal(`<div class="lvup"><img class="lv-art" src="${ART.full[S.cls]}" alt=""><div class="cap">[ SISTEMA ]</div><div class="cap" style="margin-top:4px;color:#ffc65a">CLASSE DESPERTADA</div><h3 style="margin-top:8px;color:#ffc65a">👑 Caçador Elite</h3><p class="muted" style="margin:10px 0 18px">Dungeon, ranking, progressão, planilha e Taverna VIP liberados. Você ganhou o título “Fundador da Forja” e 300 de ouro.</p><button class="btn gold full" data-a="close">Entrar na Dungeon</button></div>`,true))}else{toast('⚠️','Código inválido','Confira o código que chegou no seu e-mail')}break}
    case 'dgLog':{const id=b.dataset.id;const l=S.last[id]||{};exerciseSheet(id,{s:+b.dataset.s,r:+b.dataset.r,kg:l.kg||20});break}
    case 'dgDone': dgComplete();break;
    case 'dgReset': confirmModal('Recomeçar a Dungeon do dia 1? Seu progresso de treinos continua salvo.',()=>{S.dg={done:{}};save();render()},'Recomeçar');break;
    case 'tvChan': TV.chan=b.dataset.v;render();break;
    case 'tvPost':{const t=$('#tv_text');if(tvPost(t.value)){TV.draft='';t.value='';toast('🍺','Postado na Taverna')}else t.focus();break}
    case 'tvShare':{const d=workoutShare();if(!d){toast('⚔️','Nenhum treino hoje ainda','Registre uma série na aba Treinar');break}
      const t=$('#tv_text');tvPost(t.value,'treino',d);TV.draft='';t.value='';toast('⚔️','Treino compartilhado!');break}
    case 'tvLevel':{const li=levelInfo(),st=streakInfo();const t=$('#tv_text');
      tvPost(t.value,'nivel',{level:li.L,rank:rankOf(li.L),xp:totalXP(),streak:st.cur,bosses:Object.keys(S.bosses).length});TV.draft='';t.value='';toast('🏅','Nível compartilhado!');break}
    case 'tvLike':{const k=b.dataset.k;writeMine(doc=>{if(doc.likes[k])delete doc.likes[k];else doc.likes[k]=1});break}
    case 'tvReply': replySheet(b.dataset.k);break;
    case 'tvSendReply':{const t=$('#tv_reply');if(tvPost(t.value,null,null,window.__replyTo)){closeModal();toast('💬','Resposta enviada')}else t.focus();break}
    case 'tvDel':{const u=b.dataset.u,id=b.dataset.id;
      confirmModal('Apagar este post da Taverna?',()=>{if(u===TV.me)writeMine(doc=>{doc.posts=doc.posts.filter(p=>p.id!==id)});else modDelete(u,id)},'Apagar');break}
  }
});

let FH_TAB='login',FH_BUSY=false,FH_MSG='';
function fhShim(uid,admin){
  const tavSnap=async()=>{const {data,error}=await FH.from('fh_taverna').select('user_id,doc');if(error)throw error;
    return {docs:(data||[]).map(r=>({id:r.user_id,exists:true,data:()=>r.doc||{}})),metadata:{fromCache:false,hasPendingWrites:false}}};
  const db={
    collection(path){return {onSnapshot(next,err){let alive=true;const pull=()=>tavSnap().then(s=>alive&&next(s)).catch(e=>alive&&err&&err({code:'unavailable',message:String(e.message||e)}));pull();
      const ch=FH.channel('fh-tav').on('postgres_changes',{event:'*',schema:'public',table:'fh_taverna'},()=>pull()).subscribe();
      const iv=setInterval(pull,30000);return ()=>{alive=false;clearInterval(iv);FH.removeChannel(ch)}}}},
    doc(path){const parts=path.split('/');
      if(parts[0]==='taverna'){const id=parts[1];return {async set(d){const {error}=await FH.from('fh_taverna').upsert({user_id:id,doc:d,updated_at:new Date().toISOString()});if(error)throw {code:/row-level|permission/i.test(error.message)?'invalid_argument':'unavailable',message:error.message}}}}
      return {async get(){const {data,error}=await FH.from('fh_saves').select('data').eq('user_id',uid).maybeSingle();if(error)throw error;return {exists:!!data,data:()=>data?data.data:undefined}},
              async set(d){const {error}=await FH.from('fh_saves').upsert({user_id:uid,data:d,updated_at:new Date().toISOString()});if(error)throw error}}}
  };
  const user={id:async()=>uid,isOwner:()=>admin};
  window.claude={use:async(n)=>n==='db'?db:n==='user'?user:null};
}

  const btn=(t,k)=>`<button class="${FH_TAB===k?'on':''}" data-a="fhTab" data-v="${k}">${t}</button>`;
  return `<div class="cbanner"><img src="${ART.keyart}" alt="Os três heróis: Monge, Paladino e Guerreiro"><div class="cb-t"><span class="tag">[ SISTEMA ] · IDENTIFIQUE-SE, JOGADOR</span><h1>FORJA DO HERÓI</h1><p>Entre para continuar a sua jornada de onde parou.</p></div></div>

   <p class="muted" style="font-size:13.5px;margin:8px 0 0">${FH_TAB==='signup'?'Comprou agora? Use o <b>mesmo e-mail da compra</b> e crie uma senha. Seu acesso é liberado na hora.':'Use o e-mail da compra e a senha que você criou no primeiro acesso.'}</p>

   ${FH_TAB==='login'?`<p class="dim" style="font-size:12.5px;text-align:center;margin-top:12px">Esqueceu a senha? Fale com o suporte pelo e-mail informado na sua compra.</p>`:''}

}
function fhRenderLogin(){$('#nav').hidden=true;$('#app').innerHTML=fhView();const f=$('#fhForm');if(f)f.onsubmit=fhSubmit;}
async function fhSubmit(ev){
  ev.preventDefault();if(FH_BUSY)return;
  const email=$('#fh_e').value.trim().toLowerCase(),pass=$('#fh_p').value;window.__fhE=email;
  FH_BUSY=true;FH_MSG='';fhRenderLogin();
  try{
    if(FH_TAB==='signup'){
      const r=await fetch(FH_URL+'/functions/v1/fh-signup',{method:'POST',headers:{'Content-Type':'application/json',apikey:FH_KEY},body:JSON.stringify({email,password:pass})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok){if(j.code==='exists')FH_TAB='login';throw new Error(j.error||'Não foi possível criar o acesso')}
    }
    const {error}=await FH.auth.signInWithPassword({email,password:pass});
    if(error)throw new Error(/invalid/i.test(error.message)?'E-mail ou senha incorretos.':error.message);
    FH_BUSY=false;await fhAfterLogin();
  }catch(e){FH_BUSY=false;FH_MSG=esc(e.message||String(e));fhRenderLogin();}
}
async function fhAfterLogin(){
  const {data:{session}}=await FH.auth.getSession();if(!session)return fhRenderLogin();
  const {data:me,error}=await FH.rpc('fh_me');
  if(error){FH_MSG='Não foi possível conferir o seu acesso. Verifique a internet e tente de novo.';return fhRenderLogin();}
  if(!me||!me.plan){await FH.auth.signOut();FH_MSG='Não encontramos uma compra aprovada com este e-mail. Se pagou por Pix agora, aguarde 1 ou 2 minutos e tente de novo.';return fhRenderLogin();}
  const uid=session.user.id;window.__FH_EMAIL=session.user.email;window.__FH_PLAN=me.plan;
  if(S.ownerUid&&S.ownerUid!==uid){S=blank();}
  S.ownerUid=uid;
  fhShim(uid,!!me.admin);
  render();initCloud();
}
const _fhRender=render;
render=function(){if(!window.__FH_PLAN)return fhRenderLogin();if(S.plan!==window.__FH_PLAN){S.plan=window.__FH_PLAN;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}return _fhRender();};
document.addEventListener('click',async ev=>{const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='fhTab'){FH_TAB=b.dataset.v;FH_MSG='';fhRenderLogin();}
  if(a==='fhLogout'){closeModal();await FH.auth.signOut();try{localStorage.removeItem(KEY)}catch(e){}location.reload();}
  if(a==='fhRefresh'){const {data:me}=await FH.rpc('fh_me');if(me&&me.plan){window.__FH_PLAN=me.plan;closeModal();render();toast(me.plan==='elite'?'👑':'⚔️',me.plan==='elite'?'Caçador Elite liberado!':'Ainda não encontramos a compra do Elite',me.plan==='elite'?'Todos os recursos foram desbloqueados':'Aguarde 1 ou 2 minutos e tente de novo')}}
});
(async()=>{const {data:{session}}=await FH.auth.getSession();if(session)fhAfterLogin();else fhRenderLogin();})();
