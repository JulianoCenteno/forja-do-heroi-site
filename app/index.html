const SFX={ctx:null,on:(()=>{try{return localStorage.getItem('fh_sound')!=='0'}catch(e){return true}})()};
function sfxCtx(){if(!SFX.ctx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;SFX.ctx=new A();}if(SFX.ctx.state==='suspended')SFX.ctx.resume();return SFX.ctx}
['pointerdown','touchstart','keydown'].forEach(t=>window.addEventListener(t,()=>{if(SFX.on)sfxCtx()},{passive:true}));
function tone(f,t0,d,{type='triangle',vol=.18,f2=null,attack=.01,dest=null}={}){
  const c=SFX.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+attack);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  o.connect(g);g.connect(dest||SFX.bus);o.start(t0);o.stop(t0+d+.05);
}
function noise(t0,d,{vol=.25,freq=900,q=.8}={}){
  const c=SFX.ctx,n=c.sampleRate*d,b=c.createBuffer(1,n,c.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=freq;f.Q.value=q;g.gain.value=vol;s.connect(f);f.connect(g);g.connect(SFX.bus);s.start(t0);
}
const N=n=>440*Math.pow(2,(n-69)/12); // nota MIDI -> Hz
function chord(ns,t,d,o){ns.forEach(n=>tone(N(n),t,d,o))}
function horn(n,t,d,vol=.12){tone(N(n),t,d,{type:'sawtooth',vol,attack:.03});tone(N(n),t,d,{type:'square',vol:vol*.5,attack:.03});tone(N(n-12),t,d,{type:'triangle',vol:vol*1.2,attack:.03})}
function sfxBus(c){
  if(!SFX.bus){const comp=c.createDynamicsCompressor(),lp=c.createBiquadFilter(),m=c.createGain();lp.type='lowpass';lp.frequency.value=6500;m.gain.value=.9;lp.connect(comp);comp.connect(m);m.connect(c.destination);SFX.bus=lp;}
}
function sfxSynth(kind){
  const c=SFX.ctx;sfxBus(c);
  const t=c.currentTime+.02;
  switch(kind){
    case 'xp': // série registrada: moeda brilhante
      tone(N(88),t,.12,{type:'square',vol:.08});tone(N(93),t+.07,.32,{type:'square',vol:.08});tone(N(100),t+.07,.3,{vol:.06});break;
    case 'coin':
      tone(N(84),t,.09,{type:'square',vol:.07});tone(N(91),t+.06,.25,{type:'square',vol:.07});break;
    case 'quest': // missão cumprida: arpejo heroico
      [72,76,79].forEach((n,i)=>tone(N(n),t+i*.09,.22,{type:'square',vol:.08}));chord([72,76,79,84],t+.27,.7,{vol:.08});tone(N(96),t+.27,.5,{vol:.05});break;
    case 'allquests': // todas as missões do dia
      [67,72,76,79,84].forEach((n,i)=>tone(N(n),t+i*.08,.2,{type:'square',vol:.08}));chord([72,76,79,84,88],t+.42,1.2,{vol:.07});
      [96,100,103].forEach((n,i)=>tone(N(n),t+.5+i*.07,.25,{vol:.04}));break;
    case 'alquimia': // poção borbulhando
      for(let i=0;i<7;i++){const f=N(70+Math.floor(Math.random()*14));tone(f,t+i*.07,.12,{type:'sine',vol:.12,f2:f*1.8})}
      chord([79,83,86],t+.5,.6,{type:'sine',vol:.06});break;
    case 'dungeon': // dia da Dungeon concluído: trompas + tambor
      noise(t,.25,{vol:.35,freq:180});noise(t+.18,.2,{vol:.25,freq:220});
      horn(67,t,.18);horn(67,t+.18,.12);horn(72,t+.32,.18);horn(76,t+.52,.6);
      chord([60,64,67,72],t+.52,1.1,{vol:.05});break;
    case 'dungeonfinal': // Dungeon conquistada (dia 30)
      [0,.2,.4].forEach(d=>noise(t+d,.3,{vol:.4,freq:160}));
      horn(67,t,.2);horn(72,t+.2,.2);horn(76,t+.4,.2);horn(79,t+.6,.5);horn(76,t+1.1,.18);horn(79,t+1.28,.18);horn(84,t+1.46,1.4,.14);
      chord([60,67,72,76,84],t+1.46,1.8,{vol:.05});[96,100,103,108].forEach((n,i)=>tone(N(n),t+1.6+i*.08,.3,{vol:.035}));break;
    case 'levelup': // subiu de nível: escada brilhante
      [60,64,67,72,76,79,84].forEach((n,i)=>tone(N(n),t+i*.06,.2,{type:'square',vol:.07}));
      chord([72,76,79,84],t+.45,1.3,{vol:.07});[91,96,100].forEach((n,i)=>tone(N(n),t+.5+i*.1,.4,{type:'sine',vol:.05}));break;
    case 'boss': // chefe derrotado: impacto + vitória
      noise(t,.5,{vol:.6,freq:120});tone(N(36),t,.6,{type:'sine',vol:.35,f2:N(24)});
      horn(60,t+.35,.22);horn(67,t+.57,.22);horn(72,t+.79,1.2,.14);chord([48,55,60,64,67],t+.79,1.4,{vol:.05});break;
    case 'achievement': // conquista desbloqueada: brilho
      [84,88,91,96].forEach((n,i)=>tone(N(n),t+i*.07,.35,{type:'sine',vol:.08}));tone(N(103),t+.3,.6,{type:'sine',vol:.05});break;
    case 'timer': // descanso terminado
      [0,.25].forEach(d=>{tone(N(81),t+d,.15,{type:'square',vol:.09});tone(N(88),t+d+.08,.15,{type:'square',vol:.07})});break;
    case 'elite':
      chord([60,67,72],t,.4,{type:'sawtooth',vol:.04});[72,76,79,84,88,91].forEach((n,i)=>tone(N(n),t+.1+i*.07,.3,{type:'square',vol:.06}));chord([72,79,84,88],t+.55,1.4,{vol:.07});break;
  }
}

/* ---- trilha orquestral (arquivos em /app/audio, composições próprias) ---- */
const AUD='/app/audio/';
const SFX_FILES=['xp','coin','quest','allquests','alquimia','achievement','levelup','dungeon','dungeonfinal','boss','timer','elite'];
SFX.buf={};SFX.loading=false;
function sfxPreload(){
  if(SFX.loading||!SFX.ctx)return;SFX.loading=true;
  SFX_FILES.forEach(k=>fetch(AUD+k+'.mp3').then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(a=>new Promise((ok,no)=>SFX.ctx.decodeAudioData(a,ok,no))).then(b=>{SFX.buf[k]=b}).catch(()=>{}));
}
function sfx(kind){
  if(!SFX.on)return;const c=sfxCtx();if(!c)return;sfxPreload();
  const b=SFX.buf[kind];
  if(!b){try{sfxSynth(kind)}catch(e){}return}
  const src=c.createBufferSource(),g=c.createGain();g.gain.value=.85;src.buffer=b;src.connect(g);g.connect(c.destination);src.start();
  musicDuck(Math.min(b.duration,6));
}
/* ---- música ambiente: Dungeon (trilha própria) e Taverna (gravações reais CC0) ---- */
const AUD_CDN='https://lpdicrpetxqnoxceozfa.supabase.co/storage/v1/object/public/fh-audio/';
const MUS={on:(()=>{try{return localStorage.getItem('fh_music')!=='0'}catch(e){return true}})(),cur:null,gain:null,layers:[],buf:{},vol:1,
  tracks:{
    dungeon:[{u:AUD+'dungeon_loop.mp3',v:.42,len:40}],
    taverna:[{u:AUD_CDN+'old_tower_inn.mp3',v:.34,xf:4},   // "The Old Tower Inn" — RandomMind (CC0, OpenGameArt)
             {u:AUD_CDN+'tavern_crowd.mp3',v:.55,xf:3},    // gravação real de taverna — ivolipa (CC0, Freesound)
             {u:AUD_CDN+'fireplace.mp3',v:.16,xf:3}]       // lareira — HECKFRICKER (CC0, Freesound)
  }};
function musicLoad(u){
  if(!MUS.buf[u])MUS.buf[u]=fetch(u).then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(a=>new Promise((ok,no)=>SFX.ctx.decodeAudioData(a,ok,no))).catch(e=>{delete MUS.buf[u];throw e});
  return MUS.buf[u];
}
/* toca um buffer em loop: emenda nativa (len) ou com crossfade (xf segundos) */
function loopLayer(b,L,dest){
  const c=SFX.ctx,ctl={alive:true,srcs:[],timer:null};
  const g0=c.createGain();g0.gain.value=L.v;g0.connect(dest);
  if(!L.xf){const s=c.createBufferSource();s.buffer=b;s.loop=true;s.loopEnd=Math.min(b.duration,L.len||b.duration);s.connect(g0);s.start();ctl.srcs.push(s);}
  else{
    const xf=Math.min(L.xf,b.duration/3),step=b.duration-xf;
    const play=(t,first)=>{
      if(!ctl.alive)return;
      const s=c.createBufferSource(),g=c.createGain();s.buffer=b;s.connect(g);g.connect(g0);
      g.gain.setValueAtTime(first?1:0,t);if(!first)g.gain.linearRampToValueAtTime(1,t+xf);
      g.gain.setValueAtTime(1,t+step);g.gain.linearRampToValueAtTime(0,t+b.duration);
      s.start(t);s.stop(t+b.duration+.05);
      ctl.srcs=ctl.srcs.filter(x=>x.__end>c.currentTime);s.__end=t+b.duration;ctl.srcs.push(s);
      const next=t+step;
      ctl.timer=setTimeout(()=>play(next,false),Math.max(0,(next-c.currentTime-2)*1000));
    };
    play(c.currentTime+.05,true);
  }
  ctl.stop=t=>{ctl.alive=false;clearTimeout(ctl.timer);ctl.srcs.forEach(s=>{try{s.stop(t)}catch(e){}})};
  return ctl;
}
function musicStop(){
  if(!MUS.gain)return;const c=SFX.ctx,g=MUS.gain,ls=MUS.layers;MUS.gain=null;MUS.layers=[];
  try{const t=c.currentTime;g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(0,t+.9)}catch(e){}
  ls.forEach(l=>l.stop(c.currentTime+1));
}
function musicSync(){
  const want=(SFX.on&&MUS.on&&!document.hidden&&MUS.tracks[tab])?tab:null;
  if(want===MUS.cur)return;
  MUS.cur=want;musicStop();
  if(!want)return;const c=sfxCtx();if(!c)return;
  const g=c.createGain();g.gain.setValueAtTime(0,c.currentTime);g.gain.linearRampToValueAtTime(MUS.vol,c.currentTime+2);g.connect(c.destination);MUS.gain=g;
  MUS.tracks[want].forEach(L=>musicLoad(L.u).then(b=>{if(MUS.cur!==want||MUS.gain!==g)return;MUS.layers.push(loopLayer(b,L,g))}).catch(()=>{}));
}
function musicDuck(sec){
  if(!MUS.gain)return;const c=SFX.ctx,g=MUS.gain.gain,t=c.currentTime;
  try{g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(MUS.vol*.25,t+.15);g.setValueAtTime(MUS.vol*.25,t+sec*.8);g.linearRampToValueAtTime(MUS.vol,t+sec+.8)}catch(e){}
}
function toggleMusic(){MUS.on=!MUS.on;try{localStorage.setItem('fh_music',MUS.on?'1':'0')}catch(e){}if(MUS.on&&!SFX.on){SFX.on=true;try{localStorage.setItem('fh_sound','1')}catch(e){}}render();}
function musicBtn(){return `<button class="musbtn" data-a="music">${MUS.on&&SFX.on?'🎵 Música ligada':'🔇 Música desligada'}</button>`}
document.addEventListener('visibilitychange',()=>{if(SFX.ctx){if(document.hidden)SFX.ctx.suspend&&SFX.ctx.suspend();else SFX.ctx.resume&&SFX.ctx.resume()}});

function toggleSound(){SFX.on=!SFX.on;try{localStorage.setItem('fh_sound',SFX.on?'1':'0')}catch(e){}if(SFX.on)sfx('coin');render();toast(SFX.on?'🔊':'🔇',SFX.on?'Sons ligados':'Sons desligados');}
</script>
